<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资讯日报 · {DATE_LABEL}</title>
<style>
  :root{
    --bg:#0f1117; --bg-soft:#171a22; --card:#1b1f29; --card-hover:#222736;
    --text:#e8eaf0; --muted:#9aa3b6; --border:#2a2f3c; --shadow:0 6px 24px rgba(0,0,0,.38);
    --hero-grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 45%,#db2777 100%);
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6fb; --bg-soft:#ffffff; --card:#ffffff; --card-hover:#f1f3fa;
      --text:#171a22; --muted:#5b6573; --border:#e7eaf2; --shadow:0 6px 22px rgba(30,40,80,.10);
      --hero-grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 45%,#ec4899 100%); }
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}

  /* ---------- HERO ---------- */
  .hero{background:var(--hero-grad);color:#fff;padding:38px 22px 30px;text-align:center;position:relative;overflow:hidden;}
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% -20%,rgba(255,255,255,.18),transparent 60%);pointer-events:none;}
  .hero .kicker{font-size:13px;letter-spacing:.32em;text-transform:uppercase;opacity:.85;margin:0 0 6px;}
  .hero h1{margin:0;font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:.02em;}
  .hero .date-big{font-size:clamp(20px,4vw,30px);font-weight:700;margin:14px 0 2px;}
  .hero .window{font-size:14px;opacity:.92;margin:0 0 18px;}
  .stat-total{display:inline-flex;align-items:baseline;gap:8px;background:rgba(255,255,255,.16);
    backdrop-filter:blur(6px);padding:8px 18px;border-radius:999px;font-size:15px;margin-bottom:20px;}
  .stat-total b{font-size:24px;font-weight:800;}
  .sec-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:920px;margin:0 auto;}
  .sec-chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.22);padding:6px 13px;border-radius:999px;font-size:13px;cursor:pointer;transition:.15s;}
  .sec-chip:hover{background:rgba(255,255,255,.26);}
  .sec-chip .dot{width:9px;height:9px;border-radius:50%;}
  .sec-chip b{font-weight:700;}

  /* ---------- ANCHOR NAV ---------- */
  .nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;gap:6px;
    padding:10px 14px;overflow-x:auto;scrollbar-width:none;}
  .nav::-webkit-scrollbar{display:none;}
  .nav a{flex:0 0 auto;font-size:13.5px;color:var(--muted);padding:7px 12px;border-radius:9px;
    border:1px solid transparent;white-space:nowrap;transition:.15s;}
  .nav a:hover{color:var(--text);background:var(--card-hover);border-color:var(--border);}
  .nav .totop{margin-left:auto;color:var(--muted);}

  /* ---------- SECTIONS ---------- */
  main{max-width:1180px;margin:0 auto;padding:26px 16px 60px;}
  .section{margin:30px 0 8px;scroll-margin-top:64px;}
  .section-head{display:flex;align-items:center;gap:12px;margin:0 0 16px;}
  .section-head .bar{width:5px;height:26px;border-radius:3px;background:var(--sec);}
  .section-head h2{margin:0;font-size:20px;font-weight:800;}
  .section-head .cnt{margin-left:auto;font-size:13px;color:var(--muted);background:var(--card);
    border:1px solid var(--border);padding:3px 11px;border-radius:999px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:16px 16px 14px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;transition:.18s;position:relative;overflow:hidden;}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sec);opacity:.85;}
  .card:hover{transform:translateY(-3px);background:var(--card-hover);}
  .card .top{display:flex;align-items:center;gap:10px;}
  .num{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--sec);color:#fff;
    font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .src{margin-left:auto;font-size:12px;color:var(--muted);background:var(--bg-soft);
    border:1px solid var(--border);padding:3px 10px;border-radius:999px;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card h3{margin:2px 0 0;font-size:16px;font-weight:700;line-height:1.45;}
  .card h3 a:hover{text-decoration:underline;text-decoration-color:var(--sec);}
  .card .sum{margin:0;font-size:14px;color:var(--muted);flex:1;}
  .card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;}
  .card .read{font-size:13px;font-weight:600;color:var(--sec);display:inline-flex;align-items:center;gap:4px;}
  .card .read:hover{text-decoration:underline;}
  .card .when{font-size:12px;color:var(--muted);}

  footer{max-width:1180px;margin:0 auto;padding:22px 16px 50px;color:var(--muted);font-size:13px;
    border-top:1px solid var(--border);text-align:center;line-height:1.8;}
  footer a{color:var(--sec);}
  .badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--border);
    margin-left:6px;vertical-align:middle;}
  .badge.snap{color:#fbbf24;border-color:#fbbf2466;background:#fbbf2414;}
  .empty{padding:40px;text-align:center;color:var(--muted);}
</style>
</head>

 Duration Storage Environmental and Emissions","publishedText":"","sourceName":"Power Engineering"},{"title":"News &amp; Media","url":"https://www.doosanenerbility.com/en/about/news_board_list","summary":"News : News &amp; Media : Doosan Enerbility 대메뉴 Business New Energy Solutions Wind Power Solutions Gas Turbines for Power Generation Small Modular Reactors Hydrogen Energy ESS Power Plant Equipment / Services Nuclear Power Plants Thermal Power Plants Combined Cycle Power Plants Hydroelectric / Pumpe","publishedText":"","sourceName":"Doosan Enerbility"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/doosan-enerbility/posts/?feedView=all","summary":"Doosan Enerbility Signs MOU with GS Banwol CHP Co. on Pursuing Plant Modernization - High-efficiency H-class gas turbines to be deployed and Ansan Smart Hub’s heat & power supply system to be upgraded - Main components including locally made gas turbines to be supplied, EPC service-related cooperation to be pursued, and hydrogen co-firing envisioned for the future Read More Here : https://lnkd.in/gWR587AW","publishedText":"9 个月前 •","sourceName":"Doosan Enerbility"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/doosan-enerbility/posts/?feedView=all","summary":"As AI and data centers continue to expand, electricity demand is rising rapidly, making reliable and stable power sources more important than ever. Against this backdrop, nuclear energy is re-emerging as a key energy solution. As highlighted in this post, Doosan Enerbility is supporting the growth of the global nuclear industry with proven manufacturing capabilities and a strong supply chain. Doosan Enerbility will continue advancing nuclear technology innovation for a more sustainable energy future.","publishedText":"1 个月前 •","sourceName":"Doosan Enerbility"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/doosan-enerbility/posts/?feedView=all","summary":"The future of nuclear power is becoming smaller, smarter and more flexible. The world will now need someone to produce these compact reactors. As highlighted in this post, Doosan Enerbility is advancing toward becoming the global No.1 SMR foundry, backed by our advanced manufacturing technologies and partnerships held with leading SMR developers. With AI driving a surge in the global energy demand, it is our manufacturing strength that will help shape the future of energy.","publishedText":"1 个月前 •","sourceName":"Doosan Enerbility"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/doosan-enerbility/posts/?feedView=all","summary":"Doosan Enerbility to Supply Four Steam Turbines to U.S. Client - New order secured after initially winning order for two units in March, leading to stronger market position in North American power sector - 370MW steam turbines and generators, four of each, to be delivered sequentially to Texas by 2029 Read More Here : https://lnkd.in/g9nJ4sHs","publishedText":"1 个月前 •","sourceName":"Doosan Enerbility"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/doosan-enerbility/posts/?feedView=all","summary":"Doosan Enerbility Selected as Rolls-Royce SMR’s Partner Supplier for SMR Components - Manufacturability review of key components, such as reactors, to be conducted for the UK and Czech SMR projects - SMR business competitiveness to be enhanced by increasing production capacity and upgrading manufacturing capabilities Read More Here : https://lnkd.in/g4zYicEw","publishedText":"1 个月前 •","sourceName":"Doosan Enerbility"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/doosan-enerbility/posts/?feedView=all","summary":"Doosan Enerbility Wins Contract for Saudi Arabia Jafurah Cogeneration Plant Phase 2 Project - EPC contract worth approx. KRW 840 billion signed with consortium led by project developer KEPCO - Designed to have the capacity to generate 330 MW of electricity and 465 tons of steam per hour, with steam turbines Read More Here : https://lnkd.in/gNxVnZsB","publishedText":"1 个月前 •","sourceName":"Doosan Enerbility"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/doosan-enerbility/posts/?feedView=all","summary":"Doosan Enerbility Signs Reservation Agreement with X-energy for Core Materials of 16 SMR Units - A preemptive move taken to secure Doosan Enerbility’s forgings, key materials required for SMR manufacturing - X-energy’s Xe-100 reactors to be supplied for Dow Inc. and Energy Northwest projects Read More Here : https://lnkd.in/gURaP4SA","publishedText":"7 个月前 •","sourceName":"Doosan Enerbility"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/doosan-enerbility/posts/?feedView=all","summary":"Earth Day, April 22 🌍 Lights are turned off for 10 minutes, in a campaign to create meaningful change for the planet. 8:00 p.m. Wednesday, South Korea. Doosan Enerbility takes part in the Earth Day “lights-out” event. As a leading energy company, we remain committed to building a more sustainable future. Energy toward Sustainability","publishedText":"2 个月前 •","sourceName":"Doosan Enerbility"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/doosan-enerbility/posts/?feedView=all","summary":"Doosan Enerbility Wins Supplier Contract from Korea Southern Power for Three Gas Turbines - Turbines to be delivered to Hadong and Goyang-Changneung Combined Cycle Power Plants, with commercial operation being targeted for Dec. 2029 - Gas turbine production capacity to be expanded to meet the growing demand in domestic market Read More Here : https://lnkd.in/gVq4dZ9E","publishedText":"4 个月前 •","sourceName":"Doosan Enerbility"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/doosan-enerbility/posts/?feedView=all","summary":"Doosan Enerbility Secures Contract for Duqm Combined Cycle Power Plant in Oman - EPC contract valued to be approx. KRW 530 bn signed with KOWEPO consortium - Doosan to conduct EPC work and supply its steam turbines for the power plant slated to be built by 2029 Read More Here : https://lnkd.in/gw3RaVMf","publishedText":"1 个月前 •","sourceName":"Doosan Enerbility"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/doosan-enerbility/posts/?feedView=all","summary":"A touch of spring at our Changwon site! Even the busiest of places make room for spring. 🌸 At our Changwon site, spring quietly finds its way into our everyday life. Let’s take a moment to enjoy a brief respite.","publishedText":"3 个月前 •","sourceName":"Doosan Enerbility"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/doosan-enerbility/posts/?feedView=all","summary":"As advances in AI and the expansion of data centers drive a rapid increase in electricity demand, how can we build a more reliable and sustainable energy future? In this feature, Yeonin Jung, Vice Chairman & COO of Doosan Enerbility, shares his perspective on the direction of energy infrastructure in the AI era and the solutions needed to support it. Read the full interview for insights on the energy infrastructure needed to power the future of AI.","publishedText":"2 周前 •","sourceName":"Doosan Enerbility"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/doosan-enerbility/posts/?feedView=all","summary":"As AI moves beyond data centers into the physical world, energy becomes the foundation of this transformation. Doosan Enerbility is proud to contribute with reliable and sustainable energy solutions for the next generation of AI infrastructure.","publishedText":"1 个月前 •","sourceName":"Doosan Enerbility"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/ansaldo-energia/posts/?feedView=all","summary":"On International Women in Engineering Day, we celebrate the women who bring expertise, curiosity and perspective to our engineering teams every day. From generators engineering to nuclear R&D, from demand planning to AEM electrolyser projects, Gloria Barbieri, Giada Minozzi, Elena Falsini and Martina Cambiaso show how different paths, skills and experiences contribute to innovation across Ansaldo Energia Group. Their stories remind us that engineering is about solving complex challenges, working together and turning ideas into reliable solutions for the future of energy.","publishedText":"4 周前 •","sourceName":"Ansaldo Energia"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/ansaldo-energia/posts/?feedView=all","summary":"𝐁𝐫𝐢𝐝𝐠𝐢𝐧𝐠 𝐚𝐜𝐚𝐝𝐞𝐦𝐢𝐜 𝐥𝐞𝐚𝐫𝐧𝐢𝐧𝐠 𝐚𝐧𝐝 𝐢𝐧𝐝𝐮𝐬𝐭𝐫𝐢𝐚𝐥 𝐩𝐫𝐚𝐜𝐭𝐢𝐜𝐞. Students attending the Ansaldo Nucleare Master's Program in Technologies for Nuclear Power Plants recently visited EDF’s Tricastin Nuclear Power Plant, one of France’s major nuclear sites, gaining direct insight into how large-scale nuclear facilities operate, with the aim of deepening their understanding of the technologies, processes and expertise behind safe and reliable nuclear power generation. Experiences like this play a key role in preparing the next generation of nuclear engineers by connecting technical education with real-world industrial practice. Thank you to EDF for hosting the visit and sharing its expertise. Anne GAVERIAUX","publishedText":"2 周前 •","sourceName":"Ansaldo Energia"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/ansaldo-energia/posts/?feedView=all","summary":"🔧 𝐖𝐡𝐚𝐭 𝐢𝐬 𝐫𝐨𝐭𝐨𝐫 𝐬𝐭𝐚𝐜𝐤𝐢𝐧𝐠? It is one of the most delicate steps in turbine manufacturing: the precise assembly of bladed discs that gradually form the turbine’s central rotating shaft. Each disc is stacked vertically, connected through Hirth couplings and secured by an 8-metre-long tie rod. To allow the rotor to operate at 3,000 rpm, the tie rod is tightened with a force exceeding 2,000 tonnes. Once assembled, the rotor is carefully moved from vertical to horizontal position through a complex manoeuvre involving a crane and a tilting system. A process where engineering, precision and teamwork come together to ensure structural integrity, efficiency and balance under extreme operating conditions.","publishedText":"3 周前 •","sourceName":"Ansaldo Energia"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/ansaldo-energia/posts/?feedView=all","summary":"Planning, production capacity and supply chain are increasingly connected. For this reason, Ansaldo Energia is strengthening the integration between Manufacturing and Procurement through a new structure that will improve coordination between planning, production and supply chain, supporting a more sustainable, efficient and resilient model. We are therefore pleased to welcome Lorenzo Romagnoli as Chief Operating Officer, who will lead this integrated approach. With over 30 years of international experience in Supply Chain, Manufacturing, Materials Management and Global Operations, Lorenzo has led complex industrial transformations and end-to-end supply chain organizations across the energy, aerospace and industrial sectors. Welcome Lorenzo, and best wishes for this new challenge.","publishedText":"2 周前 • 已编辑 •","sourceName":"Ansaldo Energia"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/ansaldo-energia/posts/?feedView=all","summary":"Did you know that a can switch from gas to fuel oil in just 2 minutes? In power generation, operational flexibility is becoming increasingly strategic to support grid stability and adapt to evolving energy scenarios. That’s one of the key strengths of the AE94.2: a robust and flexible gas turbine designed for long-term operations, with more than 25 years of experience and over 10 million EOH worldwide. Discover more about the AE94.2 🔗 https://lnkd.in/d4GJrD5f","publishedText":"3 周前 •","sourceName":"Ansaldo Energia"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/ansaldo-energia/posts/?feedView=all","summary":"On , we celebrate the curiosity, knowledge and ambition of young people preparing to shape the industries of tomorrow. Through company visits, training programmes and collaborations with schools, universities and research institutions, Ansaldo Energia helps young people connect academic knowledge with real industrial challenges and develop the skills needed to contribute to a more sustainable and shared energy future. Thanks to all the students, teachers, universities and partners who take part in these initiatives and help turn learning into real-world experience. 📸 A moment from our latest visit with students from Politecnico di Milano.","publishedText":"1 周前 •","sourceName":"Ansaldo Energia"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/ansaldo-energia/posts/?feedView=all","summary":"What makes a gas turbine a future-proof investment? As power systems evolve, power generation technologies must integrate efficiency, operational flexibility and readiness for lower-carbon fuels. That is the approach behind the GT36, Ansaldo Energia's H-class gas turbine, capable of delivering up to 800 MW in combined-cycle operation. Designed with sequential combustion technology, the GT36 offers leading-edge operational flexibility, low NOx emissions and is capable of operating with up to 70% hydrogen. A solution engineered not only for today's energy needs, but for the challenges of tomorrow. ⚡️ Discover more about the GT36 🔗 https://lnkd.in/dWrNEWGR","publishedText":"5 天前 •","sourceName":"Ansaldo Energia"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/ansaldo-energia/posts/?feedView=all","summary":"The growth of AI and data-intensive services is driving new demand for dependable and scalable power solutions. In this context, Ansaldo Energia has signed a contract with Pacifico Energy for a data center project in Texas, marking the company’s return to the U.S. new-build power generation market after more than 30 years. The project includes the supply of eight AE64.3A gas turbines and associated generators, a solution well suited to the operational requirements of modern data center infrastructures. 🔗 Read the full press release: https://lnkd.in/dxSftQff","publishedText":"2 天前 •","sourceName":"Ansaldo Energia"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/ansaldo-energia/posts/?feedView=all","summary":"⚙️ 𝗦𝗲𝗶 𝗮𝗽𝗽𝗮𝘀𝘀𝗶𝗼𝗻𝗮𝘁𝗼 𝗱𝗶 𝗺𝗲𝗰𝗰𝗮𝗻𝗶𝗰𝗮 𝗲 𝗰𝗲𝗿𝗰𝗵𝗶 𝘂𝗻 𝗰𝗼𝗻𝘁𝗲𝘀𝘁𝗼 𝘀𝘁𝗿𝘂𝘁𝘁𝘂𝗿𝗮𝘁𝗼 𝗲 𝘀𝘁𝗶𝗺𝗼𝗹𝗮𝗻𝘁𝗲? 𝗤𝘂𝗲𝘀𝘁𝗮 𝗲̀ 𝗹’𝗼𝗽𝗽𝗼𝗿𝘁𝘂𝗻𝗶𝘁𝗮̀ 𝗴𝗶𝘂𝘀𝘁𝗮 𝗽𝗲𝗿 𝘁𝗲! In collaborazione con Randstad Italia, è stato programmato un nuovo corso dedicato ai ruoli di Montatore Elettromeccanico e Collaudatore. 📚 Il programma prevede: - 250 ore di formazione in aula - un periodo di tirocinio 🤝🏻 Al termine del percorso, i candidati idonei potranno accedere a un'opportunità occupazionale presso Ansaldo Energia di Genova. 📅 Candidature aperte fino al 13 settembre 2026. 🔗 Scopri tutti i dettagli e candidati tramite il link in bio//https://lnkd.in/dSCHKXeS","publishedText":"1 天前 •","sourceName":"Ansaldo Energia"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/ansaldo-energia/posts/?feedView=all","summary":"On July 14, Ansaldo Energia took part in a roundtable discussion in Madrid, Spain, on “Hydrogen (H2)-powered combined-cycle plants”, held during a workshop organised by ás under the umbrella of the ( ). The event brought together leading gas turbine OEMs to discuss the latest technology developments and operational experience in the use of for combined-cycle power generation. Representing Ansaldo Energia, Miguel Churiaque, Country Manager for Spain and Portugal, contributed to the discussion on the key steps needed to move from project development to investment decisions, and on the role of industry in advancing renewable projects. The event also provided an opportunity to share Ansaldo Energia's more than 20 years of experience in , from the Brindisi project in Italy to the results of the FLEX4H2 project. Leveraging the company's unique sequential combustion technology for the , FLEX4H2 was recently recognised as the \"Best Success Story\" by the Clean Hydrogen Partnership, an initiative supported by the European Union.","publishedText":"15 小时前 •","sourceName":"Ansaldo Energia"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/rolls-royce/posts/?feedView=all","summary":"As Farnborough International Airshow begins, we are proud to be a strategic asset for the UK. For more than a century, Rolls-Royce has powered, protected and connected the UK, building highly differentiated sovereign capabilities that strengthen national resilience, security and prosperity. Our international partnerships and global customer relationships help showcase the best of British engineering on the world stage, driving exports, supporting high-value jobs and extending the UK's influence around the world. Take a closer look at our presence in the UK below: https://lnkd.in/e-qhpEYF","publishedText":"2 天前 • 已编辑 •","sourceName":"Rolls-Royce"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/rolls-royce/posts/?feedView=all","summary":"Day one at Farnborough International Airshow is complete. Today’s announcements show how we’re ready to power, ready to protect and ready to connect, from customer commitments and defence collaboration to aftermarket support. Here’s a look at today’s highlights: - Riyadh Air | طيران الرياض has firmed up an order for 6 additional Airbus A350-1000, powered by 12 Trent XWB-97 engines. - The GCAP consortium comprised of Rolls-Royce, Avio Aero and IHI Corporation announced significant progress, including the achievement of key technology milestones as the partners drive the generational change in power and propulsion required to deliver the world’s next-generation combat aircraft. - Carlyle Aviation Partners signed a LessorCare+ agreement - our premium support programme designed specifically for aircraft leasing companies with Rolls-Royce-powered assets. Follow along throughout the week as we bring you more updates from Farnborough International Airshow.","publishedText":"2 天前 • 已编辑 •","sourceName":"Rolls-Royce"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/rolls-royce/posts/?feedView=all","summary":"We’re delighted that Somon Air LLC will be powering its two new Boeing 787 Dreamliners with four Trent 1000 XE engines. The Trent 1000 XE engines feature several upgrades following our certified two-phase durability enhancement program. This includes a re-engineered high-pressure turbine blade that increases cooling air flow by 40%, offering up to triple the time-on-wing of its predecessor. Learn more: https://lnkd.in/eA8-GaMq","publishedText":"1 天前 •","sourceName":"Rolls-Royce"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/rolls-royce/posts/?feedView=all","summary":"As day two of Farnborough International Airshow draws to a close, it’s been a pleasure to welcome customers, partners and stakeholders to our chalet, where we’ve been showcasing the technologies, capabilities and expertise delivering benefits for our customers today and shaping the future of tomorrow. Here’s a look at today’s highlights: - VietJet Air has agreed TotalCare for 80 Trent 7000 engines - Philippine Airlines has ordered 9 Airbus A350-1000, powered by 18 Trent XWB-97 engines. - Somon Air LLC will be powering its two new Boeing 787 Dreamliners with four Trent 1000 XE engines. - McLaughlin & Harvey Ltd has been awarded a multi-million pound contract to develop a new Rolls-Royce facility in Bristol Stay tuned as we continue to share the latest announcements, customer stories and highlights from Farnborough International Airshow throughout the week: https://lnkd.in/e-qhpEYF","publishedText":"1 天前 • 已编辑 •","sourceName":"Rolls-Royce"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/rolls-royce/posts/?feedView=all","summary":"What if the technologies that redefine aviation are already taking to the skies? We're proud to join Boeing and 汉莎航空 on the 2026 ecoDemonstrator programme, testing technologies that could help reduce fuel burn, noise and emissions. Progress in aviation has always been driven by collaboration, innovation and the courage to test what's possible. Together, we're helping turn promising ideas into real-world solutions that could shape a more efficient future for flight.","publishedText":"6 天前 •","sourceName":"Rolls-Royce"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/rolls-royce/posts/?feedView=all","summary":"When AI thinks, power demand rises dramatically: Today, we generate 43 million AI images every day, and AI models are trained on billions of data points. The result? We’ve entered a new era of electricity demand one where AI is no longer a niche application but a global driver of power consumption. To keep AI running, we need reliable, decentralized, flexible power systems - like our mtu diesel gensets for reliable backup power or our mtu gas gensets for prime power and fast deployment. Our mtu Kinetic PowerPacks are ideal solutions to absorb AI’s extreme load volatility. Without enough energy, the AI boom will hit a hard limit. Read more: https://ow.ly/ezjl50Zoh5o","publishedText":"5 天前 •","sourceName":"Rolls-Royce"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/rolls-royce/posts/?feedView=all","summary":"Important to see the UK Government reaffirming their commitment to GCAP. We continue to make progress with our international partners, strengthening our collaborative approach and technology development to deliver this.","publishedText":"10 小时前 •","sourceName":"Rolls-Royce"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/rolls-royce/posts/?feedView=all","summary":"We’re halfway through Farnborough International Airshow, and it’s been great to welcome customers, partners and stakeholders to our chalet over the past few days. Here’s a glimpse of some of the activity from our chalet and across the airshow so far.","publishedText":"13 小时前 •","sourceName":"Rolls-Royce"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/rolls-royce/posts/?feedView=all","summary":"The international consortium comprised of Rolls-Royce, Avio Aero and IHI Corporation has announced significant progress in the development of the next-generation power and propulsion system for the Global Combat Air Programme (GCAP). Progress includes the achievement of key technology milestones as the partners drive the generational change in power and propulsion required to deliver the world’s next-generation combat aircraft. The consortium has also strengthened its long-term commitment and wider programme integration with Edgewing through an evolved collaboration agreement and an established Power and Propulsion Domain Collaboration Hub in Reading, UK. Read more: https://lnkd.in/ebXa7QTw","publishedText":"2 天前 •","sourceName":"Rolls-Royce"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/rolls-royce/posts/?feedView=all","summary":"Day three at Farnborough International Airshow saw us welcome the new Secretary of State for Business, Innovation, Science and Trade, to our chalet, and make further customer announcements in commercial and business aviation. Here’s a look at today’s highlights: - We were delighted to host the Rt. Hon. Jonathan Reynolds MP, Secretary of State for Business, Innovation, Science and Trade, to demonstrate how our sovereign aerospace capabilities are an engine for growth for the UK - flynas has added five Airbus A330neos powered by 10 Trent 7000s - شركة الطائرات المروحية has signed for five Global 5500 aircraft powered by Rolls-Royce Pearl 15 engines We’ll continue sharing update from Farnborough International Airshow as the week continues.","publishedText":"7 小时前 • 已编辑 •","sourceName":"Rolls-Royce"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/rolls-royce/posts/?feedView=all","summary":"Securing the future for air combat product development, we’ve awarded a multi-million-pound contract to McLaughlin & Harvey Ltd to construct a state-of-the-art facility in Bristol, UK. The new digital-first facility will drive efficiencies across advanced product research, manufacturing and test, fostering agile ways of working. This advanced infrastructure will ensure we can continue to advance novel air combat engineering capabilities for our customers for decades to come. Due to break-ground later in 2026, the development will enhance Rolls-Royce UK facilities and deliver multi-year stability to hundreds of our partners, manufacturers and small-to-medium enterprises (SMEs) across the UK. Read more: https://lnkd.in/e-6wpau4","publishedText":"1 天前 •","sourceName":"Rolls-Royce"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/rolls-royce/posts/?feedView=all","summary":"Philippine Airlines has ordered 9 Airbus A350-1000, powered by 18 Trent XWB-97 engines. The Trent XWB-97 is the exclusive engine for the A350, with proven reliability and durability over eight years of service and more than four million engine flying hours. It has received the first two of its three durability enhancement packages. The third phase, which will enter service in 2028, doubles time on wing in challenging environments and provides 50% improvement in benign conditions. Learn more: https://lnkd.in/emFNAZJV","publishedText":"1 天前 •","sourceName":"Rolls-Royce"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/mitsubishi-power/posts/?feedView=all","summary":"Today’s power producers need reliable systems built on years of innovation and backed by proven technology⚙️ On our website, we showcase Mitsubishi Power’s gas turbine business that meets diverse needs worldwide—from our value foundations to the world-class, highly efficient, and reliable JAC series gas turbine. Explore our gas turbine lineup and technical information here👇 https://lnkd.in/ghS9kky","publishedText":"3 个月前 •","sourceName":"Mitsubishi Power"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/mitsubishi-power/posts/?feedView=all","summary":"As evolve, solutions supporting reliable, efficient, and flexible operation throughout the lifecycle are essential🪛 On our website, we present our wide range of gas turbine services to maximize plants’ potential, from spare and replacement parts to field outages. Learn “why Mitsubishi Power” for gas turbine services here👇 https://lnkd.in/dBZmT5_g","publishedText":"2 个月前 •","sourceName":"Mitsubishi Power"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/mitsubishi-power/posts/?feedView=all","summary":"Aero-derivative turbines are becoming key assets, offering quick, flexible, and portable power solutions that support grid resilience. Discover Mitsubishi Power Aero’s innovative solutions.","publishedText":"10 个月前 •","sourceName":"Mitsubishi Power"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/mitsubishi-power/posts/?feedView=all","summary":"✔️ Customer Milestone: Georgia Power Company has received delivery of the first of three new simple cycle gas turbines at Plant Yates in Coweta County, Georgia. 🔗 Read More: https://bit.ly/4lTJYVz Manufactured at our Savannah Machinery Works facility, the gas turbine was transported to the site using both rail and truck, weighs nearly 350 tons, and is 50 feet long and 18 feet wide. The new natural gas units at Plant Yates will feature Mitsubishi Power M501JAC gas turbines, and are the first new natural gas turbines to be added to Georgia Power’s fleet in a decade. When fully operational, the site will provide 1,300 megawatts (MW) of generation capacity for customers. With the expansion of three new units, Plant Yates continues to support the energy needs of Georgia and provide high-quality local jobs for Georgians. 💪","publishedText":"11 个月前 • 已编辑 •","sourceName":"Mitsubishi Power"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/mitsubishi-power/posts/?feedView=all","summary":"Germany has raised the bar for industrial following the EU approval of its smart and strategic €5bn plan to support cleaner processes through Carbon Contracts for Difference—and we are here for it. The move provides real financial certainty for companies willing to take bold steps, especially in sectors like , , and , where emissions are hard to abate.​ ​ At Mitsubishi Power, we are already aligned with this direction. Our -ready gas turbines and solutions are built to support exactly this kind of transition. In fact, we are already working with partners across Europe on co-firing projects and scalable systems.​ ​ We look forward to supporting industries in navigating this shift with proven technologies, strategic insight, and a commitment to long-term .​ ​","publishedText":"1 年前 •","sourceName":"Mitsubishi Power"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/mitsubishi-power/posts/?feedView=all","summary":"Mitsubishi Heavy Industries has released its Q1 FY2025 , showcasing a strong first quarter with continued success in Mitsubishi Power’s Combined Cycle business. Order intake was particularly robust in the Americas, where there is high demand for high-efficiency large frame gas turbines. We are grateful to all Mitsubishi Power employees for their dedication. By collaborating with our customers and partners, we are committed to meeting global energy needs and contributing to a stable energy supply and decarbonization efforts. Learn more in our Q1 FY2025 financial results presentation 👉https://lnkd.in/gftMg_yr","publishedText":"11 个月前 •","sourceName":"Mitsubishi Power"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/mitsubishi-power/posts/?feedView=all","summary":"Mitsubishi Power has received a contract to upgrade existing boiler equipment for the oil-to-gas project at the O Mon 1 Thermal in Can Tho, Vietnam. We will provide the main equipment, such as the gas burners for the plant’s boiler, supporting fuel conversion and CO2 emission reduction. In addition, we will install a selective catalytic reduction system to detoxify the nitrogen oxides contained in exhaust gases, allowing the plant to meet stricter environmental regulations. This boiler fuel conversion technology will further strengthen our support for Vietnam’s energy plan, contributing to the country’s target of emissions by 2050. Learn more 👉https://lnkd.in/gccxMBWU","publishedText":"8 个月前 •","sourceName":"Mitsubishi Power"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/mitsubishi-power/posts/?feedView=all","summary":"Mitsubishi Heavy Industries has released its 1H FY2025 . The first half of FY2025 shows strong Combined Cycle order intake, particularly in North America and Asia. To meet the unprecedented global and customer needs, we aim to increase our gas turbine production capacity in the coming years. We are honored by the dedication of all Mitsubishi Power employees in our daily work. By collaborating with our customers and partners, we remain committed to addressing global energy needs and advancing a stable energy supply alongside decarbonization efforts. Learn more in our 1H FY2025 financial results presentation👉 https://lnkd.in/g-JVSsiB","publishedText":"8 个月前 •","sourceName":"Mitsubishi Power"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/mitsubishi-power/posts/?feedView=all","summary":"Mitsubishi Heavy Industries announces its Q1-3 FY2025 . Driven by significant growth in the global market, the results show strong Combined Cycle order intake, notably in North America and Asia. Together with our customers and partners, we are committed to providing reliable, innovative, and efficient energy solutions for a sustainable and resilient . See the full Q1-3 FY2025 financial results presentation here👉https://lnkd.in/gsXrAPhr","publishedText":"5 个月前 •","sourceName":"Mitsubishi Power"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/mitsubishi-power/posts/?feedView=all","summary":"Mitsubishi Heavy Industries is pleased to announce its FY2025 . We are proud to share that our Combined Cycle (GTCC) business, driven by strong order intake in North America and Asia, achieved a record-high number of orders for large gas turbines. Business profit increased due to revenue growth and improved margins, with revenue from both gas turbines and services continuing on an upward trend. We will continue to build production capacity to meet strong demand and, through our GTCC business, collaborate with our partners and customers toward decarbonization and a stable . See the full FY2025 financial results presentation here👉https://lnkd.in/dBSM2TYp","publishedText":"2 个月前 •","sourceName":"Mitsubishi Power"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/mitsubishi-power/posts/?feedView=all","summary":"Do you know the innovation behind Mitsubishi Power’s JAC series ?⚙️ JAC stands for “J-series Air-Cooled,” named for its incorporation of air-cooled combustors. Swipe to learn about the JAC series’ characteristics and the state-of-the-art components that make its technology possible 👇","publishedText":"2 周前 •","sourceName":"Mitsubishi Power"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/mitsubishi-power/posts/?feedView=all","summary":"Before Mitsubishi Power’s gas turbines are delivered to customers, they undergo long-term validation at our T-Point 2 power plant.🏭 T-Point 2 is located at Takasago Machinery Works in Hyogo Prefecture, Japan, and is the world’s only commercially operating power plant that is specifically for the validation of . The first validated at T-Point 2 is the Air-Cooled version of the J-series (JAC), achieving a world-first turbine inlet temperature of 1650℃. This unique long-term validation process minimizes risk for customers and helps ensure performance and durability for subsequent units of the same frame. Swipe to learn about T-Point 2👇","publishedText":"1 周前 •","sourceName":"Mitsubishi Power"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/mitsubishi-power/posts/?feedView=all","summary":"We’re excited to see Entergy and MHI Group companies’ partnership employing our M501JAC as part of an integrated and storage solution. By combining proven gas turbine and carbon capture technologies, the solution aims to provide a standardized approach that can help improve project economics. See the full announcement from Mitsubishi Power Americas👇","publishedText":"6 天前 •","sourceName":"Mitsubishi Power"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/siemens-energy/posts/?feedView=all","summary":"Did you know that a nuclear power plant is formed by two different islands? 🏝️ One creates the heat, the other turns it into reliable electricity. Join our tour to explore the full nuclear power plant setup – with a special focus on the Conventional Island, our core expertise for more than 60 years.","publishedText":"1 个月前 •","sourceName":"Siemens Energy"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/siemens-energy/posts/?feedView=all","summary":"The grid was not built for large, concentrated loads that swing rapidly. Local stabilization can help prevent wider impacts. Where should that capability sit?","publishedText":"1 个月前 •","sourceName":"Siemens Energy"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/siemens-energy/posts/?feedView=all","summary":"Can you combine scale, flexibility, and reliable power? Our latest technology at Taweelah C in Abu Dhabi, UAE, shows how we are supporting rising electricity demand while enabling the energy transition. 🚀 Browse through to learn more about the project or click the link in the comments to read the full press release. 📝","publishedText":"1 个月前 •","sourceName":"Siemens Energy"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/siemens-energy/posts/?feedView=all","summary":"What connects a space shuttle 🚀 to a turbine nozzle? 💜 The answer might surprise you. At our Berlin site, Danny Wegner works with ceramic materials that play a critical role in high-performance technologies. In this episode, he takes us through his day — from raw powders to precise components — and shows how innovation, including 3D printing, is shaping the future of our work. 🎥 Step behind the scenes with 'A day with ' and discover the people and processes powering innovation.","publishedText":"4 周前 •","sourceName":"Siemens Energy"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/siemens-energy/posts/?feedView=all","summary":"What if you could see a problem before it becomes one? That’s the idea behind QMapp— a 3D visualizer that’s changing the way we approach quality in manufacturing. By giving a clearer, more complete view, QMapp helps to detect defects earlier and improve overall process performance. It’s a powerful example of how digital innovation is helping us work smarter and deliver better results. Take a look to see innovation in action!","publishedText":"2 周前 •","sourceName":"Siemens Energy"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/siemens-energy/posts/?feedView=all","summary":"💜 Passion for learning. A drive to make an impact. A career that’s just getting started. Meet Hector Teasdale, one of our talented graduates shaping the future of energy. As a finance graduate in Newcastle, he’s building his career through challenging projects, professional development, and a culture that supports growth from day one. ➡️ Follow Hector for a day and see where passion can take you.","publishedText":"2 周前 •","sourceName":"Siemens Energy"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/siemens-energy/posts/?feedView=all","summary":"Today we announce our plan to transition to our own independent brand: Omterra. We will carry the reputation we have built as a trusted partner and will come together with Siemens Gamesa under one shared name and one brand. Our focus remains the same, as we continue to shape the energy world of tomorrow. You will see more of Omterra towards the end of the year.","publishedText":"1 周前 •","sourceName":"Siemens Energy"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/siemens-energy/posts/?feedView=all","summary":"This weekend, “Architecture Day” is being celebrated in many places across Germany. We, too, have a special architectural highlight: The famous \"AEG-Turbinenhalle\" at our Berlin plant was designed by star architect Peter Behrens and completed in 1909. For its time, the light-filled, soaring building was a unique innovation, and even today it remains a pleasant workplace for our employees, who build our gas turbines there day in and day out.","publishedText":"3 周前 •","sourceName":"Siemens Energy"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/siemens-energy/posts/?feedView=all","summary":"LinkedIn vs Reality! The energy transition is considerably more complex than some buzzword-laden posts on LinkedIn would suggest! 😉 Demand is rising, grids are aging, and the world needs solutions built on facts, not on capital investment narratives dressed up with rocket emojis! Real progress requires in-depth knowledge, honest economics, and straight talking.","publishedText":"3 周前 •","sourceName":"Siemens Energy"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/siemens-energy/posts/?feedView=all","summary":"Power grids around the world are growing and evolving at an unprecedented pace. To support our customers' needs, we're continuing to grow our global manufacturing footprint. Our newly expanded high-voltage switchgear facility in Shanghai strengthens our ability to develop and produce innovative F-gas-free gas-insulated switchgear (Blue GIS) solutions that help enable reliable, efficient, and more sustainable power networks. Spanning approximately 30,000 sqm, the facility supports growing demand for grid infrastructure and strengthens our ability to deliver the technologies customers need to expand and modernize their networks. From manufacturing expansion to next-generation switchgear, we're investing in the infrastructure of tomorrow. What do you think is the next major step for grid innovation?","publishedText":"1 周前 •","sourceName":"Siemens Energy"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/siemens-energy/posts/?feedView=all","summary":"⚡ What does it take to keep complex energy projects moving forward? In our latest 'A Day with ' episode, join Hedieh L. as she takes us behind the scenes of her role as a Project Manager. From coordinating teams and solving challenges to driving projects that help shape the future of energy, no two days are ever the same. 🎥 Watch the video and discover the passion, collaboration, and problem-solving that power every project.","publishedText":"1 天前 • 已编辑 •","sourceName":"Siemens Energy"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/gasturbinehub/posts/?feedView=all","summary":"𝟓𝟎 𝐲𝐞𝐚𝐫𝐬. +𝟐𝟎 𝐩𝐞𝐫𝐜𝐞𝐧𝐭𝐚𝐠𝐞 𝐩𝐨𝐢𝐧𝐭𝐬 𝐢𝐧 𝐞𝐟𝐟𝐢𝐜𝐢𝐞𝐧𝐜𝐲. 𝐒𝐨𝐮𝐧𝐝𝐬 𝐬𝐢𝐦𝐩𝐥𝐞. 𝐈𝐭 𝐰𝐚𝐬𝐧’𝐭. Gas turbine efficiency didn’t jump to >63% overnight. It was engineered, step by step, over decades. Each milestone in this chart reflects a major engineering trade-off: 🔹 F-class → higher firing temperatures, but tighter material limits 🔹 G-class → cooling + coatings unlock >59%, but increase complexity 🔹 H/J-class → steam cooling + full integration push >63%, but at system-level cost Efficiency gains came with: ➡️ Higher thermal stress ➡️ More complex cooling architectures ➡️ Increased dependency on materials and coatings This is why modern gas turbines are not just machines. They’re integrated thermodynamic systems operating at the edge of physics. GasTurbineHub — The biggest news in gas turbines, visualised 📊","publishedText":"2 个月前 •","sourceName":"Gas Turbine Hub"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/gasturbinehub/posts/?feedView=all","summary":"𝐒𝐢𝐞𝐦𝐞𝐧𝐬 𝐄𝐧𝐞𝐫𝐠𝐲’𝐬 𝐆𝐚𝐬 𝐒𝐞𝐫𝐯𝐢𝐜𝐞𝐬 𝐐𝟐 𝐢𝐬 𝐧𝐨𝐭 𝐣𝐮𝐬𝐭 𝐚 𝐜𝐨𝐦𝐩𝐚𝐧𝐲 𝐫𝐞𝐬𝐮𝐥𝐭, 𝐢𝐭 𝐢𝐬 𝐚𝐧𝐨𝐭𝐡𝐞𝐫 𝐝𝐚𝐭𝐚 𝐩𝐨𝐢𝐧𝐭 𝐜𝐨𝐧𝐟𝐢𝐫𝐦𝐢𝐧𝐠 𝐭𝐡𝐚𝐭 𝐭𝐡𝐞 𝐠𝐚𝐬 𝐭𝐮𝐫𝐛𝐢𝐧𝐞 𝐛𝐨𝐨𝐦 𝐢𝐧 𝟐𝟎𝟐𝟔 𝐢𝐬 𝐫𝐞𝐚𝐥. Siemens Energy’s Q2 FY2026 results confirm something the gas turbine market has been signalling for months: this is no longer a short-cycle rebound, but a structurally stronger market for gas-fired capacity, associated equipment, and lifecycle support. The key takeaway is not only the size of the numbers, but what they say about the market: demand for dispatchable power is still outrunning the industry’s ability to deliver. That is exactly the theme we explored in our May newsletter on the first months of 2026, where we argued that growth is increasingly being shaped by execution capacity, lead times, and supply-chain constraints rather than by project announcements alone. Congratulations to the Siemens Energy Gas Services team on a very strong quarter . GasTurbineHub — The biggest news in gas turbines, visualised 📊 *Correction in visual - Revenue: €3,478 millions.","publishedText":"2 个月前 • 已编辑 •","sourceName":"Gas Turbine Hub"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/gasturbinehub/posts/?feedView=all","summary":"𝐌𝐇𝐈 𝐆𝐓𝐂𝐂 𝐣𝐮𝐬𝐭 𝐝𝐞𝐥𝐢𝐯𝐞𝐫𝐞𝐝 𝐚 𝐛𝐥𝐨𝐜𝐤𝐛𝐮𝐬𝐭𝐞𝐫 𝐅𝐘𝟐𝟎𝟐𝟓. 𝐁𝐮𝐭 𝐭𝐡𝐞 𝐦𝐨𝐬𝐭 𝐢𝐦𝐩𝐨𝐫𝐭𝐚𝐧𝐭 𝐬𝐢𝐠𝐧𝐚𝐥 𝐦𝐚𝐲 𝐚𝐜𝐭𝐮𝐚𝐥𝐥𝐲 𝐛𝐞 𝐭𝐡𝐚𝐭 𝐅𝐘𝟐𝟎𝟐𝟔 𝐨𝐫𝐝𝐞𝐫𝐬 𝐚𝐫𝐞 𝐞𝐱𝐩𝐞𝐜𝐭𝐞𝐝 𝐭𝐨 𝐬𝐥𝐢𝐠𝐡𝐭𝐥𝐲 𝐝𝐞𝐜𝐥𝐢𝐧𝐞. After reporting: 📈 $16.7bn in orders (+80% YoY) 📈 35 large frame gas turbine bookings 📈 33 GW backlog 📈 13% profit margin …MHI appears to be signaling a transition from explosive growth toward a more normalised, but still very strong, market environment. The fundamentals remain powerful: ⚡ Rising data center electricity demand ⚡ Coal power phase-outs ⚡ Renewable intermittency requiring firm generation ⚡ Growing focus on grid reliability and energy security The jump in backlog from 21 GW to 33 GW is especially significant. It reflects strong long-term confidence in gas turbines as critical infrastructure for modern power systems. Congratulations to the entire MHI GTCC team for an exceptional FY2025 performance. GasTurbineHub — The biggest news in gas turbines, visualised 📊","publishedText":"2 个月前 •","sourceName":"Gas Turbine Hub"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/gasturbinehub/posts/?feedView=all","summary":"𝗦𝗼𝗺𝗲 𝗴𝗮𝘀 𝘁𝘂𝗿𝗯𝗶𝗻𝗲𝘀 𝗵𝗮𝘃𝗲 𝗮 𝘀𝘁𝗼𝗿𝘆 𝗯𝗲𝗵𝗶𝗻𝗱 𝘁𝗵𝗲 𝘀𝗽𝗲𝗰𝘀, 𝗮𝗻𝗱 𝘁𝗵𝗲 𝗦𝗶𝗲𝗺𝗲𝗻𝘀 𝗦𝗚𝗧-𝟴𝟬𝟬 𝗶𝘀 𝗼𝗻𝗲 𝗼𝗳 𝘁𝗵𝗲𝗺. It was originally known as the GTX100, development started in 1994, and the turbine was launched in 1997. What makes the platform especially interesting is that its story did not stop there. Over the years, different versions have been introduced with higher power output and better efficiency, taking the machine from the early roughly 45 MW range to today’s 62.5 MW version. That makes the SGT-800 a good example of how successful gas turbine platforms evolve. Rather than staying fixed, it has been continuously refined, and Siemens Energy now describes the fleet as having 620 installations and more than 20 million operating hours. For gas turbine enthusiasts, that is part of the appeal: a machine with a clear development lineage, decades of operating history, and a product roadmap that shows how OEMs keep proven platforms commercially relevant. GasTurbineHub — The biggest news in gas turbines, visualised 📊","publishedText":"2 个月前 •","sourceName":"Gas Turbine Hub"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/gasturbinehub/posts/?feedView=all","summary":"𝗠𝗮𝗻𝘆 𝗙-𝗰𝗹𝗮𝘀𝘀 𝘁𝘂𝗿𝗯𝗶𝗻𝗲𝘀 𝗹𝗼𝘀𝗲 𝘃𝗮𝗹𝘂𝗲 𝗹𝗼𝗻𝗴 𝗯𝗲𝗳𝗼𝗿𝗲 𝘁𝗵𝗲𝘆 𝗹𝗼𝘀𝗲 𝗰𝗮𝗽𝗮𝗯𝗶𝗹𝗶𝘁𝘆. The best operators do not upgrade everything at once. They sequence investments based on operational pain points, outage windows, remaining life, and dispatch strategy. This 4-wave upgrade funnel shows how modernization priorities typically evolve: 🔹 Wave 1 — Controls and reliability upgrades. Focus on trips, failed starts, sensors, valves, actuation, and flame detection. 🔹 Wave 2 — Airflow and combustion optimization. Target ambient penalties, combustion instability, turndown, emissions, and efficiency. 🔹 Wave 3 — Compressor and hot-gas-path upgrades. Improve output, heat rate, coatings, and interval extension during major outages. 🔹 Wave 4 — Rotor strategy. Address life extension, operational life recovery, refurbished rotors, or rotor exchange. The key principle: 👉 Upgrade sequencing should follow operational bottlenecks and asset economics, not trends. A unit with strong dispatch value and long-term strategic importance can justify deeper investment. But many plants can unlock significant value simply by stabilising controls and improving operability first. GasTurbineHub — The biggest news in gas turbines, visualised 📊","publishedText":"1 个月前 •","sourceName":"Gas Turbine Hub"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/gasturbinehub/posts/?feedView=all","summary":"𝐖𝐡𝐲 𝐝𝐨 𝐎𝐂𝐆𝐓 𝐚𝐧𝐝 𝐂𝐂𝐆𝐓 𝐞𝐟𝐟𝐢𝐜𝐢𝐞𝐧𝐜𝐲 𝐜𝐮𝐫𝐯𝐞𝐬 𝐥𝐨𝐨𝐤 𝐬𝐨 𝐝𝐢𝐟𝐟𝐞𝐫𝐞𝐧𝐭 𝐚𝐭 𝐩𝐚𝐫𝐭𝐢𝐚𝐥 𝐥𝐨𝐚𝐝? The answer matters because the best turbine configuration is not decided only by full-load efficiency. It is also shaped by how the plant is expected to operate across the load range. When load decreases, an typically sees a sharper drop in efficiency. In simple-cycle operation, more of the fuel energy leaves as hot exhaust, and that energy is not recovered for additional power generation. A behaves differently. The gas turbine exhaust is sent to the HRSG, where it produces steam that drives a steam turbine, so part of the energy that would otherwise be lost is still converted into useful electrical output. That is why the CCGT efficiency curve is usually flatter than the OCGT curve at part load. The combined-cycle arrangement helps reduce the efficiency penalty that is much more visible in simple-cycle operation. But there is also a trade-off. CCGTs usually do not offer the same turndown range, startup speed, or operating flexibility as OCGTs because the steam cycle adds thermal inertia and extra constraints during transients. So the real question is not only which technology is more efficient. It is which technology best matches the plant’s expected operating profile: 🔹OCGT for fast starts, peaking duty, and higher flexibility. 🔹CCGT for stronger efficiency, especially when the plant will spend significant time at part load. In other words, technology selection should also answer this question: 𝐖𝐡𝐞𝐫𝐞 𝐰𝐢𝐥𝐥 𝐭𝐡𝐞 𝐩𝐥𝐚𝐧𝐭 𝐬𝐩𝐞𝐧𝐝 𝐦𝐨𝐬𝐭 𝐨𝐟 𝐢𝐭𝐬 𝐥𝐢𝐟𝐞 𝐨𝐧 𝐭𝐡𝐞 𝐥𝐨𝐚𝐝 𝐜𝐮𝐫𝐯𝐞? GasTurbineHub — The biggest news in gas turbines, visualised 📊","publishedText":"1 个月前 •","sourceName":"Gas Turbine Hub"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/gasturbinehub/posts/?feedView=all","summary":"Most people see a turbine blade as a piece of metal. Engineers see one of the 𝐦𝐨𝐬𝐭 𝐬𝐨𝐩𝐡𝐢𝐬𝐭𝐢𝐜𝐚𝐭𝐞𝐝 𝐦𝐚𝐭𝐞𝐫𝐢𝐚𝐥𝐬 𝐭𝐞𝐜𝐡𝐧𝐨𝐥𝐨𝐠𝐢𝐞𝐬 𝐞𝐯𝐞𝐫 𝐝𝐞𝐯𝐞𝐥𝐨𝐩𝐞𝐝. The image below shows the evolution of turbine blade manufacturing: • Equiaxed • Directionally solidified • Single crystal As grain boundaries disappear, resistance to creep deformation increases dramatically. 𝐖𝐡𝐲 𝐢𝐬 𝐭𝐡𝐢𝐬 𝐢𝐦𝐩𝐨𝐫𝐭𝐚𝐧𝐭? Because some turbine blades operate in environments exceeding 1,500°C. At these temperatures, grain boundaries become one of the material's biggest challenges. Remove them, and entirely new operating possibilities emerge. Single-crystal blades have played a major role in pushing gas turbines and aero engines to performance levels that would have seemed impossible a few decades ago. GasTurbineHub — The biggest news in gas turbines, visualised 📊","publishedText":"1 个月前 •","sourceName":"Gas Turbine Hub"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/gasturbinehub/posts/?feedView=all","summary":"Can you identify this curve? No title. No axis labels. No hints. Just two curves. If you've worked with gas turbines, you've probably seen this relationship before. 👉 What do these curves represent? 👉 Why do they matter? 👉 What do they tell us about combustion and engine operation? Share your explanation in the comments. Let's see how many combustion experts we have in the community. We'll reveal the full graph, and discuss the engineering behind it, in a follow-up post.","publishedText":"3 周前 •","sourceName":"Gas Turbine Hub"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/gasturbinehub/posts/?feedView=all","summary":"𝐂𝐡𝐞𝐯𝐫𝐨𝐧 𝐚𝐧𝐝 𝐌𝐢𝐜𝐫𝐨𝐬𝐨𝐟𝐭 𝐡𝐚𝐯𝐞 𝐚𝐧𝐧𝐨𝐮𝐧𝐜𝐞𝐝 𝐏𝐫𝐨𝐣𝐞𝐜𝐭 𝐊𝐢𝐥𝐛𝐲, 𝐚 𝐧𝐞𝐰 𝐩𝐨𝐰𝐞𝐫 𝐩𝐫𝐨𝐣𝐞𝐜𝐭 𝐭𝐡𝐚𝐭 𝐰𝐢𝐥𝐥 𝐝𝐞𝐥𝐢𝐯𝐞𝐫 𝐮𝐩 𝐭𝐨 𝟐.𝟔𝟕 𝐆𝐖 𝐨𝐟 𝐝𝐞𝐝𝐢𝐜𝐚𝐭𝐞𝐝 𝐠𝐞𝐧𝐞𝐫𝐚𝐭𝐢𝐨𝐧 𝐭𝐨 𝐬𝐮𝐩𝐩𝐨𝐫𝐭 𝐌𝐢𝐜𝐫𝐨𝐬𝐨𝐟𝐭'𝐬 𝐖𝐞𝐬𝐭 𝐓𝐞𝐱𝐚𝐬 𝐀𝐈 𝐝𝐚𝐭𝐚 𝐜𝐞𝐧𝐭𝐫𝐞 𝐜𝐚𝐦𝐩𝐮𝐬. To put that into perspective: ⚡ 77 LM2500XPRESS units ⚡ 70 Titan 350 units ⚡ 47 LM6000VELOX units ⚡ 10 7F.05 units ⚡ or just 7 7HA.03 turbines. The project will primarily rely on large GE Vernova turbines, with additional capacity from Solar Turbines, although the exact configuration has not been announced. One thing is becoming increasingly clear: AI is creating utility-scale demand at a single site and opening a new chapter for the gas turbine industry. 𝐈𝐟 𝐲𝐨𝐮 𝐰𝐞𝐫𝐞 𝐝𝐞𝐬𝐢𝐠𝐧𝐢𝐧𝐠 𝐏𝐫𝐨𝐣𝐞𝐜𝐭 𝐊𝐢𝐥𝐛𝐲, 𝐰𝐡𝐢𝐜𝐡 𝐭𝐮𝐫𝐛𝐢𝐧𝐞 𝐥𝐢𝐧𝐞𝐮𝐩 𝐰𝐨𝐮𝐥𝐝 𝐲𝐨𝐮 𝐜𝐡𝐨𝐨𝐬𝐞 𝐚𝐧𝐝 𝐰𝐡𝐲? GasTurbineHub — The biggest news in gas turbines, visualised 📊","publishedText":"4 周前 •","sourceName":"Gas Turbine Hub"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/gasturbinehub/posts/?feedView=all","summary":"𝐓𝐡𝐞 𝐚𝐧𝐬𝐰𝐞𝐫 𝐢𝐬 𝐢𝐧. Many of you correctly identified the graph as the relationship between firing temperature and NOₓ and CO emissions in a gas turbine combustor. At first glance, it illustrates a well-known combustion trade-off: 📈 As firing temperature increases, NOₓ emissions tend to rise. 📉 At the same time, CO emissions decrease as combustion becomes more complete. But this graph is about much more than emissions. For decades, gas turbine manufacturers have pushed firing temperatures higher because they unlock higher efficiency, higher specific power output, and better combined-cycle performance. The challenge is that every increase in firing temperature comes with consequences: • Higher NOₓ formation • Increased cooling requirements • More compressor bleed air diverted to protect combustor and turbine hot-section components • Greater demands on materials and cooling technologies In other words, achieving higher firing temperatures is not just a combustion challenge, it's a balancing act between performance, emissions, cooling, and durability. 𝐖𝐡𝐚𝐭 𝐝𝐨 𝐲𝐨𝐮 𝐭𝐡𝐢𝐧𝐤 𝐢𝐬 𝐭𝐡𝐞 𝐛𝐢𝐠𝐠𝐞𝐬𝐭 𝐜𝐡𝐚𝐥𝐥𝐞𝐧𝐠𝐞 𝐰𝐡𝐞𝐧 𝐬𝐞𝐥𝐞𝐜𝐭𝐢𝐧𝐠 𝐭𝐡𝐞 𝐨𝐩𝐭𝐢𝐦𝐮𝐦 𝐜𝐨𝐦𝐛𝐮𝐬𝐭𝐢𝐨𝐧 𝐨𝐩𝐞𝐫𝐚𝐭𝐢𝐧𝐠 𝐩𝐨𝐢𝐧𝐭? GasTurbineHub — The biggest news in gas turbines, visualised 📊","publishedText":"3 周前 •","sourceName":"Gas Turbine Hub"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/gasturbinehub/posts/?feedView=all","summary":"A new brand has been born: 𝐒𝐢𝐞𝐦𝐞𝐧𝐬 𝐄𝐧𝐞𝐫𝐠𝐲 + 𝐒𝐢𝐞𝐦𝐞𝐧𝐬 𝐆𝐚𝐦𝐞𝐬𝐚 ➡ 𝐨𝐦𝐭𝐞𝐫𝐫𝐚 Siemens Energy has announced that it will transition to omterra, bringing together Siemens Energy and Siemens Gamesa under a single global brand. The change will be rolled out in phases later this year and reflects the company's evolution as an independent energy technology leader. LinkedIn is burning, and one thing is clear: remains! 💜 𝐖𝐡𝐚𝐭 𝐝𝐨 𝐲𝐨𝐮 𝐭𝐡𝐢𝐧𝐤 𝐚𝐛𝐨𝐮𝐭 𝐭𝐡𝐢𝐬 𝐧𝐞𝐰 𝐢𝐝𝐞𝐧𝐭𝐢𝐭𝐲? Best of luck to 𝐨𝐦𝐭𝐞𝐫𝐫𝐚 on this new era from .","publishedText":"1 周前 •","sourceName":"Gas Turbine Hub"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/gasturbinehub/posts/?feedView=all","summary":"𝐆𝐄 𝐀𝐞𝐫𝐨𝐬𝐩𝐚𝐜𝐞 𝐧𝐨𝐰 𝐡𝐚𝐬 𝐚 𝐛𝐚𝐜𝐤𝐥𝐨𝐠 𝐞𝐱𝐜𝐞𝐞𝐝𝐢𝐧𝐠 $𝟐𝟏𝟎 𝐛𝐢𝐥𝐥𝐢𝐨𝐧. A record high. Most people see this as an aerospace story. We see it as a 𝐠𝐚𝐬 𝐭𝐮𝐫𝐛𝐢𝐧𝐞 𝐬𝐮𝐩𝐩𝐥𝐲 𝐜𝐡𝐚𝐢𝐧 𝐬𝐭𝐨𝐫𝐲. Today, long lead times are often attributed to the surge in demand from AI data centers. 𝐁𝐮𝐭 𝐢𝐬 𝐭𝐡𝐚𝐭 𝐭𝐡𝐞 𝐰𝐡𝐨𝐥𝐞 𝐬𝐭𝐨𝐫𝐲? Commercial aviation and industrial gas turbines share many of the same suppliers: castings, forgings, alloys, machining, coatings, and specialized services. If aviation demand remains this strong... ...what does that mean for industrial gas turbine lead times over the next few years? ... But looking ahead, Will these two industries continue competing for manufacturing capacity, or will their supply chains gradually diverge? Congratulations to the entire team on another outstanding quarter. Keep reaching new heights! GasTurbineHub — The biggest news in gas turbines, visualised 📊","publishedText":"6 天前 •","sourceName":"Gas Turbine Hub"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/gasturbinehub/posts/?feedView=all","summary":"📈 𝐝𝐞𝐥𝐢𝐯𝐞𝐫𝐬 𝐚𝐧𝐨𝐭𝐡𝐞𝐫 𝐞𝐱𝐜𝐞𝐩𝐭𝐢𝐨𝐧𝐚𝐥 𝐪𝐮𝐚𝐫𝐭𝐞𝐫! The company's Power segment continues to benefit from unprecedented global demand for gas turbines, and the 2Q'26 results reinforce a trend we've been tracking for several quarters. Some of the highlights: ➡️ Orders: +134% vs. 2Q'25 ➡️ Revenue: +14% vs. 2Q'25 ➡️ Backlog: 116 GW, up from 100 GW Looking at gas turbine orders year-to-date: • 150 gas turbines ordered, versus 85 in 2Q'25 YTD • 80 heavy-duty gas turbines (including 27 HA units), up from 49 (15 HA) • 70 aeroderivative turbines, nearly doubling from 36 • Total ordered capacity increased from 12.2 GW to 20.1 GW These numbers reinforce three key trends: 1️⃣ Utilities and independent power producers continue to accelerate investments in new gas-fired generation. 2️⃣ Demand for HA-class turbines remains exceptionally strong, reflecting the need for highly efficient combined-cycle plants. 3️⃣ Aeroderivative gas turbines continue to gain momentum as customers seek fast, flexible power solutions for data centers, industrial facilities, and grid reliability. The gas turbine market is experiencing one of the strongest ordering cycles in decades, with continuing to capture a significant share of that demand. GasTurbineHub — The biggest news in gas turbines, visualised 📊","publishedText":"11 小时前 •","sourceName":"Gas Turbine Hub"},{"title":"航发动力 AES100 发动机获民航局型号合格证，进入批量生产","url":"http://gu.qq.com/resources/shy/news/detail-v2/index.html#/?id=nesSN2026072215511497b1680e","summary":"中国航发自主研制的 AES100 先进民用涡轴发动机先后取得中国民航局（CAAC）颁发的型号合格证（TC）。型号合格证是航空发动机进入市场与批量交付的法定准入资质，标志着该型产品正式从研制阶段转入批量生产。AES100 主要配装民用直升机，补齐国产民用涡轴发动机谱系。","publishedText":"2026-07-22 15:34:23","sourceName":"两机产业链A股"}]},{"label":"战略管理","items":[{"title":"Toggle filter Artificial Intelligence (20)","url":"https://www.iea.org/news?topic%5B0%5D=artificial-intelligence","summary":"News - IEA IEA Close Search Search About News Events Programmes Help centre IEA Skip navigation Search Energy system Chevron down Explore the energy system by fuel, technology or sector Fossil Fuels eview"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/harvard-business-review/posts/?feedView=all","summary":"Transformation is often easier talked about than done. Many leadership teams undermine their own ambitions by promoting agility, experimentation, and innovation while continuing to govern through legacy processes. Employees notice the disconnect and follow what leaders actually do, rather than what they say. The most successful transformations occur when senior leaders personally devote meaningful time to change and demonstrate a willingness to change course when evidence demands it. https://s.hbr.org/4b8Pcdr","publishedText":"9 小时前 •","sourceName":"Harvard Business Review"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/harvard-business-review/posts/?feedView=all","summary":"How to survive when you're tasked with covering the work of a colleague (or two). https://s.hbr.org/4m6oPc9","publishedText":"8 小时前 •","sourceName":"Harvard Business Review"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/harvard-business-review/posts/?feedView=all","summary":"Organizations are rushing to embed AI into core decisions, but frontline workers are left to explain outputs they neither created nor fully understand. In a multi-year study, researchers found that employees rarely relay AI results verbatim; they mask, amplify, or complement them. These hidden practices shape whether AI is trusted, and where professional risk lands. To minimize risk while using AI, companies need to develop a clear concept of accountability. Here’s how. https://s.hbr.org/4ywZjTc","publishedText":"7 小时前 •","sourceName":"Harvard Business Review"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/harvard-business-review/posts/?feedView=all","summary":"Stand out by being the person who can deliver something great over and over again. https://s.hbr.org/4nxQPGy","publishedText":"6 小时前 •","sourceName":"Harvard Business Review"},{"title":"Linke -review/posts/?feedView=all","summary":"Stay connected to the latest thinking with HBR email newsletters. Explore the collection and sign up today. https://s.hbr.org/4wkNuOj","publishedText":"3 天前 •","sourceName":"Harvard Business Review"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/harvard-business-review/posts/?feedView=all","summary":"Understand decisions in the full context they were made—available with Premium and HBR Executive access. Explore HBS Case Selections. https://s.hbr.org/4eOWKmy","publishedText":"3 天前 •","sourceName":"Harvard Business Review"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/harvard-business-review/posts/?feedView=all","summary":"Although many traits reflective of strong work ethic may come naturally to us, they can also be learned, developed, and sharpened. https://s.hbr.org/4sbYxGQ","publishedText":"2 小时前 •","sourceName":"Harvard Business Review"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/harvard-business-review/posts/?feedView=all","summary":"Discover enduring insights from the HBR magazine archive. https://s.hbr.org/4wjxsUP","publishedText":"1 天前 •","sourceName":"Harvard Business Review"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/harvard-business-review/posts/?feedView=all","summary":"New HBR reading lists are added regularly—each one curated by HBR editors and available exclusively to subscribers. https://s.hbr.org/4wn3uPR","publishedText":"1 天前 •","sourceName":"Harvard Business Review"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/harvard-business-review/posts/?feedView=all","summary":"Stronger decisions start with better thinking. Get access to all the latest from HBR. https://s.hbr.org/4gOGx3k","publishedText":"1 天前 •","sourceName":"Harvard Business Review"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/harvard-business-review/posts/?feedView=all","summary":"Stay current with the latest thinking in business and management. Explore this week's articles. https://s.hbr.org/4eG1rPm","publishedText":"11 小时前 •","sourceName":"Harvard Business Review"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/harvard-business-review/posts/?feedView=all","summary":"Work through real leadership challenges with live events, case studies, and guided learning opportunities. Learn more about HBR Executive. https://s.hbr.org/4qMlvEq","publishedText":"2 小时前 •","sourceName":"Harvard Business Review"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/boston-consulting-group/posts/?feedView=all","summary":"This week, leaders from the aerospace and defense industry are gathering at Farnborough International Airshow in the UK. As NATO members invest more in defense, there are both significant opportunities and challenges ahead for prime contractors. Find out more in this perspective from BCG's Fabio Dal Pan.","publishedText":"2 天前 • 已编辑 •","sourceName":"BCG Insights"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/boston-consulting-group/posts/?feedView=all","summary":"Aerospace and defense leaders are meeting at Farnborough 2026 this week. There are many important discussions around scaling AI and how to close the gap between ambition and execution. Visit the link to explore BCG's role at the event, especially when it comes to strategic clarity and applied AI. https://on.bcg.com/4wY7Ddn","publishedText":"2 天前 • 已编辑 •","sourceName":"BCG Insights"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/boston-consulting-group/posts/?feedView=all","summary":"From permits to payments and health records, people are using digital government services more and more. But here’s the rub. As people use government websites or chatbots more frequently, they also encounter more errors, due to increasing service sophistication and coverage. That means citizen satisfaction is in decline. However, there is also a growing opportunity for governments since citizens are more proficient and receptive to AI. Here are the key findings from BCG’s 2026 Digital Government Citizen Survey: https://on.bcg.com/4pGBC71","publishedText":"1 天前 •","sourceName":"BCG Insights"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/boston-consulting-group/posts/?feedView=all","summary":"Every career is shaped by opportunities to learn, evolve and grow. At the WOMEN@BCG Leadership Offsite 2026, women leaders from across BCG India came together to create space for exactly those conversations. From painting portraits inspired by one another's stories, to discussing key topics that impact their overall journey, the day was built around listening as much as sharing. Moments that defined the day included: • Leadership Library: A showcase of books recommended by WOMEN@BCG leaders, each accompanied by a personal note on what participants could take away from it • The Collective Canvas: Where creativity became the starting point for connection, and participants painted portraits inspired by each other’s stories rather than appearances • A thought-provoking chat with Chhavi Rajawat on leading with conviction, embracing uncertainty and creating impact by writing your own playbook • The Long Game where BCG leaders shared experiences on building resilience, sponsorship, sustaining wellbeing and navigating career and life transitions • Open-House with Rahul Jain, Nimisha Jain [she/her] & Neha Gupta: A very candid dialogue on topics that deeply matter to women & our leaders - from managing health, navigating perceptions of meritocracy, to many other realities that don't always find space in everyday conversations • A specially curated evening that extended the discussions beyond the formal agenda, creating space to connect more personally, celebrate together, and strengthen relationships. The themes that emerged reflected the breadth of aspirations, opportunities and realities that shape women's careers today. These will continue to steer Women@BCG's focus areas as we create more pathways for our women employees to learn, connect and thrive at every stage of their careers.","publishedText":"1 天前 •","sourceName":"BCG Insights"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/boston-consulting-group/posts/?feedView=all","summary":"【「独り言」が最強の仕事術に？ 音声入力AIが変える働き方】 ChatGPTやClaudeの音声機能の進化に加え、AppleのSiri AIや日本発の音声AIも登場し、「声でAIを使う」という働き方が現実になりつつあります。 https://lnkd.in/dvPagwcm BCG Xの高柳慎一（Shinichi Takayanagi, Ph.D.)が、自身の実体験も交えながら解説します。 ・企業でも音声AIの導入が本格化。GMOでは約8,300人の従業員を対象に展開 ・音声AIは声を直接処理する「エンドツーエンド型」へ進化。より自然な対話を実現 ・話すスピードはタイピングの約2〜3倍。AIが思考を整理することで、思考の質を上げてくれる 「まず話して、後でAIが整える」──そんな\"ボイスファースト\"な知的生産が、新たなスタンダードになるかもしれません。","publishedText":"6 天前 •","sourceName":"BCG Insights"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/boston-consulting-group/posts/?feedView=all","summary":"AI is changing more than the tools we use. It's changing how we work. Across BCG, more than 3,500 BCGers are building their own AI workflows—experimenting, sharing ideas, and finding new ways to solve problems. Building AI capability isn't just about having access to the latest tools. It's about creating an environment where people can experiment and see what's possible. Explore AI careers at BCG: https://on.bcg.com/4f70txk","publishedText":"5 天前 •","sourceName":"BCG Insights"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/boston-consulting-group/posts/?feedView=all","summary":"We’re proud to share that BCG X’s Agentic marketing team has been recognized with the 2026 CODiE Awards for Best Marketing Solution — a peer-recognized honor celebrating excellence and innovation across the technology landscape. This award highlights the impact of Agentic marketing, an end-to-end AI-powered solution that reimagines how organizations plan, build, and optimize marketing. By connecting market and brand performance sensing, campaign development, localization, and continuous optimization within one intelligent insight-to-impact loop, the product enables marketing teams to make faster, smarter decisions and drive greater business value at scale. Congratulations to the team of forward-deployed engineers, designers, and product leaders behind Agentic marketing for building a breakthrough product that brings together AI, data, and human expertise to transform the future of marketing. Meet the leaders driving this innovation and explore more about BCG’s product portfolio: https://lnkd.in/eYf4SF5P ?utm_source=linkedin&utm_medium=social&utm_campaign=bcgx&utm_description=organic&utm_topic=none&utm_geo=global&utm_content=codieawards_repost","publishedText":"2 天前 • 已编辑 •","sourceName":"BCG Insights"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/boston-consulting-group/posts/?feedView=all","summary":"Defense aviation spending is rising, with rapid growth in segments such as drones and low-cost autonomous systems. But is that growth profitable? BCG and Vertical Research Partners analyzed where profitability sits across the defense industry. While new competitors and less-expensive solutions are a threat, legacy platforms will likely remain the dominant source of profits in the defence industry for the foreseeable future. Investors and industry leaders should assess the full business case before shifting capital. https://on.bcg.com/3T9l6Ak","publishedText":"2 天前 •","sourceName":"BCG Insights"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/boston-consulting-group/posts/?feedView=all","summary":"Defense aviation spending keeps climbing, with drones and low-cost autonomous systems growing fastest. Profitability, though, tells a different story. BCG and Vertical Research Partners analyzed where profitability really sits across the defense industry. New entrants and cheaper solutions pose a real threat, yet legacy platforms will likely stay the industry's main profit driver for the foreseeable future. Investors and industry leaders should weigh the full business case before shifting capital. https://on.bcg.com/4pwlZz7","publishedText":"11 小时前 •","sourceName":"BCG Insights"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/boston-consulting-group/posts/?feedView=all","summary":"US military aircraft maintenance spending has roughly doubled since 2000. But readiness hasn't kept pace. The pattern holds worldwide. And a large share of military aircraft sits grounded at any given time. Maintenance - how it is planned, prioritized, and governed - is one of the drivers of this downtime, according to BCG research. Fix that, and mission-capable rates can climb fast, at no added cost. This is where the industry should be focusing attention at FIA this week. https://on.bcg.com/3TbNaTG","publishedText":"1 天前 • 已编辑 •","sourceName":"BCG Insights"}]},{"label":"能源","items":[{"title":"电网负荷连创历史新高 国网重庆电力多举措积极应对","url":"https://www.cpnn.com.cn/news/dianli2023/202607/t20260716_1902511.html","summary":"电网","publishedText":"2026-07-15T16:00:00.000Z","sourceName":"中国电力新闻网 (CPNN)"},{"title":"鏖战七昼夜点亮荷城 贵州电网公司圆满完成跨省抢修复电任务","url":"https://www.cpnn.com.cn/news/dianli2023/202607/t20260716_1902522.html","summary":"电网","publishedText":"2026-07-15T16:00:00.000Z","sourceName":"中国电力新闻网 (CPNN)"},{"title":"Toggle filter Energy Sub-Saharan Africa (23)","url":"https://www.iea.org/news?programme%5B0%5D=energy-sub-saharan-africa","summary":"News - IEA IEA Close Search Search About News Events Programmes Help centre IEA Skip navigation Search Energy system Chevron down Explore the energy system by fuel, technology or sector Fossil Fuels Renewables and Low-Emissions Fuels Transport Industry Buildings Explore all Topics Chevron down Under","publishedText":"","sourceName":"IEA"},{"title":"Toggle filter Clean Energy Transitions in Emerging Economies…","url":"https://www.iea.org/news?programme%5B0%5D=clean-energy-transitions-in-emerging-economies","summary":"News - IEA IEA Close Search Search About News Events Programmes Help centre IEA Skip navigation Search Energy syst const PALETTE = ["#818cf8","#34d399","#fbbf24","#fb7185","#22d3ee","#a78bfa","#f472b6","#4ade80","#60a5fa","#facc15"];
const DEFAULT_COLOR = "#94a3b8";
const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];

function pad(n){return n<10?"0"+n:""+n;}
function fmtDateHuman(s){
  if(!s) return "—";
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(m){ const d=new Date(+m[1], +m[2]-1, +m[3]); return `${m[1]}年${+m[2]}月${+m[3]}日 ${WEEK[d.getDay()]}`; }
  return s;
}
function fmtWhen(s){
  if(!s) return "";
  // 已是相对描述（如 "5 天前"）直接清理尾部的 "•"
  let t = String(s).replace(/•/g,"").replace(/\s+/g," ").trim();
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t);
  if(m){ const d=new Date(+m[1], +m[2]-1, +m[3]); return `${m[1]}年${+m[2]}月${+m[3]}日`; }
  return t;
}
function truncate(s,n){
  const arr=[...(s||"")];
  return arr.length>n ? arr.slice(0,n).join("")+"…" : s;
}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(data){
  const secs = data.sections||[];
  const date = data.date || "";
  document.getElementById("dateBig").textContent = fmtDateHuman(date);
  document.getElementById("windowLine").textContent = data.windowText || "";

  let total=0; secs.forEach(s=>total+=(s.items?s.items.length:0));
  document.getElementById("totalNum").textContent = total;

  const chips=document.getElementById("secChips"), nav=document.getElementById("nav");
  chips.innerHTML=""; nav.querySelectorAll("a:not(.totop)").forEach(a=>a.remove());

  secs.forEach((s,idx)=>{
    const col=PALETTE[idx%PALETTE.length];
    const n=(s.items?s.items.length:0);
    const chip=document.createElement("div");
    chip.className="sec-chip";
    chip.innerHTML=`<span class="dot" style="background:${col}"></span>${esc(s.label)} <b>${n}</b>`;
    chip.onclick=()=>document.getElementById("sec-"+idx).scrollIntoView();
    chips.appendChild(chip);
    const link=document.createElement("a");
    link.href="#sec-"+idx; link.textContent=s.label;
    nav.insertBefore(link,nav.querySelector(".totop"));
  });

  const wrap=document.getElementById("sections");
  wrap.innerHTML="";
  let counter=0;
  secs.forEach((s,idx)=>{
    const col=PALETTE[idx%PALETTE.length];
    const sec=document.createElement("section");
    sec.className="section"; sec.id="sec-"+idx; sec.style.setProperty("--sec",col);
    const items=s.items||[];
    sec.innerHTML=`<div class="section-head"><span class="bar"></span><h2>${esc(s.label)}</h2>`
      +`<span class="cnt">${items.length} 条</span></div>`;
    const grid=document.createElement("div"); grid.className="grid";
    items.forEach(it=>{
      counter++;
      const url=it.url||"#";
      const src=it.sourceName||"未知来源";
      const sum=truncate(it.summary,60);
      const card=document.createElement("article");
      card.className="card"; card.style.setProperty("--sec",col);
      card.innerHTML=
        `<div class="top"><span class="num">${counter}</span>`
        +`<span class="src" title="${esc(src)}">${esc(src)}</span></div>`
        +`<h3><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(it.title||"")}</a></h3>`
        +`<p class="sum">${esc(sum)}</p>`
        +`<div class="foot"><a class="read" href="${esc(url)}" target="_blank" rel="noopener noreferrer">查看原文 ↗</a>`
        +`<span class="when">${esc(fmtWhen(it.publishedText))}</span></div>`;
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    wrap.appendChild(sec);
  });

  if(!secs.length){
    wrap.innerHTML=`<div class="empty">本窗口内暂无采集内容。</div>`;
  }

  const srcList=(data.sources||[]).map(s=>`<b>${esc(s)}</b>`).join("、");
  document.getElementById("footer").innerHTML=
    `总条数 <b>${total}</b> 条 · 数据来源 ${srcList||"—"}`
    +` · 报告日期 ${esc(date)} <span class="badge snap">引擎快照</span><br>`
    +`本仪表盘由 source-collection-engine 渲染：每日仅需重跑流水线即可复用同一版式。`;
}

render(EMBEDDED_DATA);
</script>

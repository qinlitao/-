<style>
  :root{
    --bg:#0f1117; --bg-soft:#171a22; --card:#1b1f29; --card-hover:#222736;
    --text:#e8eaf0; --muted:#9aa3b6; --border:#2a2f3c; --shadow:0 6px 24px rgba(0,0,0,.38);
    --hero-grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 45%,#db2777 100%);
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6fb; --bg-soft:#ffffff; --card:#ffffff; --card-hover:#f1f3fa;
      --text:#171a22; --muted:#5b6573; --border:#e7eaf2; --shadow:0 6px 22px rgba(30,40,80,.10);
      --hero-grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 45%,#ec4899 100%); }
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}

  /* ---------- HERO ---------- */
  .hero{background:var(--hero-grad);color:#fff;padding:38px 22px 30px;text-align:center;position:relative;overflow:hidden;}
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% -20%,rgba(255,255,255,.18),transparent 60%);pointer-events:none;}
  .hero .kicker{font-size:13px;letter-spacing:.32em;text-transform:uppercase;opacity:.85;margin:0 0 6px;}
  .hero h1{margin:0;font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:.02em;}
  .hero .date-big{font-size:clamp(20px,4vw,30px);font-weight:700;margin:14px 0 2px;}
  .hero .window{font-size:14px;opacity:.92;margin:0 0 18px;}
  .stat-total{display:inline-flex;align-items:baseline;gap:8px;background:rgba(255,255,255,.16);
    backdrop-filter:blur(6px);padding:8px 18px;border-radius:999px;font-size:15px;margin-bottom:20px;}
  .stat-total b{font-size:24px;font-weight:800;}
  .sec-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:920px;margin:0 auto;}
  .sec-chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.22);padding:6px 13px;border-radius:999px;font-size:13px;cursor:pointer;transition:.15s;}
  .sec-chip:hover{background:rgba(255,255,255,.26);}
  .sec-chip .dot{width:9px;height:9px;border-radius:50%;}
  .sec-chip b{font-weight:700;}

  /* ---------- ANCHOR NAV ---------- */
  .nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;gap:6px;
    padding:10px 14px;overflow-x:auto;scrollbar-width:none;}
  .nav::-webkit-scrollbar{display:none;}
  .nav a{flex:0 0 auto;font-size:13.5px;color:var(--muted);padding:7px 12px;border-radius:9px;
    border:1px solid transparent;white-space:nowrap;transition:.15s;}
  .nav a:hover{color:var(--text);background:var(--card-hover);border-color:var(--border);}
  .nav .totop{margin-left:auto;color:var(--muted);}

  /* ---------- SECTIONS ---------- */
  main{max-width:1180px;margin:0 auto;padding:26px 16px 60px;}
  .section{margin:30px 0 8px;scroll-margin-top:64px;}
  .section-head{display:flex;align-items:center;gap:12px;margin:0 0 16px;}
  .section-head .bar{width:5px;height:26px;border-radius:3px;background:var(--sec);}
  .section-head h2{margin:0;font-size:20px;font-weight:800;}
  .section-head .cnt{margin-left:auto;font-size:13px;color:var(--muted);background:var(--card);
    border:1px solid var(--border);padding:3px 11px;border-radius:999px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:16px 16px 14px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;transition:.18s;position:relative;overflow:hidden;}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sec);opacity:.85;}
  .card:hover{transform:translateY(-3px);background:var(--card-hover);}
  .card .top{display:flex;align-items:center;gap:10px;}
  .num{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--sec);color:#fff;
    font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .src{margin-left:auto;font-size:12px;color:var(--muted);background:var(--bg-soft);
    border:1px solid var(--border);padding:3px 10px;border-radius:999px;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card h3{margin:2px 0 0;font-size:16px;font-weight:700;line-height:1.45;}
  .card h3 a:hover{text-decoration:underline;text-decoration-color:var(--sec);}
  .card .sum{margin:0;font-size:14px;color:var(--muted);flex:1;}
  .card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;}
  .card .read{font-size:13px;font-weight:600;color:var(--sec);display:inline-flex;align-items:center;gap:4px;}
  .card .read:hover{text-decoration:underline;}
  .card .when{font-size:12px;color:var(--muted);}

  footer{max-width:1180px;margin:0 auto;padding:22px 16px 50px;color:var(--muted);font-size:13px;
    border-top:1px solid var(--border);text-align:center;line-height:1.8;}
  footer a{color:var(--sec);}
  .badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--border);
    margin-left:6px;vertical-align:middle;}
  .badge.snap{color:#fbbf24;border-color:#fbbf2466;background:#fbbf2414;}
  .empty{padding:40px;text-align:center;color:var(--muted);}
</style>

const EMBEDDED_DATA = {"date":"2026-08-01","period":"daily","windowText":"当日（北京时间）","sources":["中国电力新闻网 (CPNN)","ASME IGTI","BloombergNEF","Energetica India","World Nuclear News","Modern Power Systems","Gas Turbine World","Cummins","Rolls-Royce Power Systems (mtu)","Everllence (原 MAN Energy)","INNIO (Jenbacher/Waukesha)","GE Vernova","Power Technology"],"sections":[{"label":"燃气轮机","items":[{"title":"Gas Is Letting Data Centers Grow Beyond the Grid","url":"https://about.bnef.com/insights/data-centers/gas-is-letting-data-centers-grow-beyond-the-grid/","summary":"Artificial intelligence is heating up the race to build data centers, and with BloombergNEF projecting 194 gigawatts of demand by 2035, the biggest challenge isn't computing power…. It's electricity. Faced with years-long grid connection delays, developers are turning to on-site gas generation to bring projects online faster, creating a rapidly expanding market for turbines, engines, fuel cells and battery storage. Choosing the right technology is a trade-off between speed, cost, efficiency and emissions. And while on-site generation is often seen as a temporary bridge, developers are also weighing what role those assets could play once permanent grid connections become available.","publishedText":"Wed, 29 Jul 2026 18:28:15 +0000","sourceName":"BloombergNEF"},{"title":"Nama PWP Floats Consultancy Tender for 3 GW Solar 2030 IPPs …","url":"https://www.energetica-india.net/news/nama-pwp-floats-consultancy-tender-for-3-gw-solar-2030-ipps-in-oman","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition May-June 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Middle East Market &rsaquo;Nama PWP Floats Consultancy Tender for 3 GW Solar 2030 IPPs in Oman Nama PWP Floats Consultancy Tender for 3 GW Solar 2030 IPPs in Oman Oman& ;s Nama PWP has invited bids for financial and commercial consultancy services to support the development and competitive procurement of three 1 GW Solar 2030 IPPs with a combined capacity of 3 GW. July 31, 2026. By EI News Network Nama Power and Water Procurement Company (PWP) has invited bids for financial and commercial consultancy services to support the development and competitive procurement of three utility scale Solar 2030 Independent Power Projects (IPPs) in Oman, with a combined planned capacity of 3,000 MW. The tender&nbsp;seeks to appoint a financial and commercial consultant to advise PWP on the development, financial structuring and competitive tendering of the proposed Solar 2030 IPP projects. Under the proposed programme, each of the three solar projects is planned to have a generation capacity of around 1,000 MW and will be connected to Oman& ;s Main Interconnected System (MIS). The selected consultant will provide financial and commercial advisory services throughout project development and the competitive procurement process. The consultancy assignment includes advising PWP on commercially robust project structures, procurement strategies and financial frameworks to support the successful implementation of the large scale solar IPPs. The tender forms part of Oman& ;s Solar 2030 programme, which aims to accelerate utility scale renewable energy deployment, diversify the Sultanate& ;s power generation mix and increase the share of clean energy in the national electricity system. The three solar projects are expected to add a combined 3 GW of solar generation capacity and support Oman& ;s long term renewable energy and power sector goals. The latest tender follows PWP& ;s earlier invitation for technical consultancy services covering four Solar 2030 IPPs, each with a planned capacity of 1,000 MW, representing a combined capacity of 4 GW. That assignment includes project development, preparation of technical documentation, procurement support, evaluation of technical submissions and advisory services through the tendering process until project award. Together, the financial, commercial and technical consultancy tenders demonstrate PWP& ;s continued efforts to advance a major pipeline of utility scale solar IPPs and strengthen Oman& ;s renewable energy expansion programme. Tags: Middle East Market Nama Oman Nama Power and Water Procurement Company Solar 2030 IPP Oman Oman utility scale Solar 2030 IPPs Oman IPPs Oman large scale solar IPPs Nama PWP Floats Consultancy Tender Please share! --> --> -","publishedText":"2026-07-31T04:07:26.000Z","sourceName":"Energetica India"},{"title":"Initiative launched to bolster Italian nuclear supply chain","url":"https://www.world-nuclear-news.org/articles/initiative-launched-to-bolster-italian-nuclear-supply-chain","summary":"HOME / NEW NUCLEAR Initiative launched to bolster Italian nuclear supply chain Tuesday, 28 July 2026 Italian power technology firm Ansaldo Energia and certification and engineering company RINA have agreed to support the development of the country& ;s nuclear supply chain and enable companies to seize opportunities in the rapidly growing global nuclear market by guiding them through a structured certification pathway. &nbsp; (Image: RINA) The initiative is primarily aimed at companies that are not currently active in the nuclear sector but possess transferable industrial capabilities, with the goal of expanding and strengthening the national industrial base. The project includes preliminary assessments, gap analyses against international standards, and upgrade pathways to access the nuclear market. RINA will support companies throughout the certification and qualification process, while Ansaldo Energia will provide its industrial expertise in the sector, sharing market requirements and promoting initiatives to support certification processes through financial backing from institutions and public instruments for internationalisation and industrial development. Companies interested in joining the initiative can find further information on the websites of RINA and Ansaldo Energia. &quot;Strengthening the country& ;s industrial capacity is an essential step to enable Italian companies to seize the opportunities of a rapidly growing nuclear market,&quot; said Ansaldo Energia CEO Fabrizio Fabbri. &quot;We are pleased to launch this initiative together with a leading partner such as RINA, building on other initiatives already undertaken by Ansaldo Energia, such as the recent agreement with SIMEST, aimed at supporting the growth and internationalisation of the supply chain.&quot; Carlo Luzzatto, CEO and General Manager of RINA, added: &quot;The renewed global momentum behind nuclear energy is creating significant new opportunities for Italy& ;s industrial sector. Through this initiative, we aim to support companies on a structured qualification pathway, enabling them to progressively develop the capabilities and meet the requirements needed to operate in an industry defined by the highest regulatory, technological, and safety standards. By combining RINA& ;s expertise with Ansaldo Energia& ;s extensive industrial experience, we will help strengthen the competitiveness of Italy& ;s nuclear supply chain and enhance its ability to capitalise on the opportunities arising from both national and international nuclear programmes.&quot; &quot;The Italian Nuclear Association expresses its strong appreciation and full support for this initiative, which is of fundamental importance to strengthen and coordinate a national nuclear supply chain that can already rely on expertise and industrial capabilities developed also through significant projects abroad,&quot; said Stefano Monti, Chairman of the Italian Nuclear Association. &quot;This represents a strat","publishedText":"2026-07-28T05:37:37.000Z","sourceName":"World Nuclear News"},{"title":"New Nuclear Thursday, 30 July 2026--> Chinese helium turbine…","url":"https://www.world-nuclear-news.org/articles/chinese-helium-turbine-test-facility-completes-hot-testing","summary":"HOME / NEW NUCLEAR Chinese helium turbine test facility completes hot testing Thursday, 30 July 2026 China& ;s first megawatt-class helium turbine test facility, constructed by China National Nuclear Corporation subsidiary CNNC Huaxing, has successfully completed its hot power generation test. &nbsp; The helium turbine test facility (Image: CNNC) The helium turbine comprehensive performance test bench is a closed-loop Brayton cycle heat-work conversion system with helium as the core working medium. The Brayton cycle is a thermodynamic cycle that models the workings of gas turbine engines and jet engines, consisting of four main processes: isentropic compression, constant-pressure heat addition, isentropic expansion, and constant-pressure heat rejection. It functions by drawing in and pressurising a gas, heating it, expanding it to do work, and cooling it back down. In a closed-loop Brayton cycle, a clean working fluid (such as helium) stays trapped inside a loop and is cooled and reheated using external heat exchangers. (Image: CNNC) &quot;This test marks the first time in China that a high-power turbine has been driven by pure helium as the working fluid to achieve power generation, signifying a decisive step forward for China in the field of core power equipment for gas-cooled microreactors, moving from theoretical verification to engineering demonstration,&quot; CNNC said. It added: &quot;The project team, demonstrating a spirit of overcoming difficulties, scientifically arranged construction procedures and completed the installation of the entire test bench system with high quality, laying a solid hardware foundation for the smooth conduct of cold, hot, and power generation tests by the research group.&quot; In December 2023, the demonstration High Temperature Gas-Cooled Reactor - Pebble-bed Module (HTR-PM) in Shidao Bay (also known as Shidaowan) in China entered commercial operation. The HTR-PM features two small reactors that drive a single 210 MWe steam turbine. Most Read Tuesday, 28 July 2026 --> Initiative launched to bolster Italian nuclear supply chain Tuesday, 28 July 2026 Friday, 24 July 2026 --> Oklo cleared to start up test reactor Friday, 24 July 2026 Thursday, 23 July 2026 --> Nuclearelectrica's proposal to review SMR options rejected by ministry Thursday, 23 July 2026 Tuesday, 21 July 2026 --> Multiple MSRs proposed for French industrial park Tuesday, 21 July 2026 Podcasts & Features Podcast: Why is the World Nuclear Investment Guide needed? Podcasts &amp; Features &middot; Friday, 31 July 2026 Viewpoint: IAEA's non-proliferation safeguards and industry's role Podcasts &amp; Features &middot; Friday, 24 July 2026 All Podcasts & Features Related Information Nuclear Power in China Small Nuclear Power Reactors WNN is a public information service of World Nuclear Association. Related Topics Small Modular Reactors &middot; Research and development &middot; China &middot; Related Links CNNC &middot; CNNC Huaxing &middot; Related Sto","publishedText":"2026-07-30T08:04:49.000Z","sourceName":"World Nuclear News"},{"title":"(无标题)","url":"https://www.modernpowersystems.com/news/worley-named-epc-partner-for-connahs-quay-low-carbon-power-project/","summary":"News Worley named EPC partner for Connah’s Quay Low Carbon Power Project The facility aims to capture at least 95% of carbon emissions and could deliver up to 1.38 GW of low-carbon electricity from 2030. July 28, 2026 Share Copy Link Share on X Share on Linkedin Share on Facebook The Connah& ;s Quay Power Station in Flintshire, Wales (Credit: Uniper) Australian engineering firm Worley has been appointed preferred Engineering, Procurement and Construction (EPC) supplier for Uniper’s proposed Connah’s Quay Low Carbon Power (CQLCP) project in Deeside, UK, marking a further step towards a new gas-fired power station fitted with carbon capture technology. The announcement was made after the completion of a competitive Front End Engineering Design (FEED) process that began in December 2024. The company will now work with Uniper alongside technology partners including Siemens Energy and SLB Capturi, as well as construction partners, to progress the project. The proposed facility is intended to support lower-carbon electricity generation by capturing at least 95% of its carbon dioxide emissions. Captured CO 2 would be transported through infrastructure being developed as part of the HyNet industrial cluster before being stored permanently offshore in repurposed depleted gas fields. The project could eventually provide up to 1.38 GW of low-carbon generating capacity across two phases, with the first phase potentially operational from 2030. Mike Lockett, Uniper UK Country Chair, said the EPC selection represented an important milestone for the development. “We are pleased to be marking another key step for our CQLCP project and are looking forward to working with Worley on the next stage of the process,” he said. “We would like to thank both contractors involved in the competitive FEED for their constructive participation.” The project still requires regulatory approval, with Uniper having submitted a Development Consent Order application in August 2025. A decision is expected in the coming months. Jim Shaughnessy, President of Major Projects &amp; Programs, EMEA at Worley, said the company would focus on bringing together engineering, technology integration and delivery planning. “Through our experience delivering complex energy infrastructure projects, we understand the importance of integrating technology, execution planning and delivery from the outset,” he said. The proposed power station would be built next to Uniper’s existing Connah’s Quay facility, creating a potential new low-carbon energy hub in North Wales. --> Sign up for our weekly news round-up! Give your business an edge with our leading industry insights. Sign up Share Copy Link Share on X Share on Linkedin Share on Facebook Partner Content Hexagon NEM Energy Promecon Rentech Boiler Systems More Relevant News Hitachi Energy, L& ;T secure new grid deals with TenneT News Nadara finalises $1.36bn refinancing for European renewables portfolio News BHEL wins major gas turbine order for N","publishedText":"2026-07-28T16:27:43.000Z","sourceName":"Modern Power Systems"},{"title":"(无标题)","url":"https://www.modernpowersystems.com/news/envision-to-deliver-australias-largest-turbines-for-179-mw-wind-farm/","summary":"News Envision to deliver Australia& ;s largest turbines for 179 MW wind farm The project will use 23 EN182-7.8 MW turbines, the largest ever installed in Australia. July 28, 2026 Share Copy Link Share on X Share on Linkedin Share on Facebook (Image credit: Envision Energy) Envision Energy has received the Notice to Proceed from Neoen, a leading renewable energy specialist, for the turbine supply and installation package of its 179 MW Narrogin Wind Farm in Western Australia. It marks a significant milestone in the company& ;s strategic expansion in Australia and another step toward delivering its energy system in one of the world& ;s fastest-growing renewable energy markets. The project will deploy 23 Envision EN182-7.8 MW smart wind turbines featuring a 155 m hub height and a 182 m rotor diameter – the largest wind turbines ever installed in Australia. Designed with the aim of maximising energy production while lowering the levelised cost of electricity, the turbines will contribute approximately 3% of the annual electricity demand of Western Australia& ;s South West Interconnected System (SWIS). Neoen& ;s Narrogin wind farm is Envision Energy& ;s second active Australian wind project awarded within the past 12 months, following its entry into the Pilbara region with 17 EN-182/7.8 MW wind turbines. It will also become Envision Energy& ;s first grid-connected wind farm for a client in Australia, connecting to Western Power& ;s existing 220 kV transmission line into the South West Interconnected System Envision will supply, deliver, install and commission the wind turbines in partnership with the UGL and CPB Contractors (members of the CIMIC Group). The company has also signed a 30-year Operations and Maintenance (O&amp;M) Agreement with Neoen, providing long-term lifecycle support to maximise asset performance and reliability throughout the project& ;s operational life. & ;The energy transition is entering a new phase, where success depends not only on adding more renewable generation, but on building intelligent energy infrastructure.& ; said Kane Xu, senior VP and president of International Product Line at Envision Energy. & ;Australia is a strategic market for Envision, and Neoen& ;s Narrogin Wind Farm marks another important milestone in our long-term commitment to the country.” --> Sign up for our weekly news round-up! Give your business an edge with our leading industry insights. Sign up Share Copy Link Share on X Share on Linkedin Share on Facebook Partner Content Hexagon NEM Energy Promecon Rentech Boiler Systems More Relevant News Hitachi Energy, L& ;T secure new grid deals with TenneT News Nadara finalises $1.36bn refinancing for European renewables portfolio News BHEL wins major gas turbine order for Nigeria& ;s Dangote Refinery News Everllence secures 480 MW gas engine contract for US hyperscale data centre","publishedText":"2026-07-28T22:30:03.000Z","sourceName":"Modern Power Systems"},{"title":"(无标题)","url":"https://www.modernpowersystems.com/news/delectrik-to-deploy-indias-first-100-mwh-utility-scale-battery/","summary":"News Delectrik to deploy India& ;s first 100 MWh utility scale battery The system will be deployed in 2027 at the Khavda Solar Park. July 28, 2026 Share Copy Link Share on X Share on Linkedin Share on Facebook (Photo credit: Delectrik Systems) Delectrik Systems will deploy the first utility scale Vanadium Redox Flow battery project of 100 MWh capacity in India. Delectrik won the tender in collaboration with Bondada Engineering and the project was awarded by NTPC Renewable Energy Ltd, a wholly owned subsidiary of NTPC Ltd. NTPC is India& ;s largest integrated power utility with an installed capacity of over 90 GW It has a target to reach 149 GW by 2032. Out of the total, NTPC aims to have 60 GW of renewable energy capacity. The installation will be based on Delectrik& ;s non-containerised Flow Battery product architecture suitable for large industrial and utility scale applications. The system will be deployed in 2027 at Khavda Solar Park which is slated to become the world& ;s largest RE park with 30 GW of generation capacity by 2029. The company had successfully deployed a smaller 3 MWh variant of a similar product in 2025 at Greater Noida, NTPC. Dr Vishal Mittal, founder &amp; CEO of Delectrik stated, & ;This will be a first non-lithium utility scale BESS project to be deployed in India and first project of this scale to be 100% designed engineered and manufactured in India.” Delectrik is targeting an order book of, at the minimum, 1 GWh Flow battery capacity in the next 12 months across India, Australia, ASEAN, Africa and few other geographies. --> Sign up for our weekly news round-up! Give your business an edge with our leading industry insights. Sign up Share Copy Link Share on X Share on Linkedin Share on Facebook Partner Content Hexagon NEM Energy Promecon Rentech Boiler Systems More Relevant News Hitachi Energy, L& ;T secure new grid deals with TenneT News Nadara finalises $1.36bn refinancing for European renewables portfolio News BHEL wins major gas turbine order for Nigeria& ;s Dangote Refinery News Everllence secures 480 MW gas engine contract for US hyperscale data centre","publishedText":"2026-07-28T22:30:34.000Z","sourceName":"Modern Power Systems"},{"title":"(无标题)","url":"https://www.modernpowersystems.com/news/ghana/","summary":"News A fault on Ghana& ;s power grid triggers widespread outages Preliminary investigations by state-run transmission utility GRIDCo have identified a lightning strike as the likely cause. July 30, 2026 Share Copy Link Share on X Share on Linkedin Share on Facebook (Image credit: Sehenswerk via Shutterstock) On 29 July Ghana suffered a major blackout of its electricity supply system, leaving the capital Accra, and the commercial hub Kumasi, as well as much of the north of the country, without electricity for 18 hours. In some areas the effects lasted longer, as consumers suffered further interruptions. The outage began in the early hours of 29 July, following a disturbance on the National Interconnected Transmission System at 3.11 am, which caused several generating plants to trip simultaneously and shut down. GRIDco , the state-run power distribution company, activated emergency procedures and ‘worked with power sector stakeholders’ to bring electricity back on line while launching a full technical investigation. But at the time of writing it could not say how long it would take for normal supplies to resume fully. From its preliminary investigation, GRIDco has identified the cause as a lightning strike. Further details are not yet available as GRIDco is still awaiting more detailed reports. It has launched a comprehensive investigation, and has promised to provide updates as more results emerge. Ghana has suffered regular power shortages for several years – they are popularly known as ‘dumsor’, meaning ‘on and off’ in the Akan language – but reportedly the situation has been improving. The country generates electricity domestically using natural gas, hydropower (such as the Bui Dam), and thermal plants. Overall it is a power exporter to neighbouring countries. It engages in energy trades and fuel exchanges in the West African power pool. Most of the country& ;s hydropower plants are ageing, having reputedly suffered from poor maintenance over years. The addition of gas to the mix has eased power cuts, but the sector remains vulnerable to transmission failures and fuel supply interruptions. --> Sign up for our weekly news round-up! Give your business an edge with our leading industry insights. Sign up Share Copy Link Share on X Share on Linkedin Share on Facebook Partner Content Hexagon NEM Energy Promecon Rentech Boiler Systems More Relevant News Hitachi Energy, L& ;T secure new grid deals with TenneT News Nadara finalises $1.36bn refinancing for European renewables portfolio News BHEL wins major gas turbine order for Nigeria& ;s Dangote Refinery News Everllence secures 480 MW gas engine contract for US hyperscale data centre","publishedText":"2026-07-30T20:37:39.000Z","sourceName":"Modern Power Systems"},{"title":"Everllence secures 480 MW gas engine contract for US hypersc…","url":"https://www.modernpowersystems.com/news/everllence-secures-480-mw-gas-engine-contract-for-us-hyperscale-data-centre/","summary":"News Everllence secures 480 MW gas engine contract for US hyperscale data centre The modular 18V51/60G engines will be delivered from mid-2026 and paired with emissions controls and digital services to meet fast-growing data centre power demand. July 29, 2026 Share Copy Link Share on X Share on Linkedin Share on Facebook (Image credit: Everllence) Everllence has signed a contract to supply 24 gas engines with a combined output of 480 MW for a hyperscale data centre in the United States. The engines will provide off-grid power for the facility, allowing it to operate independently of the local electricity network. Delivery of the 24 × 18V51/60G gas engines is scheduled to begin in mid-2026, with commissioning planned to match the data centre’s phased expansion. Everllence will provide the power generation equipment, supported by its digital services including PrimeServ Assist and CEON TechBot. The company’s medium-speed engine technology will form the core of the site’s energy system. The project addresses a growing challenge for large data centre operators in the US: securing sufficient grid capacity quickly enough to support expanding digital infrastructure. Grid connection waiting times can stretch for several years in some regions, creating demand for independent power solutions. The natural gas-fired engines will be equipped with selective catalytic reduction (SCR) systems and oxidation catalysts to meet strict emissions requirements. Their modular arrangement, using 24 separate generating units, will allow the operator to increase capacity as computing demand grows while maintaining operational flexibility. Johann Stocks, Head of Power, Americas at Everllence, said the contract highlights the changing requirements of the data centre market. “This contract is one of our most important off-grid data centre projects in the United States and strengthens our position in a rapidly evolving digital infrastructure sector,” he said. “Our medium speed engines offer a valuable alternative that is ideal for data centres without direct grid access.” Unlike conventional single large-scale generation systems, the modular engine approach allows individual units to be started, stopped or adjusted according to demand. This can improve efficiency during periods of lower load while maintaining the stable power quality required by sensitive computing equipment. Tom Drake, National Sales Manager at Everllence, said: “Energy infrastructure requirements for data centres are enormous. With this solution, we are providing our U.S. customer with a fast, independent and scalable power supply.” The 51/60 engine family has an installed global capacity of around 8 GW and is used in power generation applications worldwide. The 51/60G model can operate with blends containing up to 25% hydrogen and can reach start-up times of less than five minutes, supporting future flexibility as energy systems evolve. --> Sign up for our weekly news round-up! Give your business an edge wi","publishedText":"2026-07-29T12:25:15.000Z","sourceName":"Modern Power Systems"},{"title":"BHEL wins major gas turbine order for Nigeria&#8217;s Dangot…","url":"https://www.modernpowersystems.com/news/bhel-wins-major-gas-turbine-order-for-nigerias-dangote-refinery/","summary":"News BHEL wins major gas turbine order for Nigeria& ;s Dangote Refinery BHEL will supply and support commissioning of eight gas turbine generator packages, marking its largest gas turbine package contract by quantity and value. July 30, 2026 Share Copy Link Share on X Share on Linkedin Share on Facebook (Image credit: BHEL via LinkedIn) Bharat Heavy Electricals Limited (BHEL) has secured an order to supply and supervise the erection and commissioning of eight gas turbine generator packages for the Dangote Petroleum Refinery and Petrochemicals Free Zone Enterprise in Nigeria. The order was awarded following an international competitive bidding process, with equipment production to be carried out at BHEL’s manufacturing facilities in Hyderabad and Bengaluru. The contract has been placed by Dangote Petroleum Refinery and Petrochemicals Free Zone Enterprise, part of the Dangote Group, one of Africa’s largest industrial conglomerates with operations spanning refining, petrochemicals, fertilisers, cement and other sectors. BHEL will manufacture and supply the eight gas turbine generator packages and provide supervision during installation and commissioning at the Nigerian site. The order strengthens BHEL’s position in the global power equipment market and represents the company’s largest single contract for gas turbine generator packages on a supply-and-supervision basis, both by quantity and value. The project adds to BHEL’s growing international footprint, particularly in Africa, where the Indian engineering company has delivered power sector projects in countries including Egypt, Ethiopia, Libya, Rwanda, Senegal and Sudan. The Nigerian award also builds on BHEL’s previous work in the country, including the supply and supervision of erection and commissioning for a 26 MW gas turbine generator package for the Government of Cross River State. BHEL said the latest contract demonstrates the competitiveness of its gas turbine technology in a market where suppliers face strong international competition. The company has manufactured gas turbines for more than four decades and has supplied nearly 250 units to customers in India and overseas. More than 20% of those deliveries have been exported, highlighting its experience in international power generation projects. The Dangote order comes as Nigeria continues to expand industrial infrastructure and strengthen domestic energy capacity. The eight gas turbine generator packages will support the operations of one of Africa’s largest refinery and petrochemical developments, adding further generation capability to a strategically important industrial site. --> Sign up for our weekly news round-up! Give your business an edge with our leading industry insights. Sign up Share Copy Link Share on X Share on Linkedin Share on Facebook Partner Content Hexagon NEM Energy Promecon Rentech Boiler Systems More Relevant News Hitachi Energy, L& ;T secure new grid deals with TenneT News Nadara finalises $1.36bn refinanci","publishedText":"2026-07-30T12:11:28.000Z","sourceName":"Modern Power Systems"},{"title":"Powering the New Energy Reality","url":"https://gasturbineworld.com/powering-the-new-energy-reality/","summary":"MEGAWATT 2026 brings together the professionals, technologies and strategies shaping the future of power generation and energy security. The post Powering the New Energy Reality appeared first on Gas Turbine World .","publishedText":"Sat, 18 Jul 2026 16:20:16 +0000","sourceName":"Gas Turbine World"},{"title":"New Synergy Turbine Expo Gives Thermal Power its Own Forum","url":"https://gasturbineworld.com/new-synergy-turbine-expo-gives-thermal-power-its-own-forum/","summary":"Thermal power is once again moving to the forefront of the energy conversation. The post New Synergy Turbine Expo Gives Thermal Power its Own Forum appeared first on Gas Turbine World .","publishedText":"Sat 220千伏潭连输变电工程正式投产 浙江电力新规：中长期限价 绿电不限 四川这座“超级充电宝”正式上线 山西：特高压北岳站累计外送电量突破2000亿千瓦时 福建厦门220千伏同集变电站建成投运 山西补充修订电力辅助服务与并网运行细则 相关链接 中国政府网 国家发改委 国家能源局 国家电网 南方电网 华能集团 大唐集团 华电集团 国电集团 国家电投 中国电建 中国能建 中核集团 中国石油 中国石化 中国海油 中国三峡 神华集团 国家开投 华润集团 中煤集团 中国广核 人民网 新华网 央视网 新浪 搜狐 消费日报 英大网 四川能投 国 &nbsp&nbsp&nbsp&nbsp家 &nbsp&nbsp&nbsp能&nbsp&nbsp&nbsp&nbsp 源&nbsp&nbsp&nbsp&nbsp 局&nbsp&nbsp&nbsp 主&nbsp&nbsp&nbsp&nbsp 管 中 &nbsp国 &nbsp能&nbsp 源&nbsp 传 &nbsp媒 &nbsp集&nbsp 团&nbsp 主&nbsp 办 无障碍阅读 | 意见建议 | 广告服务 | | 版权声明 | 我们的服务 | 联系我们 Copyright:copyright: 2001- 中国能源新闻网 版权所有 本网站所刊登的《中国电力报》、《中国能源观察》上的新闻，版权归中国能源传媒集团有限公司所有。未经授权，禁止下载使用。 国务院新闻办公室批准中国能源新闻网登载新闻业务的函：国新办发函[2000]232号。 京ICP备15017366号-1 《中华人民共和国电信与信息服务业务经营许可证》 编号：京ICP证090268号 京公网安备 11010202010453号 违法和不良信息举报电话：010-63414947 中华人民共和国互联网新闻信息服务许可证 编号：10120170021 互联网举报中心 广告直拨：赵飞 13511058150","publishedText":"2026-07-28T16:00:00.000Z","sourceName":"中国电力新闻网 (CPNN)"},{"title":"24.2%！上半年电力市场交易跑出“加速度”","url":"https://www.cpnn.com.cn/news/dianli2023/202607/t20260730_1905533.html","summary":"国家能源局主管 中国能源传媒集团 中电传媒股份有限公司主办 投稿 登录 X 能源中国IOS版 能源中国安卓版 陇上孟河 X 首页 电力 新能源 油气 煤炭 企业 地方 科技 国际 人事 观点 观察 您的位置 > 首页 -> 电力 24.2%！上半年电力市场交易跑出“加速度” 来源： 中国能源新闻网 时间： 2026-07-30 16:28 中国能源新闻网讯（记者 冯聪聪）7月27日，国家能源局发布2026年上半年全国电力市场交易数据。上半年，全国累计完成电力市场交易电量36848亿千瓦时，同比增长24.2%。这一增速较2025年同期的4.8%大幅提升，延续了“十四五”以来电力市场化改革的强劲势头，表明电力市场化交易已步入加速扩容的新阶段。 从交易范围看 ，省内市场仍是绝对主力 。 上半年省内交易电量29135亿千瓦时，同比增长27.9%，这与2025年同期形成鲜明对比——彼时省内交易电量同比持平。 电力规划设计总院能源政策与市场研究院院长凡鹏飞认为，省内电力交易规模快速增长，主要得益于新能源全面入市以及数字经济带动负荷增长。2026年，各地逐步完善电力市场规则，持续推动新能源上网电量全部进入电力市场；AI算力中心、数据中心、充换电产业用电大幅增长，2026年1-6月，全国充换电服务业、互联网数据服务用电量分别为810亿、494亿千瓦时，增速分别达到56.9%、44.0%，大量算力企业优先选择本省风光发电锁定用电成本。 从交易品种看 ， 现货交易电量持续扩大 。上半年 中长期交易电量32568亿千瓦时，占总交易电量的88.4%，仍是电力市场交易的“压舱石”。 现货交易电量4280亿千瓦时，较去年1-8月的1657亿千瓦时实现大幅跃升。作为反映实时供需、优化资源配置的关键机制，现货交易规模的持续扩大标志着电力市场正从以年度、月度为主的中长期交易模式，向“中长期+现货”协同运行的新阶段迈进。 在绿电交易方面，上半年绿电交易电量1641亿千瓦时，同比增长6.6%。值得关注的是，6月单月绿电交易电量为275亿千瓦时，同比增长15%，单月增速高于累计增速，显示绿电交易正在加速升温。在“双碳”目标持续引领下，以市场化机制推动绿色电力消费的潜力仍有待进一步释放。 当前，电力市场化交易电量占全社会用电量比重持续保持在60%以上。上半年数据表明，电力市场化改革已从“扩面”迈入“深化运营”新阶段，改革红利正在加速释放，为能源转型和经济社会高质量发展提供了坚实的市场化支撑。 “今年上半年，全国统一电力市场建设亮点纷呈，省间电力现货交易规则修订完善，传统电源可以发挥调节能力在省间现货市场购电进而减少出力，为新能源大范围消纳腾挪更多空间，省间中长期市场实现按自然日连续开市，首笔输电权市场化交易成功落地，小时级绿电交易在多个省份取得成功实践。全国统一电力市场体系正由初步建成向基本建成阔步迈进，适应新型能源体系的市场和价格机制加快健全，更好助力实现电力资源在更大范围、更高效率的优化配置。”凡鹏飞说。 责任编辑：刘础琪 中电专题 学习贯彻四中全会精神 “十四五”能源高质量发展 热点推荐 全球电力需求加速增长 占比近九成！青海电力现货市场6月新能源唱主角 广东8月中长期交易综合价0.415元/千瓦时 福建抽水蓄能电量全部进入市场 “疆电入渝”工程累计外送电量突破300亿千瓦时 海口220千伏潭连输变电工程正式投产 浙江电力新规：中长期限价 绿电不限 四川这座“超级充电宝”正式上线 相关链接 中国政府网 国家发改委 国家能源局 国家电网 南方电网 华能集团 大唐集团 华电集团 国电集团 国家电投 中国电建 中国能建 中核集团 中国石油 中国石化 中国海油 中国三峡 神华集团 国家开投 华润集团 中煤集团 中国广核 人民网 新华网 央视网 新浪 搜狐 消费日报 英大网 四川能投 国 &nbsp&nbsp&nbsp&nbsp家 &nbsp&nbsp&nbsp能&nbsp&nbsp&nbsp&nbsp 源&nbsp&nbsp&nbsp&nbsp 局&nbsp&nbsp&nbsp 主&nbsp&nbsp&nbsp&nbsp 管 中 &nbsp国 &nbsp能&nbsp 源&nbsp 传 &nbsp媒 &nbsp集&nbsp 团&nbsp 主&nbsp 办 无障碍阅读 | 意见建议 | 广告服务 | | 版权声明 | 我们的服务 | 联系我们 Copyright:copyright: 2001- 中国能源新闻网 版权所有 本网站所刊登的《中国电力报》、《中国能源观察》上的新闻，版权归中国能源传媒集团有限公司所有。未经授权，禁止下载使用。 国务院新闻办公室批准中国能源新闻网登载新闻业务的函：国新办发函[2000]232号。 京ICP备15017366号-1 《中华人民共和国电信与信息服务业务经营许可证》 编号：京ICP证090268号 京公网安备 11010202010453号 违法和不良信息举报电话：010-63414947 中华人民共和国互联网新闻信息服务许可证 编号：10120170021 互联网举报中心 广告直拨：赵飞 13511058150","publishedText":"2026-07-29T16:00:00.000Z","sourceName":"中国电力新闻网 (CPNN)"},{"title":"Olectra Deploys 4,000 Electric Buses Across India, Marking E…","url":"https://www.energetica-india.net/news/olectra-deploys-4000-electric-buses-across-india-marking-e-mobility-milestone","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition May-June 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Other Energy Applications &rsaquo;Olectra Deploys 4,000 Electric Buses Across India, Marking E-Mobility Milestone Olectra Deploys 4,000 Electric Buses Across India, Marking E-Mobility Milestone Olectra Greentech became the first electric bus manufacturer in India to deploy 4,000 electric buses nationwide. The company delivered the e-bus to the Government of Himachal Pradesh during the induction of 297 electric buses into the HRTC fleet. July 31, 2026. By News Bureau Olectra Greentech, an electric mobility company, has deployed 4,000 electric buses on Indian roads. This achievement marks a moment in the country&rsquo;s electric mobility journey and accelerates Olectra&rsquo;s role in India&rsquo;s transition towards sustainable public transportation. The milestone was commemorated with the handover of Olectra&rsquo;s 4,000th electric bus to the Chief Minister of Himachal Pradesh Sukhvinder Singh Sukhu and Mukesh Agnihotri, Deputy Chief Minister of Himachal Pradesh during the flag off ceremony of 297 Olectra electric buses inducted into the Himachal Road Transport Corporation (HRTC) fleet. The event was attended by the Chief Minister of Himachal Pradesh, senior officials from the Government of Himachal Pradesh, HRTC and Olectra Greentech officials. With 4,000 electric buses deployed across the country, Olectra has established itself as India&rsquo;s electric bus manufacturer. Its buses operate across multiple states and cities, safely transporting millions of passengers while delivering reliable performance, lower operating costs and significant environmental benefits. This achievement reflects Olectra&rsquo;s unwavering commitment to advancing electric mobility through innovation, quality and execution excellence. Collectively, Olectra&rsquo;s fleet of 4,000 electric buses has clocked over 730 million green kilometres, preventing more than 6.5 lakh tonnes of CO₂ emissions and making a meaningful contribution towards cleaner air and a more sustainable future. This achievement is not just a company milestone but also a significant step forward in India&rsquo;s journey towards green and sustainable mobility. Mahesh Babu, Managing Director, Olectra Greentech, said, &ldquo;Today marks one of the proudest moments in Olectra&rsquo;s journey. Becoming the first company in India to deploy 4,000 electric buses on Indian roads is not just an Olectra milestone, it is a defining milestone for India&rsquo;s electric mobility industry. It reflects the growing confidence that public transport undertakings across the country have placed in electric mobility and reinforces our commitment to building a cleaner and more sustainable future.&rdquo; He further added, &ldquo;We are honoured that this landmark 4,000th","publishedText":"2026-07-31T03:17:02.000Z","sourceName":"Energetica India"},{"title":"BluPine Energy Signs Multiple Renewable PPAs in Rajasthan, T…","url":"https://www.energetica-india.net/news/blupine-energy-signs-multiple-renewable-ppas-in-rajasthan-targets-150-mw-ci-portfolio","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition May-June 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Business &rsaquo;BluPine Energy Signs Multiple Renewable PPAs in Rajasthan, Targets 150 MW C&amp;I Portfolio BluPine Energy Signs Multiple Renewable PPAs in Rajasthan, Targets 150 MW C&amp;I Portfolio BluPine Energy has signed renewable power purchase agreements with KEI Industries, Craftsman Automation and Sunbeam Lightweighting Solutions, while targeting a 150 MW commercial and industrial renewable energy portfolio in Rajasthan. July 31, 2026. By EI News Network BluPine Energy has expanded its commercial and industrial (C&amp;I) renewable energy portfolio in Rajasthan by signing long term power purchase agreements (PPAs) with KEI Industries Ltd., Craftsman Automation Ltd.&nbsp;&nbsp;and Sunbeam Lightweighting Solutions Pvt. Ltd. The agreements are aimed at supplying renewable power to the companies through customised captive and open access solutions, further strengthening BluPine Energy& ;s presence in one of India& ;s key industrial and renewable energy markets.The company said that construction activities for all three projects have commenced, with commissioning expected in line with the respective project timelines. The projects will enable the partner companies to source a significant share of their electricity requirements from renewable energy, helping reduce carbon emissions while providing long term energy cost stability and improved energy security. BluPine Energy is also in advanced discussions to execute PPAs for an additional 60 to 70 MW of commercial and industrial renewable energy capacity in Rajasthan. These agreements, expected to be announced in the coming months, will support the company& ;s target of building a 150 MW C&amp;I portfolio in the state. As per the firm, it already has a significant renewable energy footprint in Rajasthan, with nearly 1 GW of installed solar capacity and 300 MWh of battery energy storage system (BESS) capacity. It further&nbsp;said that Rajasthan remains a strategic market due to its strong renewable energy resources, supportive policy framework and growing industrial demand for clean electricity. Commenting on the development, Rahul Mishra, President, Commercial and Industrial, BluPine Energy, said that the agreements mark an important milestone in the company& ;s expansion in Rajasthan. He noted that industries are increasingly seeking reliable, cost effective and sustainable energy solutions to meet their decarbonisation goals, and added that BluPine Energy expects to build a 150 MW C&amp;I portfolio in the state through a healthy pipeline of projects currently under finalisation. BluPine Energy& ;s commercial and industrial business serves customers across manufacturing, automotive, engineering, electrical equipment, consumer go","publishedText":"2026-07-31T09:04:55.000Z","sourceName":"Energetica India"},{"title":"PM Surya Ghar Scheme Helps Nearly 19 Lakh Households Achieve…","url":"https://www.energetica-india.net/news/pm-surya-ghar-scheme-helps-nearly-19-lakh-households-achieve-zero-electricity-bills","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition May-June 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Policies &amp; Regulations &rsaquo;PM Surya Ghar Scheme Helps Nearly 19 Lakh Households Achieve Zero Electricity Bills PM Surya Ghar Scheme Helps Nearly 19 Lakh Households Achieve Zero Electricity Bills Nearly 18.94 lakh households reported zero electricity bills after installing rooftop solar under PM Surya Ghar, with 40.07 lakh systems installed nationwide. July 29, 2026. By EI News Network Nearly 18.94 lakh households across India have reported receiving zero electricity bills after installing rooftop solar systems under the PM Surya Ghar: Muft Bijli Yojana, the government informed Parliament. According to a written reply by the Ministry of New and Renewable Energy in the Lok Sabha, the zero electricity bills were reported by distribution companies and depend on consumers&rsquo; electricity self-consumption during a billing cycle. Maharashtra recorded the highest number of beneficiaries, with 4,17,707 consumers reporting zero electricity bills. Gujarat followed with more than 4.16 lakh beneficiaries across its distribution companies, while Kerala reported 1,91,882, Uttar Pradesh over 1.75 lakh, Rajasthan more than 1.68 lakh and Madhya Pradesh over 1.10 lakh. Odisha reported around 37,678 such beneficiaries, while Chhattisgarh had 16,472. As of July 24, 2026, the scheme had resulted in the installation of 40,07,355 rooftop solar systems, benefiting 48,21,986 households across the country. More than 35.97 lakh of the installed systems were above 3 kWp, accounting for the largest share of installations. The government said that implementation of the scheme has also accelerated significantly. While it initially took several months to complete rooftop solar installations for the first one lakh households, the same number of installations is now being achieved in around seven days. To meet its target of installing rooftop solar systems in one crore households by FY2026-27, the ministry has introduced measures including waiving technical feasibility requirements in certain cases, enabling automatic load enhancement of up to 10 kW, integrating net metering agreements into the National Portal, facilitating collateral free concessional loans, expanding vendor registration and strengthening coordination with state distribution companies. The ministry said that regular monitoring, regional review meetings, awareness campaigns and a dedicated grievance redressal mechanism are also being used to accelerate implementation of the scheme nationwide. Tags: Policies &amp; Regulations PM Suryodaya Yojana PM Surya Ghar Yojana benefits PM Surya Ghar Yojana PM Surya Ghar Scheme PM Surya Ghar Scheme Zero Electricity Bills Zero electricity bills Households Zero Electricity Bills Please share! --> --> --> --> --> -","publishedText":"2026-07-29T11:43:47.000Z","sourceName":"Energetica India"},{"title":"Mecpower Solutions Signs MoU with Gujarat to Set Up 5 GWh Ba…","url":"https://www.energetica-india.net/news/mecpower-solutions-signs-mou-with-gujarat-to-set-up-5-gwh-battery-storage-facility","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition May-June 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Business &rsaquo;Mecpower Solutions Signs MoU with Gujarat to Set Up 5 GWh Battery Storage Facility Mecpower Solutions Signs MoU with Gujarat to Set Up 5 GWh Battery Storage Facility Mecpower Solutions has partnered with the Government of Gujarat to establish a proposed 5 GWh Battery Energy Storage System assembly facility at Karjan, supporting India& ;s renewable energy infrastructure and grid resilience through advanced energy storage manufacturing. July 30, 2026. By News Bureau Mecpower Solutions, a solar infrastructure and clean energy solution company, has signed a Memorandum of Understanding (MoU) with the Government of Gujarat to set up a proposed 5 GWh Battery Energy Storage System (BESS) Assembly Facility at Karjan, with an investment of approximately INR 160 crore.&nbsp; The MoU marks a milestone in Mecpower& ;s growth journey and reinforces its commitment to supporting India& ;s clean energy transition through investments in advanced manufacturing and energy storage infrastructure. The proposed facility is expected to contribute to the development of a domestic ecosystem for battery energy storage solutions, which are increasingly being recognised as critical to integrating renewable energy, improving grid resilience and ensuring reliable power availability. As India advances toward its clean energy and energy security goals, energy storage systems are expected to play a pivotal role in enabling the large-scale deployment of renewable energy while addressing the challenges of intermittency and grid stability. The proposed facility will strengthen domestic manufacturing capabilities in this strategically important sector and support the nation& ;s broader vision of fostering self-reliance in next-generation energy technologies. Commenting on the development, Setul Shah, Managing Director, Mecpower Solutions, said, &quot;The signing of this MoU with the Government of Gujarat represents an important step in Mecpower& ;s journey towards becoming a future-ready energy infrastructure company. Our proposed investment in a 5 GWh Battery Energy Storage System assembly facility reflects our confidence in India& ;s clean energy growth story and our commitment to strengthening domestic manufacturing capabilities. Energy storage will play an increasingly critical role in enabling renewable energy adoption, enhancing grid resilience and supporting long-term energy security. We are pleased to partner with the Government of Gujarat in advancing these shared objectives.&quot; The project reflects Mecpower& ;s long-term strategic focus on building future-ready energy infrastructure and expanding its presence across the evolving clean energy value chain. By investing in advanced energy","publishedText":"2026-07-30T02:55:07.000Z","sourceName":"Energetica India"},{"title":"Energy &amp; Environment Thursday, 30 July 2026--> Danube's …","url":"https://www.world-nuclear-news.org/articles/danubes-record-low-leads-to-hungary-romania-nuclear-shutdowns","summary":"HOME / ENERGY &amp; ENVIRONMENT Danube's record low leads to Hungary, Romania nuclear shutdowns Thursday, 30 July 2026 The operator of the Paks nuclear power plant in Hungary has announced it will have to be fully shut down within the next 72 hours because of record-low water levels in the River Danube. Romania& ;s Cernavoda has also shut down one of its two units. &nbsp; The Paks plant is built near the banks of the River Danube (Image: MVM) According to Magyar Villamos Művek (MVM), the Hungarian operator, the water level in the Danube is now 28 centimetres below the previous record, set in 2018, which was itself one metre below the 100-year minimum water level used in the design of&nbsp;Paks nuclear power plant, which opened in the early 1980s. It has already been reducing the total plant& ;s output and stressed that there was no safety issue, but said that &quot;although the current extremely low water level and water flow rate would allow sufficient water to cool the units, the suction level of the pumps required for this is higher than the current low - and expected to continue to decrease - water level, so they cannot perform their task&quot;. &quot;Of course, the nuclear power plant is prepared for extraordinary situations, including those with a low probability of occurrence. We have developed procedures for dealing with the so-called low water situation of the Danube. Low water conditions are divided into 4 stages based on the levels measured at the water intake &hellip; we are currently in stage 3.&nbsp; &quot;According to forecasts, there is a realistic chance of a level 4 event: at this point, all units of the nuclear power plant will have to be shut down, energy production will cease from then on, and the units will have to be cooled. This requires 5 cubic metres of water per minute, compared with 100 cubic metres per second for the operating units. &quot;We can currently give an estimate for the complete shutdown - due to water forecasts that change several times a day: according to our calculations, the time frame within which we must implement the shutdown is 24-72 hours.&quot; MVM added that it has pumps on standby and in reserve if required and the plant &quot;is prepared to handle the extraordinary situation of a complete shutdown: we keep the units in a safe condition even in the event of extremely low water levels lasting for weeks, and when the appropriate water level is reached, we immediately start the production of the units in stages, based on the strict rules. Depending on the water level, the units can be restarted in a few days&quot;. It says&nbsp;the record-low water level in the Danube is a combination of climate change - &quot;In previous years, there were so-called high waters several times a year - this year, the water level has been low all year round&quot;&nbsp;- and deepening of the river bed. It also outlined&nbsp;measures being taken to tackle such situations in the future - with preparatory work to lowe","publishedText":"2026-07-30T07:09:55.000Z","sourceName":"World Nuclear News"},{"title":"New Nuclear Friday, 31 July 2026--> Site preparations under …","url":"https://www.world-nuclear-news.org/articles/site-preparations-under-way-for-planned-kola-units","summary":"HOME / NEW NUCLEAR Site preparations under way for planned Kola units Friday, 31 July 2026 The start of site preparation works for the Kola II nuclear power units follows the granting of a site licence by Russian regulator Rostekhnadzor earlier this month. &nbsp; (Image: Rosatom) A ceremony to mark the beginning of the works was held on Wednesday, attended by the Governor of Murmansk Andrey Chibis, the management of the Kola plant, and representatives from the general contractor, JSC Titan-2. Work to prepare a site of a future nuclear power plant does not count as the official start of construction for a nuclear unit, which will follow later. The preparatory work will involve survey work, design and preparation of a construction base and ensuring there are access roads and facilities for the future workforce. The main construction phase will begin after the design is completed, expert reviews have been completed, and the construction licence received from Rostekhnadzor. Chibis said: &quot;This is a significant day and a monumental project - not just for a decade, but for the next century. The world& ;s first nuclear power plant with innovative medium-capacity units will be built in Polyarnye Zori. The construction of Kola NPP-2 will open up opportunities for new industrial projects and will drive the socioeconomic development of Russia& ;s entire Arctic zone. Implementing such a large-scale project will create over 5,000 new jobs during the construction phase and will require hundreds of highly qualified specialists during operation. For the Murmansk Region, the commissioning of Kola NPP-2 means a guaranteed and uninterrupted power supply to industrial enterprises and social infrastructure. In the future, the new power units will help maintain the region& ;s energy balance after the decommissioning of existing facilities.&quot; Vasily Omelchuk, Director of the Kola NPP, said the new plant was a &quot;logical continuation of the development of nuclear energy on the Kola Peninsula. We& ;re not starting from scratch: our team has many years of experience operating an existing plant, well-established processes, and a high level of professionalism. The personnel issue has also been thoroughly considered: we will train young specialists and, as the existing units are decommissioned, transfer our employees to new capacities&quot;. Rosatom says that the plan is for the four new units at Kola II&nbsp;to be of the VVER-S design, a 600 MWe water-cooled reactor under development, with the first two to be built between 2027 and 2037. Rosatom says that, if the proposed VVER-S reactors can use a full load of MOX (mixed oxide) fuel, it will cut its use of natural uranium by 50%. The new units are intended to replace the existing four Kola units as they come to the end of their operating lives. They are VVER-440 reactors; 1 and 2 are V-230 models and 3 and 4 are of the V-213 type. They have a capacity of 411 MWe and were all connected to the grid between","publishedText":"2026-07-31T01:27:55.000Z","sourceName":"World Nuclear News"},{"title":"Clarke Energy secures 4 MW trigeneration project in Côte d’I…","url":"https://www.modernpowersystems.com/news/clarke-energy-secures-4-mw-trigeneration-project-in-cote-divoire/","summary":"News Clarke Energy secures 4 MW trigeneration project in Côte d’Ivoire The project will use INNIO Jenbacher engines to produce power, 130°C process heat and chilled water from one fuel source. July 29, 2026 Share Copy Link Share on X Share on Linkedin Share on Facebook (Photo credit: Clarke Energy) Clarke Energy, a Rehlko company, has secured a contract to deliver a 4 MW natural gas-fuelled trigeneration power plant for pasta manufacturer Capraci’s production facility in Abidjan, Côte d’Ivoire. The project has now moved into delivery following the contract award, as Capraci continues plans to upgrade its industrial energy infrastructure. Clarke Energy will engineer and deliver the plant, using INNIO’s Jenbacher gas engine technology. The company, an authorised distributor of Jenbacher engines, will also provide long-term operation and maintenance support under a service agreement. The investment is designed to improve energy reliability, reduce operating costs and strengthen the environmental performance of one of Côte d’Ivoire’s major pasta producers. The trigeneration system will produce electricity, heat and cooling from a single fuel source, helping the facility make better use of its energy input. The plant will use a high-efficiency exhaust heat recovery system to generate 130°C superheated water for pasta processing, while an absorption chiller will provide 11°C chilled water for on-site cooling. By combining these processes, Capraci aims to reduce energy losses and improve production efficiency. Jacques Soulayrac, Managing Director France &amp; Africa at Clarke Energy, said the project reflects the company’s wider approach to supporting industrial growth across the continent. “This project perfectly embodies our mission: supporting African industries with high-performance, reliable and sustainable energy solutions,” he said. “We are not simply delivering a power plant; we are providing a long-term competitiveness lever.” The Jenbacher engines selected for the project are designed for demanding industrial applications, where high availability and consistent operation are critical. Clarke Energy said the technology will help Capraci maintain a stable energy supply as its production operations expand. The company will remain involved beyond construction through ongoing technical support and maintenance. Soulayrac added: “This partnership is part of a long-term vision. Our objective is to ensure operational reliability and long-term peace of mind for Capraci.” The project comes as manufacturers across West Africa increasingly explore on-site generation solutions to address grid reliability challenges and improve energy efficiency. For Capraci, the installation represents a move towards a more resilient production model while supporting Côte d’Ivoire’s wider industrial development ambitions. --> Sign up for our weekly news round-up! Give your business an edge with our leading industry insights. Sign up Share Copy Link Share on X Share on Linke","publishedText":"2026-07-29T12:12:04.000Z","sourceName":"Modern Power Systems"},{"title":"Hitachi Energy, L&#038;T secure new grid deals with TenneT","url":"https://www.modernpowersystems.com/news/hitachi-energy-lt-secure-new-grid-deals-with-tennet/","summary":"News Hitachi Energy, L& ;T secure new grid deals with TenneT The new HVDC links will transmit North Sea wind energy to Dutch and German grids. July 30, 2026 Share Copy Link Share on X Share on Linkedin Share on Facebook The projects will use Hitachi Energy’s HVDC Light technology for power conversion and transmission. Credit: ©Hitachi Energy Ltd. Hitachi Energy and Larsen &amp; Toubro (L&amp;T) have been awarded contracts by TenneT to deliver two new high-voltage direct current (HVDC) grid connections, Nederwiek3 in the Netherlands and LanWin5 in Germany. The projects, announced under the companies& ; multi-year framework agreement, are set to supply a combined 4 GW of renewable electricity generated in the North Sea to onshore grids in both countries. The announcement expands upon Hitachi Energy and L&amp;T’s ongoing work with TenneT, which also includes the IJmuiden Ver Alpha and Nederwiek1 projects. Nederwiek3 will connect to a converter station in Geertruidenberg in the Dutch province of South Netherlands, while LanWin5 is set to deliver power to Lower Saxony, Germany. The projects form part of TenneT’s wider 2 GW programme, which aims to strengthen the European electricity grid as demand for low-carbon electricity increases in industry, transport and digital sectors. The two HVDC links are designed to integrate offshore wind energy into national grids, supporting Europe’s transition to clean power. Both links will operate at 2 GW each, using Hitachi Energy’s HVDC Light technology for power conversion and transmission. L&amp;T will be responsible for the engineering, procurement, construction and installation of offshore converter platforms and infrastructure. Hitachi Energy Grid Integration Business Unit CEO Niklas Persson said: “As a pioneering technology and market leader, we are delighted to deliver our HVDC technology for Nederwiek3 and LanWin5, combining world-class energy and digital systems. “Our strong collaboration with L&amp;T, built on an agile business model, scalable solutions and synergies among projects, enables us to support TenneT in accelerating offshore wind deployment in the North Sea and Europe’s ambition to become the world’s first climate-neutral continent.” The projects also align with future plans to connect the Dutch grid to the UK via the proposed LionLink interconnector, which could lead to the development of multi-terminal transmission hubs. Hitachi Energy and L&amp;T indicated that these ongoing collaborative efforts reflect growing economic links between Europe and India. Last month, Hitachi Energy began work on expanding its South Boston campus in Virginia, US, with construction now under way on a new facility aimed at manufacturing large power transformers. --> Sign up for our weekly news round-up! Give your business an edge with our leading industry insights. Sign up Share Copy Link Share on X Share on Linkedin Share on Facebook Partner Content Hexagon NEM Energy Promecon Rentech Boiler Systems More R","publishedText":"2026-07-30T15:28:44.000Z","sourceName":"Modern Power Systems"}]},{"label":"燃气轮机·权威","items":[{"title":"Find Content","url":"https://www.asme.org/topics-resources/content","summary":"Topics &amp; Resources Content Find Content Explore the latest trends in mechanical engineering, including such categories as Biomedical Engineering, Energy, Technology and Society, Robotics, Materials, Student Support, Business and Career Support and Advanced Manufacturing. Filters: Sort and Filter Close Topic Clear Selection {{result.Value}} = Math.ceil(filters.KeyValueTopics.length / 3) && idx {{result.Value}} = Math.ceil(filters.KeyValueTopics.

-1-1-gigawatt-gas-engine-order-for-major-data-center-campus/","summary":"Link 1 gigawatt equipment order represents one of the largest orders in INNIO’s history; Equipment Order Intake booked in the second quarter of 2026. More than 200 INNIO Jenbacher J624 engines are expected to provide behind-the-meter prime power. MUNICH, Germany, (July 28, 2026) – INNIO N.V. (Nasdaq: INIO) today announced a landmark order to […]","publishedText":"Tue, 28 Jul 2026 10:50:53 +0000","sourceName":"INNIO (Jenbacher/Waukesha)"},{"title":"Second Quarter 2026 Financial Results","url":"https://www.innio.com/en/news-media/press-releases/second-quarter-2026-financial-results/","summary":"/ Media Download","publishedText":"Tue, 28 Jul 2026 10:52:04 +0000","sourceName":"INNIO (Jenbacher/Waukesha)"},{"title":"PR_INNIO_Awarded EcoVadis Platinum Medal","url":"https://www.innio.com/en/news-media/media-center/others/pr_innio_awarded-ecovadis-platinum-medal/","summary":"PR_INNIO_Awarded EcoVadis Platinum Medal","publishedText":"Thu, 30 Jul 2026 11:03:51 +0000","sourceName":"INNIO (Jenbacher/Waukesha)"},{"title":"INNIO_ EcoVadis Platinum Medal_2026","url":"https://www.innio.com/en/news-media/media-center/images/innio_-ecovadis-platinum-medal_2026/","summary":"INNIO_ EcoVadis Platinum Medal_2026","publishedText":"Thu, 30 Jul 2026 12:02:28 +0000","sourceName":"INNIO (Jenbacher/Waukesha)"}]},{"label":"产业链","items":[{"title":"PM Surya Ghar 2.0 May Pair Capital Support with Generation-L…","url":"https://www.energetica-india.net/news/pm-surya-ghar-2-0-may-pair-capital-support-with-generation-linked-incentives","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition May-June 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Policies &amp; Regulations &rsaquo;PM Surya Ghar 2.0 May Pair Capital Support with Generation-Linked Incentives PM Surya Ghar 2.0 May Pair Capital Support with Generation-Linked Incentives The Ministry of New and Renewable Energy (MNRE) is considering a performance-linked revamp of the PM Surya Ghar: Muft Bijli Yojana that could tie financial assistance to electricity generation, battery storage and long-term system performance under PM Surya Ghar 2.0. July 28, 2026. By Mrinmoy Dey The next phase of the PM Surya Ghar: Muft Bijli Yojana is likely to move beyond installation-based subsidies and adopt a performance-oriented framework that rewards actual electricity generation, battery storage, lifecycle maintenance and grid-support services, as the government explores ways to strengthen India& ;s flagship residential rooftop solar programme. &nbsp; As part of this exercise, the Ministry of New and Renewable Energy (MNRE) held a brainstorming session on July 23 to chart the future roadmap of PM Surya Ghar 2.0. The meeting was chaired by J.V.N. Subramanyam, Joint Secretary, MNRE, and attended by Ashish Khanna, Director General of the International Solar Alliance (ISA), along with representatives from think tanks, rooftop solar developers, DISCOMs and other stakeholders. &nbsp; The session focused on identifying measures to strengthen the implementation of the scheme and accelerate rooftop solar adoption across the country. The ministry has stated that a deliberation document capturing the key ideas and policy recommendations discussed during the meeting will be prepared over the next 30 days and will form the basis for future policy consultations. &nbsp; The government is examining a redesign of the scheme under which financial assistance could be linked to long-term system performance. A two-part support mechanism is being considered, with one component providing upfront capital assistance and another linked to electricity generation, operation and maintenance, battery storage and service delivery over the asset& ;s operational life. &nbsp; The proposals under discussion also include the introduction of generation guarantees, AI-based quality assessment of rooftop solar installations and differentiated financial assistance based on household income, geographical location, consumer category and the value provided by rooftop solar systems to the electricity grid. &nbsp; Battery energy storage is expected to play a central role in PM Surya Ghar 2.0 as increasing rooftop solar capacity creates new grid management challenges. The government is evaluating both behind-the-meter residential battery systems and distribution network-level storage to improve grid flexibility, absorb surplus daytime gene","publishedText":"2026-07-28T02:54:00.000Z","sourceName":"Energetica India"},{"title":"Udaipur to Host Its First Major Solar Event &ndash; REconnec…","url":"https://www.energetica-india.net/news/udaipur-to-host-its-first-major-solar-event-reconnect-summit-rajasthan-on-july-30","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition May-June 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Business &rsaquo;Udaipur to Host Its First Major Solar Event &ndash; REconnect Summit Rajasthan on July 30 Udaipur to Host Its First Major Solar Event &ndash; REconnect Summit Rajasthan on July 30 Energetica India will host the second edition of the REconnect Summit Rajasthan in Udaipur on July 30, 2026, bringing together policymakers and industry leaders to discuss solar manufacturing, energy storage, and Rajasthan& ;s renewable energy roadmap. July 28, 2026. By Mrinmoy Dey Udaipur is gearing up to host its biggest solar event. The Second Edition of REconnect Summit Rajasthan will be held on July 30, 2026, at the Radisson Blu Palace Resort and Spa, Udaipur, Rajasthan. &nbsp; Under the theme of &lsquo;Driving Rajasthan&rsquo;s Renewable Energy Leadership through Solar Manufacturing and Energy Storage&rsquo;, the REconnect Summit Udaipur will place the state&rsquo;s clean energy momentum squarely in the spotlight, bringing together a powerful mix of stakeholders from solar energy EPCs (C&amp;I and residential), solar PV component manufacturers, and the energy storage ecosystem. &nbsp; Designed as a full-day forum that convenes influential leaders, experts, and innovators to discuss pathways for Rajasthan&rsquo;s renewable energy transition strategy as it works toward its target of achieving 125 GW of RE capacity by 2030 and developing the state as a hub for renewable energy equipment manufacturing. &nbsp; As India accelerates residential rooftop solar adoption under the PM Surya Ghar: Muft Bijli Yojana, Udaipur is emerging as a key solar destination following its inclusion in the MNRE& ;s City Accelerator Program. Backed by subsidies of up to INR 95,000 for a 3 kW rooftop system, favourable net-metering provisions, and over 290 sunny days annually, the city is well-positioned for rapid rooftop solar growth. &nbsp; The choice of Udaipur as the host city reflects its growing potential as a renewable energy hub and Energetica India& ;s commitment to expanding industry engagement beyond Jaipur, which has traditionally hosted most renewable energy events. &nbsp; The summit has garnered support from prominent industry players, including Adani Solar, Deye New Energy, Feston S.E.V. Technologies, Usha Shriram Solar, Gautam Solar, Joint Solar, Zuvay Technologies, Hoymiles, Tata Power Solaroof, Cosmic PV Power, Gronsol, Oswal Solar, Luno Renewable, iTorrent Industries and Arsiga Solar. Pan India Solar Sector Association (PISSA) and Rajasthan Solar Association (RSA) are the industry association partners for the event. &nbsp; Featuring high-level panel discussions, expert-led sessions, and targeted networking, REconnect Udaipur 2026 will explore key topics including solar PV manufacturing growth, ch","publishedText":"2026-07-28T08:45:38.000Z","sourceName":"Energetica India"},{"title":"MNRE Allows DISCOMs to Use PM Surya Ghar Balance Incentives …","url":"https://www.energetica-india.net/news/mnre-allows-discoms-to-use-pm-surya-ghar-balance-incentives-for-bess-and-grid-upgrades","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition May-June 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Policies &amp; Regulations &rsaquo;MNRE Allows DISCOMs to Use PM Surya Ghar Balance Incentives for BESS and Grid Upgrades MNRE Allows DISCOMs to Use PM Surya Ghar Balance Incentives for BESS and Grid Upgrades The Ministry of New and Renewable Energy has expanded the permissible use of PM Surya Ghar incentives, allowing DISCOMs to invest balance funds in BESS, rooftop solar, grid upgrades and monitoring infrastructure to support faster rooftop solar deployment. July 29, 2026. By Mrinmoy Dey The Ministry of New and Renewable Energy (MNRE) has clarified that distribution companies (DISCOMs) can utilise the balance incentive funds received under the & ;Incentive to DISCOMs& ; component of the PM Surya Ghar: Muft Bijli Yojana for battery energy storage systems (BESS), distribution infrastructure augmentation, rooftop solar installations at DISCOM buildings, and rooftop generation monitoring initiatives. &nbsp; The clarification follows representations from implementing agencies seeking guidance on the use of incentive amounts remaining after meeting the mandatory provisions specified under the scheme guidelines. &nbsp; According to MNRE, after complying with the mandatory allocations prescribed under the operational guidelines, DISCOMs can utilise the remaining incentive amount for installing rooftop solar systems at their buildings, deploying BESS to facilitate rooftop solar integration and improve grid management, augmenting distribution infrastructure in areas with high rooftop solar penetration in accordance with applicable State Electricity Regulatory Commission (SERC) or Joint Electricity Regulatory Commission (JERC) regulations. &nbsp; It can also utilise the fund for implementing rooftop generation monitoring initiatives, undertaking other rooftop solar implementation activities specified under the operational guidelines, and carrying out any additional activities that directly support the implementation of the PM Surya Ghar: Muft Bijli Yojana in accordance with prevailing financial rules. &nbsp; The ministry has also clarified that these expenditures should not duplicate projects already being funded under existing Central or state government schemes such as the Revamped Distribution Sector Scheme (RDSS). &nbsp; The latest clarification supplements the Operational Guidelines for the &lsquo;Incentives to DISCOMs&rsquo; component, issued in July 2024, while leaving all other provisions unchanged. &nbsp; Under the operational guidelines, PM Surya Ghar: Muft Bijli Yojana, approved on February 29, 2024, has a total outlay of INR 75,021 crore and aims to install rooftop solar systems in one crore households by FY 2026-27. DISCOMs serve as the State Implementation Agencies (SIAs) and are res","publishedText":"2026-07-29T02:43:24.000Z","sourceName":"Energetica India"},{"title":"Fusion Friday, 31 July 2026--> In pictures: ITER tokamak cor…","url":"https://www.world-nuclear-news.org/articles/in-pictures-iter-tokamak-core-assembly-progressing","summary":"HOME / FUSION In pictures: ITER tokamak core assembly progressing Friday, 31 July 2026 The sixth of nine tokamak sector modules has been installed in the ITER tokamak pit, almost six months ahead of schedule. The final sector is scheduled to be installed in about a year& ;s time. &nbsp; (Image: ITER Organisation) The International Thermonuclear Experimental Reactor& ;s plasma chamber, or vacuum vessel, houses the fusion reactions and acts as a first safety containment barrier. With an interior volume of 1400 cubic metres, it will be formed from nine wedge-shaped steel sectors that measure more than 14 metres in height and weigh 440 tonnes. The ITER vacuum vessel, once assembled, will have an outer diameter of 19.4 metres, a height of 11.4 metres, and weigh approximately 5,200 tonnes. With the subsequent installation of in-vessel components such as the blanket and the divertor, the vacuum vessel will weigh 8,500 tonnes. Each sector module is composed of a vacuum vessel sector, two toroidal field coils, thermal shields, and auxiliary components, with lifting equipment and stabilising beams attached for the lift operation. (Image: ITER Organisation) The fabrication of the vacuum vessel sectors is shared between Europe (five sectors) and South Korea (four sectors). Initially, South Korea was tasked with producing two vacuum vessel sectors under its agreement with the ITER Organization. However, in 2016, an additional agreement was made to produce two more sectors originally assigned to the EU. The sector modules that form the ITER machine&rsquo;s core have progressively been installed within the tokamak pit since April 2025. The sixth tokamak sector module, , weighing about 1,100 tonnes, was transferred from the Assembly Hall and lowered into the pit in a carefully coordinated lifting operation, which took 30 hours and mobilised more than 100 people, and concluded on 28 July. Together with its lifting rig, the suspended load weighed nearly 1,400 tonnes. The latest sector installation brings two-thirds of the machine& ;s torus-shaped core into place. (Image: ITER Organisation) &quot;Experience gained from each successive module assembly and lifting operation has increased the pace, efficiency and predictability of the work,&quot; the ITER Organisation noted. It said it was on track to install the final sector module in mid-2027, &quot;with teams continuing to identify opportunities for further schedule optimisation&quot;. &quot;This latest achievement is a visible marker of the progress being made through our accelerated approach to machine assembly,&quot; said ITER Director-General Pietro Barabaschi. &quot;The teams have translated lessons learned from each operation into greater efficiency, stronger coordination and a more predictable assembly sequence. With six modules now in place, we are demonstrating that this technical approach is delivering tangible results on the project& ;s critical path.&quot; With the transfer of sector module","publishedText":"2026-07-31T05:27:09.000Z","sourceName":"World Nuclear News"},{"title":"Cameco announces IPO plan for Westinghouse","url":"https://www.world-nuclear-news.org/articles/cameco-announces-go-public-plans-for-westinghouse","summary":"HOME / CORPORATE Cameco announces IPO plan for Westinghouse Friday, 31 July 2026 Westinghouse Electric Company, which is owned jointly by Cameco and Brookfield Renewable Partners, has confidentially submitted a draft registration statement relating to a proposed initial public offering of its common stock. &nbsp; The plan is for Vogtle 3 and 4 to be joined by many more AP1000s in the US (Image: Westinghouse) Announcing the registration ahead of its quarterly results call, Cameco said the number of shares to be offered and the price range for the proposed stock market offering have not yet been determined, and said the proposed offering would be subject to market and other conditions. Westinghouse, which supplied the world& ;s first commercial pressurised water reactor (PWR) in 1957 in Shippingport, Pennsylvania,&nbsp;is one of the world& ;s largest nuclear services businesses. A strategic partnership of Cameco Corporation and Brookfield Renewable Partners acquired the company for a total enterprise value of approximately USD8 billion in a transaction completed in 2023: Westinghouse had previously been acquired out of bankruptcy by Brookfield Business Partners in 2018. Currently, Cameco owns a 49% interest and Brookfield owns the remaining 51%. Speaking during Cameco& ;s results call, CEO Tim Gitzel said the company was &quot;extremely limited&quot; in what it could say under US Securities and Exchange Commission rules about the initial public offering (IPO). Nevertheless, the Westinghouse business segment featured heavily in Cameco& ;s quarterly results call, and its management& ;s discussion and analysis (MDMA) document for the quarter which ended on 30 June. Westinghouse& ;s technology platform operates across the nuclear power value chain, Cameco said in its quarterly update, with 57% of the global operating fleet of 417 reactors using its technology, making it &quot;one of the most strategically important franchises in the global nuclear power industry&quot; with &quot;growing global opportunities for its technologies&quot;.&nbsp; The MDMA documents a pipeline of deployment opportunities for 91 potential AP1000 reactors totalling some 105GWe across its global markets. These include: up to 10 units supported through American Nuclear Supply Chain Loans announced by the US Department of Energy earlier this year, with a commercial operation timeframe by the mid-2030s; up to 10 further US units supported through the strategic partnership between Cameco, Brookfield and the US Department of Commerce announced in 2025, for commercial operation by the mid-to-late 2030s; the resumption of the two-unit VC Summer project, for commercial operation by the early-mid 2030s; three units at Lubiatowo-Kopalino in Poland, for operation in the mid-2030s; two units each in Bulgaria (Kozloduy units 7 and 8) and Ukraine (Khmelnitsky units 5 and 6), for commercial operation by the mid-to-late 2030s; 11 units described as &quot;FEED-Stage Projects&quot; (F","publishedText":"2026-07-31T07:38:23.000Z","sourceName":"World Nuclear News"}]},{"label":"战略管理","items":[{"title":"Sterling Green Power Opens Talegaon Manufacturing Facility t…","url":"https://www.energetica-india.net/news/sterling-green-power-opens-talegaon-manufacturing-facility-to-expand-dg-set-production","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition May-June 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Renewable energy &rsaquo;Sterling Green Power Opens Talegaon Manufacturing Facility to Expand DG Set Production Sterling Green Power Opens Talegaon Manufacturing Facility to Expand DG Set Production Sterling Green Power Solutions has inaugurated a new manufacturing facility in Talegaon near Pune to produce 100&ndash;750 kVA diesel generator sets. With an annual production capacity of around 1,000 units, the plant will cater to commercial, industrial, healthcare, hospitality, education, government and rental sectors. July 31, 2026. By News Bureau Sterling Green Power Solutions (SGPS), part of the Sterling &amp; Wilson Group, a provider of power and sustainable energy solutions, has announced the inauguration of its new state-of-the-art manufacturing facility in the industrial hub of Talegaon, near Pune. The facility marks the first milestone in the company& ;s expansion strategy aimed at serving customers across diverse business segments while strengthening its manufacturing footprint across multiple locations. This inauguration is the first step in the company& ;s long-term capacity augmentation roadmap, which includes the establishment of additional state-of-the-art manufacturing facilities at Chakan MIDC and another new plant planned to set up at Hamriyah Free Zone, Sharjah. The Talegaon facility reinforces the company& ;s commitment to meeting the increasing demand for reliable power solutions across India& ;s commercial, industrial and retail sectors. The new plant will manufacture Diesel Generator (DG) sets ranging from 100 kVA to 750 kVA, catering to applications across the rental, hospitality, healthcare, education, government and industrial sectors. Equipped with advanced manufacturing processes, the Talegaon facility will have an annual production capacity of approximately 1,000 units targeted at retail customers. Speaking at the inauguration, Khurshed Daruvala, Chairman of Sterling and Wilson Group stated, &quot;We have strategically embarked on a multi-location manufacturing expansion to meet the growing demand for our products and services across our business segments. Over the years, our teams have earned the trust and respect of our customers, and it is this enduring confidence that has encouraged us to broaden our manufacturing footprint. Our new facility marks the first milestone in this journey, with additional expansions planned. This expansion roadmap has been carefully designed to uphold the highest standards of quality, enhance our manufacturing capabilities and consistently exceed customer expectations.&quot; Sanjay Jadhav, Chief Executive Officer, Sterling Green Power Solutions, said, &quot;Our commitment to delivering reliable and efficient power solutions that","publishedText":"2026-07-31T04:53:36.000Z","sourceName":"Energetica India"},{"title":"Avaada Secures USD 1.3 Billion Financing for 2.15 GW Renewab…","url":"https://www.energetica-india.net/news/avaada-secures-usd-13-billion-financing-for-215-gw-renewable-energy-portfolio","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition May-June 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Business &rsaquo;Avaada Secures USD 1.3 Billion Financing for 2.15 GW Renewable Energy Portfolio Avaada Secures USD 1.3 Billion Financing for 2.15 GW Renewable Energy Portfolio Avaada Group has secured approximately USD 1.3 billion in financing for its 2,150 MW renewable energy portfolio, comprising 1.35 GW of hybrid and 800 MW of utility-scale solar projects. Backed by State Bank of India, REC and Canara Bank, the projects will supply clean power to MSEDCL and GUVNL. July 31, 2026. By News Bureau Avaada Group, an integrated energy transition company, has achieved financing closure aggregating approximately USD 1.3 billion for a 2,150 MW renewable energy portfolio. The financing has been sanctioned by leading Indian financial institutions, including State Bank of India, REC and Canara Bank, across four Special Purpose Vehicles (SPVs). The portfolio comprises 1.35 GW of hybrid renewable energy projects and 800 MW of utility-scale solar projects being developed for leading state distribution companies, Maharashtra State Electricity Distribution Company (MSEDCL) and Gujarat Urja Vikas Nigam (GUVNL). Collectively, these projects involve the development of more than 3,000 MW of solar capacity and 450 MW of wind capacity across multiple locations in Gujarat and Maharashtra. The scale of financing and participation from India& ;s leading financial institutions underscores strong confidence in Avaada& ;s governance, disciplined project execution, robust asset quality and long-term growth strategy, while reaffirming the increasing appetite of lenders for well-structured renewable energy projects backed by creditworthy state utilities. Commenting on the development, Vineet Mittal, Chairman, Avaada Group, said, &ldquo;The financing closure of over USD 1.3 billion for this strategically important renewable energy portfolio represents a significant milestone for Avaada Group. The confidence reposed in us by State Bank of India, REC, Canara Bank and our lending partners is a strong endorsement of our governance standards, disciplined execution capabilities and long-term vision of accelerating India& ;s energy transition. India& ;s clean energy journey now demands not only rapid capacity addition but also reliable, dispatchable and cost-competitive renewable power that strengthens energy security while supporting economic growth. Our hybrid projects have been designed to deliver greater reliability and grid stability, while our solar projects will provide affordable clean electricity to Maharashtra and Gujarat under long-term Power Purchase Agreements (PPA). As we continue to scale, our focus remains unwavering&mdash;to deploy capital responsibly, commission these projects on schedule, create long-t","publishedText":"2026-07-31T06:38:57.000Z","sourceName":"Energetica India"},{"title":"Multiple MSRs proposed for French industrial park","url":"https://www.world-nuclear-news.org/articles/multiple-msrs-proposed-for-french-industrial-park","summary":"HOME / NEW NUCLEAR Multiple MSRs proposed for French industrial park Tuesday, 21 July 2026 French molten salt reactor developer Stellaria has signed a memorandum of understanding with Unitel Group and Energie Hub to develop an integrated energy hub in the Fos-sur-Mer area of southern France. &nbsp; Stellarium (Image: Stellaria) A major player in technology, artificial intelligence and digital infrastructure, Unitel Group co-founded the Laboratoire Fos-Berre with the French State in 2022. This think tank is dedicated to studying energy models capable of meeting the future needs of Europe& ;s largest industrial basins. That work gave rise to the conviction that an integrated energy hub could be a priority response to the challenges facing the Fos-sur-Mer region. To carry this ambition forward, Unitel created the Energie Hub consortium, a platform dedicated to the development, financing, construction and operation of strategic energy infrastructure. With the signing of the MoU, by combining their complementary expertise in nuclear technology, energy infrastructure and digital systems, the partners plan to deliver the progressive deployment of several Stellarium units, next-generation modular reactors developed by Stellaria. This phased approach will allow each stage of the project to be validated while ensuring safety and industrial control. These units will supply low-carbon electricity, industrial heat, and grid flexibility and support services for the Fos-sur-Mer area. The partners will also develop an AI-powered digital energy management platform that will optimise energy production and consumption, manage networks in real time, oversee storage capacity, and anticipate industrial demand. The partners will agree on the structuring of the project& ;s financing, preparations for creating a dedicated entity for its development and operation, and the establishment of a strategic partnership between the three companies. &quot;The signing of this memorandum marks an important milestone for the future of European industry,&quot; said Nicolas Breyton, President of Stellaria. &quot;We are proud to take part in a project of this scale, with the ambition of building a new generation of energy infrastructure. Through the self-sufficient Stellarium reactors, we will help industrial players in the Fos-sur-Mer area move toward sovereign, low-carbon production.&quot; Kevin Polizzi, president of Unitel Group, added: &quot;European industry is entering a new phase, one in which mastering energy has become a decisive factor for competitiveness, sovereignty and resilience. With this multi-energy hub project, we aim to offer an integrated model combining low-carbon energy production, digital intelligence and industrial capability. Fos-sur-Mer is a strategic location to demonstrate that a new generation of energy infrastructure can sustainably support the decarbonisation of our major industrial basins.&quot; The Stellarium reactor proposed by Stellaria - a start-u","publishedText":"2026-07-21T06:32:12.000Z","sourceName":"World Nuclear News"},{"title":"Nuclearelectrica's proposal to review SMR options rejected b…","url":"https://www.world-nuclear-news.org/articles/nuclearelectricas-proposal-to-review-smr-options-rejected-by-ministry","summary":"HOME / NEW NUCLEAR Nuclearelectrica's proposal to review SMR options rejected by ministry Thursday, 23 July 2026 Romania& ;s state-owned nuclear company had asked shareholders to approve &quot;the initiation of steps to reassess the initial development strategy for small modular reactors by expanding the analysis to include other SMR technologies and broadening the list of potential sites (in the event of a decision to scale up)&quot;. &nbsp; How a NuScale SMR plant could look (Image: NuScale) In a statement after the proposal was voted against by shareholders, including the majority shareholder, the Ministry of Energy, Nuclearelectrica (SNN) said: &quot;The company& ;s intention was for our shareholders to approve the conduct of a technology benchmarking study and multiple scenarios, based on recent technological developments, to serve as the foundation for an informed decision-making process leading to the most advantageous solution for Romania, given that a number of conditions associated with the Final Investment Decision for the Doicești Project could not be met for reasons beyond the control of both Nuclearelectrica and the project company RoPower Nuclear SA.&quot; As the vote was against the proposal, Nuclearelectrica says it &quot;will continue, in accordance with the shareholders& ;&nbsp;approval from February 2026, their efforts to reach a commercial consensus with NuScale regarding the terms for the acquisition of the SMR modules and the Framework Agreement, in parallel with discussions with representatives of the Romanian government regarding the feasibility of fulfilling the other conditions, some of which were requested by the majority shareholder, the Ministry of Energy, itself&quot;. A Final Investment Decision was taken by Nuclearelectrica shareholders in February for the small modular reactor (SMR) project, which is aiming for 462 MWe installed capacity, using NuScale technology with eventually six modules at the former coal plant site at Doicești - about 90 kilometres northwest of Bucharest - each with an installed capacity of 77 MWe. The company said in its statement - issued on the day of the meeting on 15 July - that discussions were continuing with the Ministry of Energy regarding conditions relating to the Final Investment Decision and financial support. It also stressed that a first-of-a-kind project &quot;by its very nature, entails a higher degree of technical, operational, and financial complexity than in the case of replicated projects&quot;. In a press statement the following day, the Energy Secretary Cristian Bușoi said: &quot;The proposal submitted for approval did not concern an actual strategy nor the concrete update of the Small Modular Reactors Project Implementation Strategy, but exclusively the initiation of steps to assess the opportunity for a possible update. Under these circumstances, in the absence of sufficient data, analysis and substantiation, we considered that the request addressed to the &hel","publishedText":"2026-07-23T04:59:54.000Z","sourceName":"World Nuclear News"},{"title":"Cummins Announces Phased Model Year 2027 Product Launch Plan","url":"https://investor.cummins.com/news/detail/700/cummins-announces-phased-model-year-2027-product-launch-plan","summary":"Cummins Announces Phased Model Year 2027 Product Launch Plan Download as PDF July 23, 2026 8:00am ET Company will introduce its new X10 and X15 engines through a measured production ramp while maintaining select legacy product availability COLUMBUS, Ind.--(BUSINESS WIRE)-- Cummins Inc. (NYSE: CMI) today announced updates to its Model Year 2027 North American on-highway product launch plans following its review of the U.S. Environmental Protection Agency’s recently proposed changes to upcoming emissions regulations. Based on the proposed rule, Cummins intends to use the implementation flexibilities outlined by EPA to support a measured transition to its new HELM™ engine platforms. The approach is designed to maintain regulatory compliance, support customer production schedules and provide additional time to ramp production in a disciplined manner that helps ensure a successful transition for the industry. “Our long-term product strategy has not changed,” said Jennifer Rumsey, Chair and Chief Executive Officer of Cummins Inc. “This is about improving the transition, not changing the destination. A phased production ramp will allow us to support customers while building confidence in our new products through real-world operation and maintaining our focus on quality.” Updated X15 transition plan Cummins plans to begin limited production of its Model Year 2027 X15 engine in January 2027, based on individual OEM launch plans. Production will ramp progressively, with full production expected to begin in Q4 2027. During the transition, Cummins expects its current-generation X15 engine to remain available, providing continued availability as production of the new platform increases. Updated X10 transition plan Cummins plans to begin limited production of the Model Year 2027 X10 in January 2027, with full production expected by Q3 2027, based on OEM launch plans. During the transition, the current X12 and L9 engines used in truck and transit bus applications are expected to remain available. The Model Year 2027 X10 and X15 are part of Cummins’ fuel-agnostic HELM platforms, which build on decades of engine development experience. The platforms are designed to deliver improved fuel economy, similar diesel exhaust fluid consumption and the proven, field-tested reliability customers need to complete their missions. Reaffirmed B platform transition plan Consistent with Cummins’ prior announcement, the company’s next-generation B platform is expected to launch in January 2028. The current B6.7 will remain available through 2027 to support customer production schedules and ensure a smooth transition to the new platform. Next Steps Cummins will continue working closely with OEMs, dealers, fleets and other partners to align product availability and launch timing. The phased ramp is intended to better support the transition to new technology. The updated product plan is based on Cummins’ preliminary assessment and the language currently included in EPA’s proposed ru","publishedText":"2026-07-23T00:00:00.000Z","sourceName":"Cummins"}]},{"label":"科技","items":[{"title":"Society News","url":"https://www.asme.org/topics-resources/society-news","summary":"Topics &amp; Resources Society News ASME News ASME News ASME News is a resource for those who want to learn about the Society and the many interesting activities the organization and its members are involved in each year. ASME News contains news about Society-related events and programs, as well as special features and the Newsmakers section. Filters: Sort and Filter Close Topic Clear Selection {{result.Value}} = Math.ceil(filters.KeyValueTopics.length / 3) && idx {{result.Value}} = Math.ceil(filters.KeyValueTopics.length / 3) * 2\"> {{result.Value}} Clear Selection Apply Format Clear Selection {{result.Value}} Clear Selection Apply filters-toggle-switch\"> Membership {{ t.label }} Clear Filter Clear Filters {{ start }}-{{ limit }} of {{ total }} Results Sort and Filter Sorry, no content was found matching your specifications. Try removing some filters or searching a different term. {{ result.Title }} {{ result.WebinarStart | moment }} {{ result.WebinarEndTimeString }} {{ result.WebinarStart | moment }} - {{ result.WebinarEnd | moment }} {{ result.Profiles.Title }} {{ result.Profiles.ProfileNames }} {{ result.CollectionTitle }} Collection {{ result.Summary }} {{ result.WebinarCtaText }} {{ result.Title }} Collection {{ result.ContentFormatText }} Premium {{ dateDisplay(result.Date) }} {{ result.Title }} {{ result.Profiles.Title }} {{ result.Profiles.ProfileNames}} {{ result.CollectionTitle }} Collection {{ result.Content }} {{ result.Sponsor.Intro }} Showing","publishedText":"","sourceName":"ASME IGTI"},{"title":"New Nuclear Friday, 31 July 2026--> IAEA, Canadian universit…","url":"https://www.world-nuclear-news.org/articles/iaea-canadian-university-collaborate-on-nuclear-education","summary":"HOME / NEW NUCLEAR IAEA, Canadian university collaborate on nuclear education Friday, 31 July 2026 The International Atomic Energy Agency and Canada& ;s University of Saskatchewan have signed an agreement to&nbsp;strengthen cooperation in knowledge management and education, supporting nuclear energy research and workforce development. &nbsp; (Image: University of Saskatchewan) The three-year agreement - formally called Practical Arrangements - was signed at the IAEA headquarters in Vienna, Austria, on 24 July by University of Saskatchewan (USask) Vice-President Research Baljit Singh and Mikhail Chudakov, deputy director and head of the Department of Nuclear Energy at the IAEA. The agreement provides a framework for the University of Saskatchewan to offer further education and training for professionals across Canada, as well as for expanding research and expertise in the field for the future. The agreement may also include creating a framework to integrate IAEA training materials into Canadian academic programmes, developing methodologies, tools and case studies related to nuclear knowledge management and collaborating to facilitate the use of nuclear facilities and research infrastructure for education, training and capacity building. It also includes joint publications on nuclear education, regional and interregional networks and knowledge management as well as collaboration on the IAEA& ;s International Nuclear Management Academy, a programme which supports universities in establishing and delivering master& ;s degree programmes in nuclear technology management. &quot;For many decades now, the University of Saskatchewan has been making significant contributions to the advancement of nuclear science, supporting progress in nuclear energy, including fusion, as well as a variety of non-power applications in medicine, agriculture and hydrology,&quot; Chudakov said. &quot;As nuclear power& ;s global momentum continues to gather pace, collaborative endeavours like the one we are about to embark on are more important than ever.&quot; Singh added: &quot;The University of Saskatchewan is always striving to demonstrate the world-class impact of our research, scholarly and artistic work. This agreement with the IAEA will help grow the University of Saskatchewan& ;s already strong foundation of nuclear research and education and help connect local talent and expertise with a global network.&quot; &quot;This agreement positions the University of Saskatchewan as a Canadian hub for nuclear training and innovation,&quot; said Jafar Soltan, Associate Dean for Research and Partnerships at the university. &quot;The IAEA has already been a tremendous partner for the University of Saskatchewan as we continue to grow our capacity for nuclear research and education, and I look forward to the opportunities this agreement will help create for Canada& ;s nuclear industry.&quot; In 2025, University of Saskatchewan& ;s College of Engineering hosted the Cana","publishedText":"2026-07-31T00:27:21.000Z","sourceName":"World Nuclear News"},{"title":"INNIO_DataCenter1","url":"https://www.innio.com/en/news-media/media-center/images/innio_datacenter1/","summary":"datacenter","publishedText":"Tue, 28 Jul 2026 10:49:29 +0000","sourceName":"INNIO (Jenbacher/Waukesha)"},{"title":"INNIO Awarded EcoVadis Platinum Medal for Fifth Consecutive …","url":"https://www.innio.com/en/news-media/press-releases/innio-n-v-awarded-ecovadis-platinum-medal-for-fifth-consecutive-year/","summary":"Link Munich, Germany – July 30, 2026 – INNIO N.V. (Nasdaq: INIO) has been awarded the EcoVadis Platinum Medal, the highest recognition granted by the globally trusted provider of business sustainability ratings. This marks the fifth consecutive year that INNIO has achieved Platinum status since 2022. In the latest assessment cycle, INNIO further improved its […]","publishedText":"Thu, 30 Jul 2026 12:02:49 +0000","sourceName":"INNIO (Jenbacher/Waukesha)"}]},{"label":"财经","items":[{"title":"FIC acquires US battery and solar platform operator Perfect …","url":"https://www.power-technology.com/news/fic-acquires-perfect-power/","summary":"FIC Partners Management has announced the acquisition of Perfect Power, a US-based company that owns and operates the Jaguar Energy Center.","publishedText":"Fri, 31 Jul 2026 10:20:52 +0000","sourceName":"Power Technology"}]}]};

const PALETTE = ["#818cf8","#34d399","#fbbf24","#fb7185","#22d3ee","#a78bfa","#f472b6","#4ade80","#60a5fa","#facc15"];
const DEFAULT_COLOR = "#94a3b8";
const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];

function pad(n){return n<10?"0"+n:""+n;}
function fmtDateHuman(s){
  if(!s) return "—";
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(m){ const d=new Date(+m[1], +m[2]-1, +m[3]); return `${m[1]}年${+m[2]}月${+m[3]}日 ${WEEK[d.getDay()]}`; }
  return s;
}
function fmtWhen(s){
  if(!s) return "";
  // 已是相对描述（如 "5 天前"）直接清理尾部的 "•"
  let t = String(s).replace(/•/g,"").replace(/\s+/g," ").trim();
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t);
  if(m){ const d=new Date(+m[1], +m[2]-1, +m[3]); return `${m[1]}年${+m[2]}月${+m[3]}日`; }
  return t;
}
function truncate(s,n){
  const arr=[...(s||"")];
  return arr.length>n ? arr.slice(0,n).join("")+"…" : s;
}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(data){
  const secs = data.sections||[];
  const date = data.date || "";
  document.getElementById("dateBig").textContent = fmtDateHuman(date);
  document.getElementById("windowLine").textContent = data.windowText || "";

  let total=0; secs.forEach(s=>total+=(s.items?s.items.length:0));
  document.getElementById("totalNum").textContent = total;

  const chips=document.getElementById("secChips"), nav=document.getElementById("nav");
  chips.innerHTML=""; nav.querySelectorAll("a:not(.totop)").forEach(a=>a.remove());

  secs.forEach((s,idx)=>{
    const col=PALETTE[idx%PALETTE.length];
    const n=(s.items?s.items.length:0);
    const chip=document.createElement("div");
    chip.className="sec-chip";
    chip.innerHTML=`<span class="dot" style="background:${col}"></span>${esc(s.label)} <b>${n}</b>`;
    chip.onclick=()=>document.getElementById("sec-"+idx).scrollIntoView();
    chips.appendChild(chip);
    const link=document.createElement("a");
    link.href="#sec-"+idx; link.textContent=s.label;
    nav.insertBefore(link,nav.querySelector(".totop"));
  });

  const wrap=document.getElementById("sections");
  wrap.innerHTML="";
  let counter=0;
  secs.forEach((s,idx)=>{
    const col=PALETTE[idx%PALETTE.length];
    const sec=document.createElement("section");
    sec.className="section"; sec.id="sec-"+idx; sec.style.setProperty("--sec",col);
    const items=s.items||[];
    sec.innerHTML=`<div class="section-head"><span class="bar"></span><h2>${esc(s.label)}</h2>`
      +`<span class="cnt">${items.length} 条</span></div>`;
    const grid=document.createElement("div"); grid.className="grid";
    items.forEach(it=>{
      counter++;
      const url=it.url||"#";
      const src=it.sourceName||"未知来源";
      const sum=truncate(it.summary,60);
      const card=document.createElement("article");
      card.className="card"; card.style.setProperty("--sec",col);
      card.innerHTML=
        `<div class="top"><span class="num">${counter}</span>`
        +`<span class="src" title="${esc(src)}">${esc(src)}</span></div>`
        +`<h3><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(it.title||"")}</a></h3>`
        +`<p class="sum">${esc(sum)}</p>`
        +`<div class="foot"><a class="read" href="${esc(url)}" target="_blank" rel="noopener noreferrer">查看原文 ↗</a>`
        +`<span class="when">${esc(fmtWhen(it.publishedText))}</span></div>`;
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    wrap.appendChild(sec);
  });

  if(!secs.length){
    wrap.innerHTML=`<div class="empty">本窗口内暂无采集内容。</div>`;
  }

  const srcList=(data.sources||[]).map(s=>`<b>${esc(s)}</b>`).join("、");
  document.getElementById("footer").innerHTML=
    `总条数 <b>${total}</b> 条 · 数据来源 ${srcList||"—"}`
    +` · 报告日期 ${esc(date)} <span class="badge snap">引擎快照</span><br>`
    +`本仪表盘由 source-collection-engine 渲染：每日仅需重跑流水线即可复用同一版式。`;
}

render(EMBEDDED_DATA);
</script>
</body>
</html>

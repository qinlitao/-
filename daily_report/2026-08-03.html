<style>
  :root{
    --bg:#0f1117; --bg-soft:#171a22; --card:#1b1f29; --card-hover:#222736;
    --text:#e8eaf0; --muted:#9aa3b6; --border:#2a2f3c; --shadow:0 6px 24px rgba(0,0,0,.38);
    --hero-grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 45%,#db2777 100%);
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6fb; --bg-soft:#ffffff; --card:#ffffff; --card-hover:#f1f3fa;
      --text:#171a22; --muted:#5b6573; --border:#e7eaf2; --shadow:0 6px 22px rgba(30,40,80,.10);
      --hero-grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 45%,#ec4899 100%); }
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}

  /* ---------- HERO ---------- */
  .hero{background:var(--hero-grad);color:#fff;padding:38px 22px 30px;text-align:center;position:relative;overflow:hidden;}
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% -20%,rgba(255,255,255,.18),transparent 60%);pointer-events:none;}
  .hero .kicker{font-size:13px;letter-spacing:.32em;text-transform:uppercase;opacity:.85;margin:0 0 6px;}
  .hero h1{margin:0;font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:.02em;}
  .hero .date-big{font-size:clamp(20px,4vw,30px);font-weight:700;margin:14px 0 2px;}
  .hero .window{font-size:14px;opacity:.92;margin:0 0 18px;}
  .stat-total{display:inline-flex;align-items:baseline;gap:8px;background:rgba(255,255,255,.16);
    backdrop-filter:blur(6px);padding:8px 18px;border-radius:999px;font-size:15px;margin-bottom:20px;}
  .stat-total b{font-size:24px;font-weight:800;}
  .sec-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:920px;margin:0 auto;}
  .sec-chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.22);padding:6px 13px;border-radius:999px;font-size:13px;cursor:pointer;transition:.15s;}
  .sec-chip:hover{background:rgba(255,255,255,.26);}
  .sec-chip .dot{width:9px;height:9px;border-radius:50%;}
  .sec-chip b{font-weight:700;}

  /* ---------- ANCHOR NAV ---------- */
  .nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;gap:6px;
    padding:10px 14px;overflow-x:auto;scrollbar-width:none;}
  .nav::-webkit-scrollbar{display:none;}
  .nav a{flex:0 0 auto;font-size:13.5px;color:var(--muted);padding:7px 12px;border-radius:9px;
    border:1px solid transparent;white-space:nowrap;transition:.15s;}
  .nav a:hover{color:var(--text);background:var(--card-hover);border-color:var(--border);}
  .nav .totop{margin-left:auto;color:var(--muted);}

  /* ---------- SECTIONS ---------- */
  main{max-width:1180px;margin:0 auto;padding:26px 16px 60px;}
  .section{margin:30px 0 8px;scroll-margin-top:64px;}
  .section-head{display:flex;align-items:center;gap:12px;margin:0 0 16px;}
  .section-head .bar{width:5px;height:26px;border-radius:3px;background:var(--sec);}
  .section-head h2{margin:0;font-size:20px;font-weight:800;}
  .section-head .cnt{margin-left:auto;font-size:13px;color:var(--muted);background:var(--card);
    border:1px solid var(--border);padding:3px 11px;border-radius:999px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:16px 16px 14px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;transition:.18s;position:relative;overflow:hidden;}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sec);opacity:.85;}
  .card:hover{transform:translateY(-3px);background:var(--card-hover);}
  .card .top{display:flex;align-items:center;gap:10px;}
  .num{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--sec);color:#fff;
    font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .src{margin-left:auto;font-size:12px;color:var(--muted);background:var(--bg-soft);
    border:1px solid var(--border);padding:3px 10px;border-radius:999px;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card h3{margin:2px 0 0;font-size:16px;font-weight:700;line-height:1.45;}
  .card h3 a:hover{text-decoration:underline;text-decoration-color:var(--sec);}
  .card .sum{margin:0;font-size:14px;color:var(--muted);flex:1;}
  .card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;}
  .card .read{font-size:13px;font-weight:600;color:var(--sec);display:inline-flex;align-items:center;gap:4px;}
  .card .read:hover{text-decoration:underline;}
  .card .when{font-size:12px;color:var(--muted);}

  footer{max-width:1180px;margin:0 auto;padding:22px 16px 50px;color:var(--muted);font-size:13px;
    border-top:1px solid var(--border);text-align:center;line-height:1.8;}
  footer a{color:var(--sec);}
  .badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--border);
    margin-left:6px;vertical-align:middle;}
  .badge.snap{color:#fbbf24;border-color:#fbbf2466;background:#fbbf2414;}
  .empty{padding:40px;text-align:center;color:var(--muted);}
</style>

to hold 2nd major Summit on Clean Cooking in Africa 11 December 2025 Energy Security G20 endorses action plan","publishedText":"","sourceName":"IEA"},{"title":"Himachal Pradesh to Procure 1,000 More Electric Buses, Eyes …","url":"https://www.energetica-india.net/news/himachal-pradesh-to-procure-1000-more-electric-buses-eyes-100-hydrogen-buses","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition May-June 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Other Energy Applications &rsaquo;Himachal Pradesh to Procure 1,000 More Electric Buses, Eyes 100 Hydrogen Buses Himachal Pradesh to Procure 1,000 More Electric Buses, Eyes 100 Hydrogen Buses While flagging off 297 new electric buses for HRTC in Solan district, Himachal Pradesh Chief Minister Sukhvinder Singh Sukhu announced that the state will procure 1,000 more electric buses this year and is considering the induction of 100 hydrogen-powered buses. August 01, 2026. By Mrinmoy Dey Himachal Pradesh Chief Minister Thakur Sukhvinder Singh Sukhu has announced that the state government would procure 1,000 additional electric buses during the current year, with the tendering process to commence shortly. &nbsp; He further added that the government was also considering the procurement of 100 hydrogen-powered buses to protect the state& ;s natural environment from the adverse impacts of climate change and to position Himachal Pradesh as a leading green energy state in the country. &nbsp; The announcement was made during a media interaction on the sidelines of an event where the CM flagged off 297 new Type-I electric buses from Kyarighat in Solan district for deployment across various depots of the Himachal Road Transport Corporation (HRTC), increasing the total electric fleet to 500 vehicles. &nbsp; The Chief Minister pointed out that electric buses were considerably more economical than diesel buses. The operational cost of an electric bus, including staff and other expenses, was approximately INR 36-38 per kilometre, compared to INR 76-86 per kilometre for a diesel bus. With the addition of these buses in the fleet, savings of INR 40-50 per kilometre would be ensured for HRTC, he said. &nbsp; The Chief Minister also launched the & ;HimBus Plus Card& ; which would offer passengers a modern, digital and cashless travel experience. Regular passengers would receive a five percent discount on bus fares, while senior citizens would be entitled to a 15 percent concession. In addition, passengers would be eligible for cash back up to INR 2,000 per month, depending on their monthly usage of HRTC services. &nbsp; Sukhu said that the government had envisioned making Himachal Pradesh a green energy state in its very first budget and accordingly prioritised the promotion of electric mobility. He noted that the current electric buses had a range of around 200 kilometres per charge, while the next generation of buses would be capable of travelling 250 to 300 kilometres on a single charge. These buses were being procured by the government as part of its broader strategy to make HRTC self-sustaining, he said. Tags: Sustainable Transport Thakur Sukhvinder Singh Sukhu Himachal Pradesh CM Himachal Road Transport","publishedText":"2026-08-01T07:30:53.000Z","sourceName":"Energetica India"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/harvard-business-review/posts/?feedView=all","summary":"Strengthen how you navigate uncertainty with deeper perspective and context. Learn more about HBR Executive. https://s.hbr.org/4qMlvEq","publishedText":"2026-08-02T03:02:09.736Z","sourceName":"Harvard Business Review"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/harvard-business-review/posts/?feedView=all","summary":"Discover enduring insights from the HBR magazine archive. https://s.hbr.org/4ySdG4X","publishedText":"2026-08-02T0 s","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition May-June 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Power R&amp;D &rsaquo;CEEW, SECI Sign MoU to Support Design of Next-Gen Power Market Mechanisms CEEW, SECI Sign MoU to Support Design of Next-Gen Power Market Mechanisms The Council on Energy, Environment and Water and the Solar Energy Corporation of India have signed a Memorandum of Understanding to collaborate on policy research, market design and knowledge exchange for a clean, reliable and affordable electricity sector. August 01, 2026. By Mrinmoy Dey The Council on Energy, Environment and Water (CEEW) has announced that it has signed a Memorandum of Understanding (MoU) with the Solar Energy Corporation of India (SECI) to collaborate on advancing a clean, reliable and affordable electricity sector in India. &nbsp; Under the partnership, CEEW and SECI will work together to generate evidence, develop policy solutions and support the design of next-generation market mechanisms aimed at enabling a clean, reliable and affordable power system. &nbsp; The collaboration will focus on building evidence to inform new energy and flexibility procurement mechanisms and co-developing offtake contracts. The two organisations will also work to scale up Contracts for Difference (CfD) and market-linked instruments to de-risk clean energy capacity, deepen exchange participation, improve price discovery and strengthen India& ;s power market architecture. &nbsp; In addition, the partnership will facilitate national and international knowledge exchange involving stakeholders from government, industry, finance, academia and the power market ecosystem. &nbsp; &ldquo;This partnership aims to support India& ;s journey towards a future-ready electricity system that is affordable, reliable, and increasingly powered by clean energy,&rdquo; stated CEEW. &nbsp; In May 2026, CEEW and All India Discoms Association (AIDA) signed an MoU to collaborate on harmonised resource adequacy planning, grid integration of distributed renewable energy, smart meter rollout, data utilisation and retail electricity tariff design to support the modernisation of India&rsquo;s electricity distribution sector. Tags: Power R&amp;D Council on Energy, Environment and Water CEEW Solar Energy Corporation of India SECI CEEW MoU with SECI Next-gen power market Next generation power market mechanism Contracts for Difference Please share! --> --> --> --> --> --> If you want to cooperate with us and would like to reuse some of our content, please contact: contact@energetica-india.net . &nbsp; &nbsp; Next events Renewable Energy India Expo 2026 October 22, 2026 ... more information All events &nbsp; &nbsp; Last interviews Sanjeev Aggarwal Founder and Executive Chairman Tie ALMM Implementation to Domestic Capacity, Not Calendar Deadlines: Sanjeev A","publishedText":"2026-08-01T04:10:50.000Z","sourceName":"Energetica India"},{"title":"TERI and Landesa Unveil Roadmap for Inclusive Land Governanc…","url":"https://www.energetica-india.net/news/teri-and-landesa-unveil-roadmap-for-inclusive-land-governance-in-rajasthans-utility-scale-solar-expansion","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition May-June 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Standards &amp; Certifications &rsaquo;TERI and Landesa Unveil Roadmap for Inclusive Land Governance in Rajasthan&rsquo;s Utility-Scale Solar Expansion TERI and Landesa Unveil Roadmap for Inclusive Land Governance in Rajasthan&rsquo;s Utility-Scale Solar Expansion TERI, in collaboration with Landesa, has released two research publications that proposes practical measures such as a Digital Renewable Energy Atlas, participatory mapping, agrivoltaics, and stronger community engagement to ensure India&rsquo;s clean energy transition remains environmentally sustainable, socially inclusive, and economically resilient. August 01, 2026. By News Bureau The Energy and Resources Institute (TERI), in collaboration with Landesa, has released two publications examining land governance and tenure dynamics in Rajasthan&rsquo;s utility-scale solar energy transition while suggesting practical recommendations for the further expansion of utility-scale solar. The publications come at a time when India is accelerating towards its ambition of achieving 60 percent of non-fossil fuel capacity by 2035, underscoring the need for renewable energy expansion that is both environmentally sustainable and socially inclusive. The publications&mdash;Tenure Dynamics in Land Procurement in Rajasthan&rsquo;s Utility-Scale Solar Energy Transition and Sustainable Land Futures for Utility Scale RE Expansion in States: Case Study of Rajasthan&mdash;provide evidence-based insights into the opportunities and challenges associated with land procurement for utility-scale solar projects. Drawing on policy analysis, field research and stakeholder consultations, the studies explore how renewable energy development can be better aligned with community interests, ecological conservation and long-term regional development. The research highlights that while Rajasthan has emerged as India&rsquo;s leading state in utility-scale solar deployment, sustained growth will require land governance frameworks that balance clean energy expansion with community livelihoods and ecological conservation. The studies emphasise that promoting participatory approaches and integrating spatial planning into renewable energy development can help reduce conflicts while accelerating project implementation. The key recommendations include the development of a Digital Renewable Energy Atlas, integration of participatory mapping in project planning, establishment of Land Procurement Committees, promotion of agrivoltaic and pasture-voltaic models, improved mapping of Orans and common lands and enhanced livelihood and skill development initiatives for local communities. Dr Vibha Dhawan, Director General, TERI, highlighted, &ldquo;India&rsquo;s remarkable progress throug","publishedText":"2026-08-01T04:33:28.000Z","sourceName":"Energetica India"},{"title":"Vikran Engineering Bags INR 120.69 Crore POWERGRID Contract …","url":"https://www.energetica-india.net/news/vikran-engineering-bags-inr-12069-crore-powergrid-contract-for-400-kv-gis-substation-expansion","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition May-June 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Power R&amp;D &rsaquo;Vikran Engineering Bags INR 120.69 Crore POWERGRID Contract for 400 kV GIS Substation Expansion Vikran Engineering Bags INR 120.69 Crore POWERGRID Contract for 400 kV GIS Substation Expansion Vikran Engineering to design, supply, erect, and commission 400 kV GIS infrastructure at three major substations that will enhance grid reliability, strengthen inter-regional power transmission and improve power evacuation capabilities. August 01, 2026. By News Bureau Vikran Engineering, an Engineering, Procurement and Construction (EPC) company, has secured a new order aggregating approximately INR 120.69 Crore exclusive of GST from Power Grid Corporation of India for the 400 kV GIS Substation Package SS-147. The order, awarded through Domestic Competitive Bidding adds a marquee project to its growing order book. The scope of work covers the design, engineering, manufacture, testing, supply, erection and commissioning of Gas Insulated Switchgear (GIS) equipment for augmentation of transformation capacity at three strategically important POWERGRID substations &ndash; the 400/220 kV Magarwada GIS Substation in Dadra and Nagar Haveli, the 765/400/220 kV Vadnagar GIS Substation in Gujarat and the 400/220 kV Rajgarh Substation in Madhya Pradesh. The project entails construction of 400/220kV GIS bays and allied works under two integrated contracts covering supply of goods and services. The augmentation of transformation capacity at these key nodes is expected to strengthen inter-regional power transmission, enhance grid reliability and improve power evacuation capabilities across Gujarat, Madhya Pradesh and the Union Territory of Dadra &amp; Nagar Haveli and Daman &amp; Diu. Commenting on the order win, Rakesh Markhedkar, Chairman and Managing Director, Vikran Engineering, said, &quot;Winning this order from POWERGRID is a testament to the confidence our clients continue to place in Vikran Engineering&rsquo;s engineering capabilities and execution track record. This project reinforces our long-standing relationship with POWERGRID and strengthens our footprint in the high-voltage GIS substation segment.&rdquo; He further added, &ldquo;As India&rsquo;s power demand continues to rise, augmenting transformation capacity at critical transmission nodes becomes essential to grid stability and reliability. We remain committed to delivering this project with the same quality, precision and timely execution that our clients have come to expect from us, while continuing to strengthen our order book and expand our presence in the transmission EPC space.&quot; The successful completion of this landmark project further strengthens Vikran Engineering& ;s position as a trusted partner in developing In","publishedText":"2026-08-01T05:00:29.000Z","sourceName":"Energetica India"},{"title":"CERC Proposes New Transmission Charge Waiver Framework for R…","url":"https://www.energetica-india.net/news/cerc-proposes-new-transmission-charge-waiver-framework-for-renewable-energy-and-bess","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition May-June 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Policies &amp; Regulations &rsaquo;CERC Proposes New Transmission Charge Waiver Framework for Renewable Energy and BESS CERC Proposes New Transmission Charge Waiver Framework for Renewable Energy and BESS CERC has proposed retaining ISTS charge waivers for eligible renewable energy projects delayed solely due to non-availability of the inter-state transmission system, while extending waiver benefits to eligible co-located renewable energy and battery energy storage system projects and introducing reforms to support renewable energy integration. August 01, 2026. By Mrinmoy Dey The Central Electricity Regulatory Commission (CERC) has issued the draft Central Electricity Regulatory Commission (Sharing of Inter-State Transmission Charges and Losses) (Fifth Amendment) Regulations, 2026, proposing changes to the existing regulatory framework to support renewable energy deployment, battery energy storage systems (BESS) and the implementation of the General Network Access (GNA) regime. &nbsp; Through the proposed amendments, CERC has introduced the definition of Renewable Energy Implementing Agency (REIA) in line with the GNA Regulations and proposed revisions to the computation of transmission deviations for entities availing GNARE and Temporary GNARE (T-GNARE). It has also proposed provisions for regional entities with dual connectivity to both the inter-State and intra-State transmission systems, requiring State Transmission Utilities (STUs) to share access details with the National Load Despatch Centre (NLDC) and Central Transmission Utility of India (CTUIL). &nbsp; CERC has proposed extending inter-State transmission charge waivers to energy supplied from battery energy storage systems integrated with renewable energy generating stations (REGS) or renewable hybrid generating stations (RHGS). Where the renewable project and storage are scheduled as a single entity, the energy from the BESS would be eligible for transmission charge waiver for up to 25 years from the project& ;s commercial operation date, in accordance with the applicable waiver trajectory. &nbsp; The Commission has also proposed separate treatment for battery charging cycles. Under the draft, BESS charging from co-located renewable energy projects would continue to receive applicable transmission charge waivers, while charging from other sources would be treated under a different waiver category. The NLDC has been tasked with issuing detailed procedures for data collection and energy accounting for these charging cycles. &nbsp; To facilitate market-based procurement of renewable energy, CERC has proposed allowing energy storage systems procuring power through the Green Day Ahead Market (GDAM) to count such energy towards the pre","publishedText":"2026-08-01T05:01:48.000Z","sourceName":"Energetica India"},{"title":"IEEMA Launches ElectraNorth 2026 to Accelerate Northern Indi…","url":"https://www.energetica-india.net/news/ieema-launches-electranorth-2026-to-accelerate-northern-indias-power-and-electrical-manufacturing-growth","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition May-June 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Business &rsaquo;IEEMA Launches ElectraNorth 2026 to Accelerate Northern India&rsquo;s Power and Electrical Manufacturing Growth IEEMA Launches ElectraNorth 2026 to Accelerate Northern India&rsquo;s Power and Electrical Manufacturing Growth The Indian Electrical and Electronics Manufacturers& ; Association hosts the first edition of ElectraNorth 2026 in New Delhi that spotlighted northern India& ;s expanding energy demand, investment opportunities, grid modernisation, renewable energy, battery storage, and innovation-driven manufacturing. August 01, 2026. By News Bureau The Indian Electrical and Electronics Manufacturers& ; Association (IEEMA) has hosted the inaugural edition of ElectraNorth 2026, the Northern Region& ;s flagship conclave for the power and electrical equipment industry, at New Delhi. The platform brought together policymakers, utilities, manufacturers, technology providers and financiers to deliberate on investment priorities, the regional capex outlook, emerging demand engines and the growth of SMEs in India& ;s power sector ecosystem. Speaking at the inaugural as Chief Guest, Ghanshyam Prasad, Chairperson, Central Electricity Authority, said, &quot;The country& ;s peak demand always coincides with the northern region, and the growth in the northern states is phenomenal, with Uttar Pradesh alone crossing 32,000 MW of demand. When a region dominates the country& ;s consumption profile the way the north does, its manufacturing ecosystem must be equally strong. Last year saw our highest ever capacity addition, led overwhelmingly by renewables and this momentum will only continue. Battery energy storage and hydro pump storage will see exponential growth in the future. We have a target of 100GW for hydro pump storage; we commissioned 2.6 GW last year and will aim for 3.2 GW this year and we will slowly scale this up.&quot; Dr Ashish Kumar Goel, IAS, ACS Energy, Government of Uttar Pradesh and Chairman, UPPCL, UPPTCL and UPRVUNL, delivered the keynote as Special Guest of Honour. He said, &quot;We will build our industrial strength not by lobbying to continue outdated specifications but by investing in R&amp;D and owning our technologies. In Uttar Pradesh we raised the transformer warranty to 10 plus 2 years, and while the industry initially resisted, more than 70 manufacturers are participating in our tenders today and building a better product.&quot; Presenting the Punjab story, Dr Basant Garg, IAS, Administrative Secretary, Power, Government of Punjab and CMD, PSPCL and PSTCL, said, &quot;PSPCL today enjoys an A+ rating, and we are investing heavily in the network with a 765 kV substation, four 400 kV substations and more than 20 additional substations planned ov","publishedText":"2026-08-01T05:45:08.000Z","sourceName":"Energetica India"}]},{"label":"燃气轮机","items":[{"title":"3","url":"https://www.power-eng.com/news/page/3/","summary":"Home / News / Page 3 News Amazon turns to geothermal, solar and storage to power Nevada data center growth 05.12.2026 3 min read Geothermal News Renewables Ontario advances Bruce C nuclear project with $300M pre-development agreement 05.08.2026 3 min read News Nuclear Gas power leapfrogs wind for first time in 10 years in Texas’ grid connection queue 05.07.2026 8 min read Gas News Renewables This 2.5 GW collaboration aims to advance the first & ;gas-plus-nuclear& ; plant 05.05.2026 3 min read Business Gas News As turbine queues tighten, Babcock &amp; Wilcox sees opening for boiler-steam packages in data center power race 05.05.2026 6 min read Coal Gas News Can this new partnership help accelerate nuclear deployment in the US? 05.04.2026 3 min read Business News Nuclear People on the Move: PJM, TVA and Westinghouse mark leadership shifts 05.04.2026 5 min read Business News People Clarion Events North America names new EVP of Energy 05.04.2026 3 min read Business Clarion Energy Events News Non-compliance with a looming NERC deadline could cost clean energy owners and operators, big time 05.01.2026 6 min read Business News Policy and Regulation Democrats investigate as Trump OKs almost $2 billion in taxpayer money to end offshore wind projects 04.30.2026 6 min read Business News Policy and Regulation At long last, the PJM interconnection queue is moving again. Now what? 04.29.2026 10 min read Business News Duke Energy approved to continue operating Robinson nuclear plant through 2050 04.27.2026 1 min read Business News Nuclear Construction begins on TerraPower Natrium reactor in Wyoming strained critical minerals or lengthy power infrastructure projects. The company’s technology stores electricity as heat inside insulated solid carbon blocks and converts it back into usable heat or power when required. The modular systems are designed for applications ranging from steel and chemical production to food manufacturing, data centres and grid services. “From factories to data centers, energy is the bottleneck to industrial growth,” said Andrew Ponec, Antora’s co-founder and CEO. “Antora has shown we can help break that bottleneck—delivering energy fast, at massive scale, with American innovation.” The company said its batteries can charge when electricity is cheaper or more abundant and discharge when demand increases, helping operators manage energy costs while supporting grid reliability. Joe Fath, Partner and Head of Growth at Eclipse, said the company had moved beyond early technology demonstration. “Antora has moved beyond proving the technology to demonstrating it can manufacture and deploy at remarkable speed and scale,” he said. Antora’s San Jose, California manufacturing site has expanded into a three-building battery production campus, which the company describes as one of the largest battery factories in the US. Unlike conventional lithium-ion systems, its thermal batteries use abundant materials and are designed for multi-day energy storage. As AI-driven electricity demand continues to reshape energy markets, Antora’s funding round reflects growing investor","publishedText":"2026-07-31T16:57:46.000Z","sourceName":"Modern Power Systems"}]}]};

const PALETTE = ["#818cf8","#34d399","#fbbf24","#fb7185","#22d3ee","#a78bfa","#f472b6","#4ade80","#60a5fa","#facc15"];
const DEFAULT_COLOR = "#94a3b8";
const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];

function pad(n){return n<10?"0"+n:""+n;}
function fmtDateHuman(s){
  if(!s) return "—";
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(m){ const d=new Date(+m[1], +m[2]-1, +m[3]); return `${m[1]}年${+m[2]}月${+m[3]}日 ${WEEK[d.getDay()]}`; }
  return s;
}
function fmtWhen(s){
  if(!s) return "";
  // 已是相对描述（如 "5 天前"）直接清理尾部的 "•"
  let t = String(s).replace(/•/g,"").replace(/\s+/g," ").trim();
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t);
  if(m){ const d=new Date(+m[1], +m[2]-1, +m[3]); return `${m[1]}年${+m[2]}月${+m[3]}日`; }
  return t;
}
function truncate(s,n){
  const arr=[...(s||"")];
  return arr.length>n ? arr.slice(0,n).join("")+"…" : s;
}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(data){
  const secs = data.sections||[];
  const date = data.date || "";
  document.getElementById("dateBig").textContent = fmtDateHuman(date);
  document.getElementById("windowLine").textContent = data.windowText || "";

  let total=0; secs.forEach(s=>total+=(s.items?s.items.length:0));
  document.getElementById("totalNum").textContent = total;

  const chips=document.getElementById("secChips"), nav=document.getElementById("nav");
  chips.innerHTML=""; nav.querySelectorAll("a:not(.totop)").forEach(a=>a.remove());

  secs.forEach((s,idx)=>{
    const col=PALETTE[idx%PALETTE.length];
    const n=(s.items?s.items.length:0);
    const chip=document.createElement("div");
    chip.className="sec-chip";
    chip.innerHTML=`<span class="dot" style="background:${col}"></span>${esc(s.label)} <b>${n}</b>`;
    chip.onclick=()=>document.getElementById("sec-"+idx).scrollIntoView();
    chips.appendChild(chip);
    const link=document.createElement("a");
    link.href="#sec-"+idx; link.textContent=s.label;
    nav.insertBefore(link,nav.querySelector(".totop"));
  });

  const wrap=document.getElementById("sections");
  wrap.innerHTML="";
  let counter=0;
  secs.forEach((s,idx)=>{
    const col=PALETTE[idx%PALETTE.length];
    const sec=document.createElement("section");
    sec.className="section"; sec.id="sec-"+idx; sec.style.setProperty("--sec",col);
    const items=s.items||[];
    sec.innerHTML=`<div class="section-head"><span class="bar"></span><h2>${esc(s.label)}</h2>`
      +`<span class="cnt">${items.length} 条</span></div>`;
    const grid=document.createElement("div"); grid.className="grid";
    items.forEach(it=>{
      counter++;
      const url=it.url||"#";
      const src=it.sourceName||"未知来源";
      const sum=truncate(it.summary,60);
      const card=document.createElement("article");
      card.className="card"; card.style.setProperty("--sec",col);
      card.innerHTML=
        `<div class="top"><span class="num">${counter}</span>`
        +`<span class="src" title="${esc(src)}">${esc(src)}</span></div>`
        +`<h3><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(it.title||"")}</a></h3>`
        +`<p class="sum">${esc(sum)}</p>`
        +`<div class="foot"><a class="read" href="${esc(url)}" target="_blank" rel="noopener noreferrer">查看原文 ↗</a>`
        +`<span class="when">${esc(fmtWhen(it.publishedText))}</span></div>`;
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    wrap.appendChild(sec);
  });

  if(!secs.length){
    wrap.innerHTML=`<div class="empty">本窗口内暂无采集内容。</div>`;
  }

  const srcList=(data.sources||[]).map(s=>`<b>${esc(s)}</b>`).join("、");
  document.getElementById("footer").innerHTML=
    `总条数 <b>${total}</b> 条 · 数据来源 ${srcList||"—"}`
    +` · 报告日期 ${esc(date)} <span class="badge snap">引擎快照</span><br>`
    +`本仪表盘由 source-collection-engine 渲染：每日仅需重跑流水线即可复用同一版式。`;
}

render(EMBEDDED_DATA);

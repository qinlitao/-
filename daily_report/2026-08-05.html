<style>
  :root{
    --bg:#0f1117; --bg-soft:#171a22; --card:#1b1f29; --card-hover:#222736;
    --text:#e8eaf0; --muted:#9aa3b6; --border:#2a2f3c; --shadow:0 6px 24px rgba(0,0,0,.38);
    --hero-grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 45%,#db2777 100%);
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6fb; --bg-soft:#ffffff; --card:#ffffff; --card-hover:#f1f3fa;
      --text:#171a22; --muted:#5b6573; --border:#e7eaf2; --shadow:0 6px 22px rgba(30,40,80,.10);
      --hero-grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 45%,#ec4899 100%); }
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}

  /* ---------- HERO ---------- */
  .hero{background:var(--hero-grad);color:#fff;padding:38px 22px 30px;text-align:center;position:relative;overflow:hidden;}
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% -20%,rgba(255,255,255,.18),transparent 60%);pointer-events:none;}
  .hero .kicker{font-size:13px;letter-spacing:.32em;text-transform:uppercase;opacity:.85;margin:0 0 6px;}
  .hero h1{margin:0;font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:.02em;}
  .hero .date-big{font-size:clamp(20px,4vw,30px);font-weight:700;margin:14px 0 2px;}
  .hero .window{font-size:14px;opacity:.92;margin:0 0 18px;}
  .stat-total{display:inline-flex;align-items:baseline;gap:8px;background:rgba(255,255,255,.16);
    backdrop-filter:blur(6px);padding:8px 18px;border-radius:999px;font-size:15px;margin-bottom:20px;}
  .stat-total b{font-size:24px;font-weight:800;}
  .sec-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:920px;margin:0 auto;}
  .sec-chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.22);padding:6px 13px;border-radius:999px;font-size:13px;cursor:pointer;transition:.15s;}
  .sec-chip:hover{background:rgba(255,255,255,.26);}
  .sec-chip .dot{width:9px;height:9px;border-radius:50%;}
  .sec-chip b{font-weight:700;}

  /* ---------- ANCHOR NAV ---------- */
  .nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;gap:6px;
    padding:10px 14px;overflow-x:auto;scrollbar-width:none;}
  .nav::-webkit-scrollbar{display:none;}
  .nav a{flex:0 0 auto;font-size:13.5px;color:var(--muted);padding:7px 12px;border-radius:9px;
    border:1px solid transparent;white-space:nowrap;transition:.15s;}
  .nav a:hover{color:var(--text);background:var(--card-hover);border-color:var(--border);}
  .nav .totop{margin-left:auto;color:var(--muted);}

  /* ---------- SECTIONS ---------- */
  main{max-width:1180px;margin:0 auto;padding:26px 16px 60px;}
  .section{margin:30px 0 8px;scroll-margin-top:64px;}
  .section-head{display:flex;align-items:center;gap:12px;margin:0 0 16px;}
  .section-head .bar{width:5px;height:26px;border-radius:3px;background:var(--sec);}
  .section-head h2{margin:0;font-size:20px;font-weight:800;}
  .section-head .cnt{margin-left:auto;font-size:13px;color:var(--muted);background:var(--card);
    border:1px solid var(--border);padding:3px 11px;border-radius:999px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:16px 16px 14px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;transition:.18s;position:relative;overflow:hidden;}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sec);opacity:.85;}
  .card:hover{transform:translateY(-3px);background:var(--card-hover);}
  .card .top{display:flex;align-items:center;gap:10px;}
  .num{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--sec);color:#fff;
    font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .src{margin-left:auto;font-size:12px;color:var(--muted);background:var(--bg-soft);
    border:1px solid var(--border);padding:3px 10px;border-radius:999px;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card h3{margin:2px 0 0;font-size:16px;font-weight:700;line-height:1.45;}
  .card h3 a:hover{text-decoration:underline;text-decoration-color:var(--sec);}
  .card .sum{margin:0;font-size:14px;color:var(--muted);flex:1;}
  .card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;}
  .card .read{font-size:13px;font-weight:600;color:var(--sec);display:inline-flex;align-items:center;gap:4px;}
  .card .read:hover{text-decoration:underline;}
  .card .when{font-size:12px;color:var(--muted);}

  footer{max-width:1180px;margin:0 auto;padding:22px 16px 50px;color:var(--muted);font-size:13px;
    border-top:1px solid var(--border);text-align:center;line-height:1.8;}
  footer a{color:var(--sec);}
  .badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--border);
    margin-left:6px;vertical-align:middle;}
  .badge.snap{color:#fbbf24;border-color:#fbbf2466;background:#fbbf2414;}
  .empty{padding:40px;text-align:center;color:var(--muted);}
</style>
</head>

const EMBEDDED_DATA = {"date":"2026-08-05","period":"daily","windowText":"当日（北京时间）","sources":["中国电力新闻网 (CPNN)","Energetica India","World Nuclear News","Modern Power Systems","Cummins","Rolls-Royce Power Systems (mtu)","Kawasaki Heavy Industries","INNIO (Jenbacher/Waukesha)","Power Technology","Harvard Business Review","BCG Insights","Ansaldo Energia","Rolls-Royce"],"sections":[{"label":"燃气轮机","items":[{"title":"Nuclear Policies Tuesday, 4 August 2026--> Greek ministers t…","url":"https://www.world-nuclear-news.org/articles/greek-ministers-to-examine-nuclear-energy-options","summary":"HOME / NUCLEAR POLICIES Greek ministers to examine nuclear energy options Tuesday, 4 August 2026 The Greek Council of Ministers has set up an Inter-Ministerial Committee to explore the potential for small modular reactors. &nbsp; (Image: Screengrab from Council of Ministers meeting) Prime Minister Kyriakos Mitsotakis, speaking at a Council of Ministers meeting, said the creation of the ministerial committee was of &quot;special importance&quot;. Greece has historically not deployed nuclear power, but in March this year Mitsotakis announced at the 2nd Nuclear Energy Summit in Paris that it would examine the potential role of small modular reactors in its energy mix. And last year he said Greece should be at the forefront of research and debate into using nuclear energy to decarbonise shipping. He said the brief for the committee was not &quot;the possible construction of nuclear power plants, but timely scientific investigation and the establishment of a defined framework so that our country does not lag behind international developments&quot;. He added: &quot;That is why we know that more and more countries are turning to the solution of small modular power generation reactors. It is a reality that we cannot ignore. We must, if nothing else, study it so that we have all the data at our disposal before reaching any decision. This is exactly what this Inter-Ministerial Committee will do.&quot; Although the formation of the committee does not mean Greece will necessarily be embarking on a domestic nuclear power programme, it does reflect a change of attitude in recent years. In 2021 Mitsotakis said that Greece would not build nuclear power plants &nbsp;because of the risk of earthquakes in the region. At that time, there were discussions with neighbouring Bulgaria about a long-term supply agreement from new nuclear capacity there. Most Read Friday, 31 July 2026 --> Cameco announces IPO plan for Westinghouse Friday, 31 July 2026 Thursday, 30 July 2026 --> Danube's record low leads to Hungary, Romania nuclear shutdowns Thursday, 30 July 2026 Tuesday, 28 July 2026 --> Initiative launched to bolster Italian nuclear supply chain Tuesday, 28 July 2026 Friday, 24 July 2026 --> Oklo cleared to start up test reactor Friday, 24 July 2026 Podcasts & Features Podcast: Why is the World Nuclear Investment Guide needed? Podcasts &amp; Features &middot; Friday, 31 July 2026 Viewpoint: IAEA's non-proliferation safeguards and industry's role Podcasts &amp; Features &middot; Friday, 24 July 2026 All Podcasts & Features Related Information Small Nuclear Power Reactors Emerging Nuclear Energy Countries Bulgaria planning for nuclear cooperation with Greece WNN is a public information service of World Nuclear Association. Related Topics Greece &middot; Energy policy &middot; Related Links Prime Minister of Greece &middot; Related Stories Floating nuclear power plants & ;realistic& ; for Greece &middot; Greece should consider nuclear, PM says &middot; Keep me informed","publishedText":"2026-08-04T06:44:50.000Z","sourceName":"World Nuclear News"},{"title":"TotalEnergies signs renewables deals with Shell and KKR in E…","url":"https://www.modernpowersystems.com/news/totalenergies-signs-renewables-deals-with-shell-and-kkr-in-europe/","summary":"News TotalEnergies signs renewables deals with Shell and KKR in Europe TotalEnergies will buy Shell’s European onshore renewables business, including 500 MW of operational or in-construction solar and wind projects. August 3, 2026 Share Copy Link Share on X Share on Linkedin Share on Facebook (Image credit: Achim Wagner via Shutterstock) TotalEnergies has entered into two separate agreements in the European renewables sector involving the acquisition of assets from Shell and the partial sale of a portfolio to KKR. The agreement with Shell covers TotalEnergies’ acquisition of the former’s entire European onshore renewables business. This transaction includes 500 MW of solar and wind projects either operational or under construction, primarily in Italy and the Netherlands. In addition, the deal encompasses a 3.5 GW pipeline of solar, wind and battery storage projects in development in Italy, the UK and Spain. In total, the portfolio to be acquired by TotalEnergies amounts to 4 GW. Upon completion, TotalEnergies will become the sole owner of these assets. Shell stated that this divestment is in line with its strategy to manage its power portfolio and focus on areas where it can deliver higher long-term value. Shell downstream, renewables and energy solutions president Machteld de Haan said: “This agreement reflects Shell’s continued focus on actively managing and high-grading its power portfolio in line with the strategy set out at Capital Markets Day 2025. “We are recycling capital and prioritising areas where we have differentiated capabilities and can create the most value over time, including through asset-backed power trading and customer-focused energy solutions.” Separately, TotalEnergies has signed a sale agreement with an insurance account managed by KKR for a 50% stake in a 1.2 GW onshore solar and wind asset portfolio. This portfolio, which has an enterprise value of €1.8bn ($2.07bn), includes assets in Germany, Spain, France and Poland. The electricity from these assets is either already sold to third parties or will be marketed by TotalEnergies. After the transaction, TotalEnergies will to support population and economic growth by expanding and modernising its generation mix. Plant Bowen, which began commercial operations in 1975, currently features four coal-fired units with a combined capacity of 3.37 GW. Over the decades, Georgia Power has maintained Plant Bowen as a core asset in its energy portfolio, supporting state reliability and grid stability. Georgia Power is also investing in a 500 MW battery energy storage system (BESS) at Plant Bowen. This system is part of ongoing efforts to integrate storage into the grid and enhance operational flexibility as electricity demand patterns evolve. The company cited further investments across the state of Georgia. These include upgrades at Plant Scherer and the recent completion of the Moody Battery Facility near Valdosta, which brings an additional 49.5 MW of battery storage to the grid with a four-hour discharge duration. Georgia Power’s long-term infrastructure plan, approved by the PSC, includes further natural gas expansions at Plant Wansley, Plant McIntosh and Plant Yates. The plan also involves more than 1,000 miles of new transmission lines and development of additional large-scale BESS in the years to come. In February, Southern Company and the US Department of Energy’s Office of Energy Dominance Financing announced a loan package of up to $26.5bn to support eligible power generation, transmission and grid modernisation projects across Georgia and Alabama. According to Georgia Power, the loans are intended to strengthen the region’s energy infrastructure and are forecast to deliver an estimated $7.3bn in electricity cost savings for customers over a 30-year loan period. Georgia Power chairman, president and CEO Kim Greene said: & ;For more than 50 years, Plant Bowen has been about more than just megawatts – it has been a source of pride and a cornerstone of the Northwest Georgia community, providing high-quality careers and a positive economic force for this entire region. “As we celebrate the le":"LinkedIn 动态","url":"https://www.linkedin.com/company/rolls-royce/posts/?feedView=all","summary":"We have supplied offshore oil and gas shipping company Starnav Serviços Marítimos with 40 mtu engines for new hybrid offshore vessels for Brazilian energy company Petrobras. The mtu 16V 4000 M33S engines will provide on-board power for the company’s platform supply and service recovery vessels – ensuring optimal performance, reliability and environmental compliance through the use of selective catalytic reduction (SCR) systems. The delivery marks the first time integrated battery systems have been used in this vessel series, reflecting a commitment to supporting operational efficiency through the energy transition. Read more about how we’re supporting sustainable marine power: https://lnkd.in/e9cSsAmT","publishedText":"2026-08-04T13:58:37.593Z","sourceName":"Rolls-Royce"}]},{"label":"能源","items":[{"title":"1.31亿千瓦！山东电网负荷创历史新高","url":"https://www.cpnn.com.cn/news/dianli2023/202608/t20260804_1906219.html","summary":"国家能源局主管 中国能源传媒集团 中电传媒股份有限公司主办 投稿 登录 X 能源中国IOS版 能源中国安卓版 陇上孟河 X 首页 电力 新能源 油气 煤炭 企业 地方 科技 国际 人事 观点 观察 您的位置 > 首页 -> 电力 1.31亿千瓦！山东电网负荷创历史新高 来源： 大众新闻 时间： 2026-08-04 15:03 8月3日11时19分，山东电网全网最高用电负荷达1.31亿千瓦，创历史新高，较去年最高负荷提高约80万千瓦。 受本轮高温天气影响，全省制冷、降温用电需求集中释放，山东电网负荷快速攀升。据国网山东省电力公司监测，本次用电负荷创新高时刻，外电入鲁电力2656万千瓦，风光新能源合计5687万千瓦，省内直调机组发电出力合计4121万千瓦，地方电厂发电出力合计636万千瓦。截至目前，滨州、德州、东营、济南、临沂、青岛、威海、潍坊、烟台9市电网负荷创历史新高。 为提升电力供应水平、夯实电网运行基础，国网山东电力密切跟踪天气变化开展精细化负荷预测，“一机一策”制定保供顶峰措施，全力推动发电机组应开尽开，7月55家直调电厂日均非停率、受阻率分别为0.56%、0.37%，创历史新低。 同时，深挖调节性资源参与电网调节的潜力，引导新能源汽车车主将车辆富余电量反向上传到电网，缓解晚高峰供电压力；充分发挥储能顶峰发电作用，8月3日晚，在国网山东电力调控中心统一统筹指挥下，全省172座新型储能电站在同一时刻启动放电，最大放电功率1198万千瓦，再度刷新全国省级电网新型储能集中调用纪录。 此外，依托“五交四直”特高压输电大通道，外电入鲁保障能力持续提升。7月晚峰外电入鲁中长期交易电力量达3184万千瓦，同比增长15.4%，有力确保负荷尖峰时段电力平稳供应。 实习编辑：王雪聪 中电专题 学习贯彻四中全会精神 “十四五”能源高质量发展 热点推荐 核电上下游企业加大投入迎规模化发展良机 集体涨停！核电板块爆发 7月省间中长期市场交易规模263亿千瓦时 蒙电入沪过江工程在上海开工 24.2%！上半年电力市场交易跑出“加速度” 全球电力需求加速增长 占比近九成！青海电力现货市场6月新能源唱主角 广东8月中长期交易综合价0.415元/千瓦时 相关链接 中国政府网 国家发改委 国家能源局 国家电网 南方电网 华能集团 大唐集 rged as the world& ;s largest rooftop solar programme. According to the government, the pace of implementation has accelerated significantly under the leadership of Prime Minister Narendra Modi, with nearly one lakh households adopting rooftop solar every six days. &nbsp; The installation rate has increased 3.2 times over the last nine months, rising from 5,038 installations per day in October 2025 to nearly 16,328 installations per day in July 2026. July 2026 alone witnessed 5.06 lakh rooftop solar installations, the highest monthly addition since the scheme& ;s inception. &nbsp; To support widespread adoption, the government has released INR 28,024 crore in subsidies directly to beneficiaries through the Direct Benefit Transfer (DBT) mechanism. As a result, nearly 19 lakh households are now reporting zero electricity bills, substantially reducing household energy expenses. &nbsp; The scheme has also enabled participating consumers to generate additional income by exporting surplus electricity to the grid. During FY 2024-25, more than 12 lakh households collectively earned INR 421 crore through surplus power sales, translating into an average annual income of around INR 3,500 per household. &nbsp; The Utility Led Aggregation (ULA) model has further expanded access to rooftop solar for economically weaker sections. Under the model, 1.6 lakh installations have been completed for beneficiaries under PMAY, BPL and SC/ST categories across four States, while the framework has already been sanctioned for rollout in 12 States. The initiative is helping low-income households adopt rooftop solar while reducing the tariff subsidy burden on State governments. &nbsp; Affordable financing has also cont","publishedText":"2026-08-04T07:49:25.000Z","sourceName":"Energetica India"},{"title":"Apraava Energy Secures ISTS Project in Andhra Pradesh to Eva…","url":"https://www.energetica-india.net/news/apraava-energy-secures-ists-project-in-andhra-pradesh-to-evacuate-3-gw-of-renewable-energy","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition July-August 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Smart Grid / T&amp;D &rsaquo;Apraava Energy Secures ISTS Project in Andhra Pradesh to Evacuate 3 GW of Renewable Energy Apraava Energy Secures ISTS Project in Andhra Pradesh to Evacuate 3 GW of Renewable Energy Apraava Energy has acquired the SPV for an interstate transmission project in Andhra Pradesh that will enable the evacuation of around 3 GW of renewable energy from the Ananthapur region. August 04, 2026. By Mrinmoy Dey Apraava Energy has announced that it has acquired the Special Purpose Vehicle (SPV), Ananthpuram Transmission, for developing an interstate transmission project in Ananthapur, Andhra Pradesh. &nbsp; The project was awarded through the Government of India& ;s Tariff-Based Competitive Bidding (TBCB) process. It involves the setting up of approximately 250 circuit kilometres (ckm) of 765 kV transmission lines, along with a 4,500 MVA (3x1500 MVA) 765 kV pooling station, including the installation of a &plusmn;300 MVAR Static Synchronous Compensator (STATCOM), stated the company. &nbsp; It further added that the project will strengthen the interstate transmission infrastructure in the state of Andhra Pradesh by facilitating the integration and evacuation of about 3 GW of renewable energy from Ananthapur region. &nbsp; Commenting on the win, Rajiv Ranjan Mishra, Managing Director, Apraava Energy, said, &ldquo;Apraava is pleased to expand its transmission footprint in Andhra Pradesh. The state&rsquo;s strong development trajectory, progressive approach to clean energy, and immense renewable energy potential make it an important part of India&rsquo;s energy transition. We are particularly excited to mark this as our first investment in Andhra Pradesh and look forward to exploring more opportunities to invest in the state.&rdquo; &nbsp; He further added, &ldquo;A strong and resilient transmission network is fundamental to unlocking this potential and strengthening India&rsquo;s long-term energy security. At Apraava Energy, we are proud to partner in this national endeavour by developing high-quality transmission assets that strengthen the grid, enable renewable energy integration, and support India& ;s sustainable growth.&rdquo; &nbsp; Developed under the Build, Own, Operate and Transfer (BOOT) model, the asset will provide transmission services for a concession period of 35 years following commissioning. The completion timeline is set at 36 months from the date of signing of the Transmission Service Agreement (TSA). It is also expected to generate significant direct and indirect employment opportunities during the construction and operational phases. &nbsp; Apraava currently operates three transmission assets comprising approximately 1,000 ckm of transmission lines and 3","publishedText":"2026-08-04T08:22:09.000Z","sourceName":"Energetica India"},{"title":"India&#039;s Distributed RE Capacity Climbs to 31.5 GW, Roof…","url":"https://www.energetica-india.net/news/indias-distributed-re-capacity-climbs-to-315-gw-rooftop-solar-drives-growth-ieefa--","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition July-August 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Business &rsaquo;India& ;s Distributed RE Capacity Climbs to 31.5 GW, Rooftop Solar Drives Growth: IEEFA India& ;s Distributed RE Capacity Climbs to 31.5 GW, Rooftop Solar Drives Growth: IEEFA India& ;s distributed renewable energy capacity reached 31.5 GW in FY2026, led by rooftop solar under PM Surya Ghar and PM KUSUM, though its renewable energy share remained around 21&ndash;22 percent, according to IEEFA. August 04, 2026. By EI News Network India&rsquo;s distributed renewable energy (DRE) sector has witnessed rapid expansion over the past eight years, with installed distributed solar capacity increasing from 1.8 GW in FY2018 to 31.5 GW in FY2026, supported by flagship government initiatives such as PM Surya Ghar Muft Bijli Yojana and PM KUSUM, according to a new report by the Institute for Energy Economics and Financial Analysis (IEEFA). The report, & ;Role of Distributed Resources in Energy Transition: A Multi Country Perspective& ;, highlights that rooftop solar has emerged as the largest contributor to distributed energy resource (DER) growth across India, Australia and Bangladesh. DERs include small scale electricity generation and storage technologies such as rooftop solar, solar irrigation pumps, batteries and biogas systems located close to where electricity is consumed. According to the report, India possesses an estimated technical rooftop solar potential of 637 GW, while more than 29 million irrigation pumps across the country offer significant opportunities for solarisation. Government support through capital expenditure, renewable energy service company (RESCO), operating expenditure (OPEX) and utility led implementation models has helped expand rooftop solar deployment across both urban and rural markets. The report notes that despite the strong increase in distributed solar installations, distributed renewable capacity continues to account for only around 21 to 22 percent of India& ;s total renewable energy capacity. Utility scale solar projects have grown at an even faster pace, limiting the overall share of distributed generation within the country& ;s renewable energy mix. IEEFA& ;s Lead Analyst for Sustainable Finance, Gaurav Upadhyay, said that PM Surya Ghar Muft Bijli Yojana and PM KUSUM have broadened market participation and accelerated distributed renewable deployment by supporting multiple financing and implementation models. The report also compares India& ;s progress with developments in Australia and Bangladesh. Australia has installed rooftop solar systems on around 40 percent of homes, with rooftop solar contributing more than 13 percent of electricity generation in the National Electricity Market between 2014 and 2025. The country is","publishedText":"2026-08-04T14:40:58.000Z","sourceName":"Energetica India"},{"title":"Attero Opens Global Access to World&#039;s Only UNFCCC Verif…","url":"https://www.energetica-india.net/news/attero-opens-global-access-to-worlds-only-unfccc-verified-e-waste-carbon-credits","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition July-August 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Business &rsaquo;Attero Opens Global Access to World& ;s Only UNFCCC Verified E Waste Carbon Credits Attero Opens Global Access to World& ;s Only UNFCCC Verified E Waste Carbon Credits Attero has opened global access to UNFCCC verified e waste carbon credits, enabling organisations to support credible decarbonisation and circular economy initiatives. August 04, 2026. By EI News Network Attero has announced that organisations worldwide can now access Certified Emission Reductions (CERs) generated through its United Nations Framework Convention on Climate Change (UNFCCC) registered Clean Development Mechanism (CDM) Project 9739, the world& ;s only registered and verified carbon credit project under the UNFCCC methodology AMS III.BA for recovery and recycling of materials from electronic waste. The move expands global access to high integrity carbon credits generated through verified e waste recycling while supporting critical mineral recovery and circular economy objectives. According to the company, the project combines independently verified greenhouse gas emission reductions with responsible recycling of end of life electronic waste, making it a differentiated offering in the international carbon market. The CERs are generated under CDM Project 9739 and represent verified reductions in greenhouse gas emissions achieved through Attero& ;s recycling operations. Each carbon credit is equivalent to one tonne of carbon dioxide emissions avoided, enabling organisations to strengthen their environmental, social and governance (ESG) commitments and decarbonisation strategies with independently verified climate assets. Commenting on the development, Nitin Gupta, Chief Executive Officer and Co founder of Attero, said organisations are increasingly prioritising the quality and credibility of carbon credits rather than the volume. He said the company& ;s UNFCCC verified project reflects years of investment in advanced recycling technologies and offers businesses an opportunity to support verified climate action while promoting resource security and the circular economy. Gupta added that Attero& ;s proprietary technologies, backed by more than 50 global patents, recover critical minerals with recovery efficiency exceeding 98 percent while achieving purity levels above 99.9 percent across battery materials. The company noted that electronic waste has become the world& ;s fastest growing waste stream, with more than 60 million tonnes generated annually. It said the availability of CERs from the project comes at a time when organisations are seeking high quality carbon offsets that deliver measurable environmental benefits alongside sustainable resource recovery. Attero stated that the ca","publishedText":"2026-08-04T15:08:40.000Z","sourceName":"Energetica India"},{"title":"MNRE Proposes Standardised 14-Digit Nomenclature for Solar P…","url":"https://www.energetica-india.net/news/mnre-proposes-standardised-14-digit-nomenclature-for-solar-pv-cells-under-almm-list-ii","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition July-August 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Policies &amp; Regulations &rsaquo;MNRE Proposes Standardised 14-Digit Nomenclature for Solar PV Cells Under ALMM List-II MNRE Proposes Standardised 14-Digit Nomenclature for Solar PV Cells Under ALMM List-II MNRE has proposed to introduce a standardised 14-digit alphanumeric nomenclature for Solar PV cell models listed under the ALMM List-II, to improve product identification, traceability and uniformity across the domestic solar manufacturing ecosystem. Stakeholders can submit their comments and suggestions by August 13, 2026. August 04, 2026. By Mrinmoy Dey The Ministry of New and Renewable Energy (MNRE) has proposed to standardise nomenclature for Solar PV cell models under the Approved List of Models and Manufacturers (ALMM) List-II. The draft proposal is intended to establish a uniform identification system for solar cell models manufactured by different companies. &nbsp; According to the ministry, ALMM List-II currently contains model names submitted individually by manufacturers. In the absence of a prescribed naming convention, manufacturers follow their own proprietary model naming systems, resulting in inconsistencies that make it difficult to uniformly identify the technical characteristics of Solar PV cells. &nbsp; To address this, MNRE has proposed adopting a standardised 14-digit alphanumeric nomenclature for all Solar PV cell models listed under ALMM List-II. The ministry said that the proposed format is designed to assign a unique identification number to each enlisted model while incorporating essential technical information related to the product. &nbsp; Under the proposed structure, the nomenclature will include information such as the origin of the wafer, ingot and polysilicon (domestic or foreign), cell technology (such as Mono PERC, TOPCon, HJT or Back Contact), wafer size (including M10, M10R, G12 and G12R), number of busbars, and a manufacturer-specific identifier covering details such as brand, revision or variant. &nbsp; For illustration, the ministry cited the nomenclature DDFTCG12R16R01, which can be decoded to indicate that the solar cell uses a domestically manufactured wafer (D) and domestically produced ingot (D), while the polysilicon is imported/foreign (F). The code TC denotes TOPCon cell technology, G12R specifies the G12R wafer size, 16 represents a 16-busbar configuration, and R01 serves as the manufacturer-specific identifier, which may indicate the product revision, brand or variant &nbsp; MNRE stated that the proposed standardised nomenclature is expected to serve as a unique identification number for every Solar PV cell model listed under ALMM. Besides facilitating ALMM implementation, the system is expected to improve uniform product identificati","publishedText":"2026-08-04T02:01:55.000Z","sourceName":"Energetica India"},{"title":"New Nuclear Monday, 3 August 2026--> New Chinese reactors re…","url":"https://www.world-nuclear-news.org/articles/chinese-reactors-start-up-milestones","summary":"HOME / NEW NUCLEAR New Chinese reactors reach start-up milestones Monday, 3 August 2026 Unit 3 of the Changjiang nuclear power plant in China& ;s Hainan province has begun supplying electricity to the grid, while unit 2 of the Taipingling plant in Guangdong has entered commercial operation. Both units feature Hualong One (HPR1000) reactors. &nbsp; Changjiang unit 3 (Image: CNNC) According to World Nuclear Association figures, China& ;s total installed nuclear generating capacity has now increased to 63.98 GWe, moving ahead of France& ;s 63 GW for the first time and putting it second only to the USA& ;s 96.9 GWe. On 1 August, Changjiang unit 3 was &quot;successfully connected to the grid, and the first kilowatt-hour of clean electricity was generated here, flowing into thousands of homes&quot;, China National Nuclear Corporation (CNNC) said. &quot;With stable parameters and good operating condition, the unit has officially entered the load-bearing trial operation phase, marking a crucial step towards commercial operation.&quot; Two Hualong One pressurised water reactors (PWRs)&nbsp;are being constructed in the second phase of the Changjiang plant. First concrete was poured for the base slab of unit 3& ;s nuclear island in March 2021, with that of unit 4 being poured in the December of that year. Changjiang Phase II - units 3 and 4 - represents a total estimated investment of CNY40 billion (USD5.9 billion), according to China Huaneng, which holds a 51% share in the project. Both units are scheduled to be fully operational in early 2027. (Image: CNNC) Changjiang 3 achieved first criticality - a sustained chain reaction - on 10 July. The Changjiang nuclear site is already home to two operating CNP-600 PWRs - Changjiang 1 and 2 - which entered commercial operation in 2015 and 2016, respectively. In 2021, CNNC also began construction of a demonstration ACP100 small modular reactor at the site. The multi-purpose 125 MWe PWR - also referred to as the Linglong One - is designed for electricity production, heating, steam production or seawater desalination. It is currently undergoing pre-commissioning tests. Read more:&nbsp; China approves construction of eight more reactors The island province of Hainan is China& ;s southernmost point. Energy policies published in 2019 by Hainan Province Development and Reform Commission specify that nuclear power will become the primary source of electricity for the island, which has a population of close to 10 million. Taipingling unit 2 Unit 2 of the Taipingling nuclear power plant has entered commercial operation, China General Nuclear (CGN) announced. The unit is the second of six Hualong One reactors planned for the site in Guangdong province. (Image: CGN) The unit &quot;completed all commissioning works on 3 August 2026, and is qualified for commercial operation&quot;, CGN said in a statement to the Hong Kong Stock Exchange. These works included a series of commissioning tests, including a test run last","publishedText":"2026-08-03T06:26:29.000Z","sourceName":"World Nuclear News"},{"title":"Finnish regulator gives positive decision on used fuel repos…","url":"https://www.world-nuclear-news.org/articles/finnish-regulator-gives-positive-decision-on-used-fuel-repository","summary":"HOME / WASTE &amp; RECYCLING Finnish regulator gives positive decision on used fuel repository Tuesday, 4 August 2026 The safety requirements for granting the operating licence for the world& ;s first used nuclear fuel repository have been met, Finland& ;s Radiation and Nuclear Safety Authority has said in&nbsp;an official statement to the Ministry of Economic Affairs and Employment. &nbsp; (Image: Posiva) Radioactive waste management company Posiva submitted its application, together with related information, to the Ministry of Economic Affairs and Employment on 30 December 2021 for an operating licence for the used fuel encapsulation plant and final disposal facility at Olkiluoto. Posiva is applying for an operating licence for a period from March 2024 to the end of 2070. The encapsulation plant and final disposal facility are intended for the used nuclear fuel generated by TVO& ;s Olkiluoto and Fortum& ;s Loviisa nuclear power plant units. The government will make the final decision on Posiva& ;s application, but a positive opinion by the Radiation and Nuclear Safety Authority (STUK) is required beforehand. The regulator began its review in May 2022 after concluding Posiva had provided sufficient material. The ministry had requested STUK& ;s opinion on the application by the end of 2023 before extending it, in stages, until the end of June 2026. At the end of June, STUK said it was still finalising the safety assessment and statement. STUK has now announced that it has published its safety assessment of Posiva& ;s encapsulation and final disposal facility for used nuclear fuel. It says the facility meets the safety requirements set for it in the Nuclear Energy Act and Decree, and, &quot;therefore, there is no obstacle to granting the facility an operating licence with regard to radiation and nuclear safety&quot;. In the safety assessment, STUK has examined both the safety of the encapsulation and final disposal facility during the operation phase and the long-term safety of the final disposal.&nbsp;The long-term safety assessment examines the development of the final disposal system and its environment over very long periods of time - the facility aims for safe storage for at&nbsp;least 100,000, and as many as a million,&nbsp;years - and how the release and transmission of radioactive substances into the environment is prevented and slowed down. In addition, STUK has assessed the readiness of Posiva& ;s organisation to start operation of the encapsulation and final disposal facility. &quot;This is a significant step in the final disposal of spent nuclear fuel that has been prepared for more than 40 years,&quot; said Petteri Tiippana, STUK& ;s Director General. &quot;STUK has been assessing and overseeing the safety of final disposal over several decades. Based on the overall assessment we have now made, we can conclude that the safety requirements for granting the operating permit are met.&quot; STUK has proposed conditions f","publishedText":"2026-08-04T07:52:21.000Z","sourceName":"World Nuclear News"}]},{"label":"战略管理","items":[{"title":"1000千伏赣江—赣南特高压交流输变电工程获得核准","url":"https://www.cpnn.com.cn/news/dianli2023/202608/t20260804_1906284.html","summary":"国家能源局主管 中国能源传媒集团 中电传媒股份有限公司主办 投稿 登录 X 能源中国IOS版 能源中国安卓版 陇上孟河 X 首页 电力 新能源 油气 煤炭 企业 地方 科技 国际 人事 观点 观察 您的位置 > 首页 -> 电力 1000千伏赣江—赣南特高压交流输变电工程获得核准 来源： 电网头条微信公众号 时间： 2026-08-04 16:34 7月28日，1000千伏赣江—赣南交流输变电工程获得江西省发展和改革委员会核准批复。该工程为“十五五”期间华中区域首项获得核准的特高压交流工程。 赣江—赣南交流输变电工程计划新建1000千伏赣南变电站，新增变电容量2*300万千伏安，新建线路长度2*298.9千米，由国家电网有限公司华中分部出资建设。该工程投运后，可大幅提升江西电网南北断面输电能力，有效支撑腾格里—江西特高压直流工程接入及安全稳定运行，进一步完善华中区域特高压交流网架，提升区域内省间电力互济与消纳能力。 a 750 MW Power Purchase Agreement (PPA) with NTPC for a portfolio comprising solar, wind and battery energy storage projects in Andhra Pradesh and Rajasthan. The agreement is among the largest renewable energy projects secured by capacity in India and marks a major milestone in the company& ;s growth. The project is expected to generate approximately 2.5 billion units of clean electricity annually once operational. It is also projected to reduce around 1.8 million tonnes of carbon dioxide emissions every year, contributing significantly to India& ;s clean energy transition. The latest agreement strengthens Evren& ;s renewable energy portfolio, which now stands at an 11 GW development pipeline. More than 3.5 GW of this capacity is currently under construction across solar, wind and battery energy storage projects. Commenting on the development, Suman Kumar, Chief Executive Officer of Evren, said that the 750 MW PPA reflects the company& ;s execution capabilities and the scale it has achieved over time. He added that with an 11 GW pipeline and over 3.5 GW under construction, Evren is well positioned to deliver reliable and sustainable power at scale while serving as a long term partner for customers. The agreement highlights Evren& ;s continued expansion in India& ;s renewable energy sector through integrated utility scale generation and energy storage projects designed to provide dependable clean power. Tags: Business Evren Signs Renewable Energy PPA Evren PPA NTPC RE portfolio battery energy storage projects Andhra Pradesh BESS Rajasthan Evren PPA with NTPC Please share! --> --> --> --> --> --> If you want to cooperate with us and would like to reuse some of our content, please contact: contact@energetica-india.net . &nbsp; &nbsp; Next events Renewable Energy India Expo 2026 October 22, 2026 ... more information All events &nbsp; &nbsp; Last interviews Avinash Hiranandani Vice Chairman and MD Continuous Innovation is Fundamental to RenewSys&rsquo; Growth Strategy: Avinash Hiranandani Sanjeev Aggarwal Founder and Executive Chairman Tie ALMM Implementation to Domestic Capacity, Not Calendar Deadlines: Sanjeev Aggarwal Archana Bhatnagar Director, Market and Project Development, South Asia Renewables Will Become the Backbone of India&rsquo;s Grid, Says W&aum","publishedText":"2026-08-04T14:29:25.000Z","sourceName":"Energetica India"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/harvard-business-review/posts/?feedView=all","summary":"\"Global by Design\" publishes next week. The book is available for pre-order now: https://lnkd.in/gW7jMpTR","publishedText":"2026-08-04T03:01:21.431Z","sourceName":"Harvard Business Review"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/harvard-business-review/posts/?feedView=all","summary":"Stronger decisions start with better thinking. Get access to all the latest from HBR. https://s.hbr.org/3U19HCT","publishedText":"2026-08-04T03:01:21.431Z","sourceName":"Harvard Business Review"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/harvard-business-review/posts/?feedView=all","summary":"Explore the latest thinking on leadership, strategy, and innovation. https://s.hbr.org/4fNaPBE","publishedText":"2026-08-04T03:01:21.431Z","sourceName":"Harvard Business Review"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/harvard-business-review/posts/?feedView=all","summary":"Work through real leadership challenges with live events, case studies, and guided learning opportunities. Learn more about HBR Executive. https://s.hbr.org/4qMlvEq","publishedText":"2026-08-04T15:01:21.431Z","sourceName":"Harvard Business Review"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/boston-consulting-group/posts/?feedView=all","summary":"Only a small minority of organizations are generating value at scale from AI. Those who succeed use AI to create a structural cost advantage; they redesign how work gets done, embed AI into operating models, and tie initiatives directly to P&L outcomes. Learn more in this latest edition of BCG Executive Perspectives, including the five success factors to translate applied AI into long-term structural cost advantage: https://on.bcg.com/4fD8quf","publishedText":"2026-08-04T13:00:59.182Z","sourceName":"BCG Insights"}]},{"label":"产业链","items":[{"title":"核电上下游企业加大投入迎规模化发展良机","url":"https://www.cpnn.com.cn/news/dianli2023/202608/t20260804_1906220.html","summary":"国家能源局主管 中国能源传媒集团 中电传媒股份有限公司主办 投稿 登录 X 能源中国IOS版 能源中国安卓版 陇上孟河 X 首页 电力 新能源 油气 煤炭 企业 地方 科技 国际 人事 观点 观察 您的位置 > 首页 -> 电力 核电上下游企业加大投入迎规模化发展良机 来源： 证券日报 时间： 2026-08-04 15:03 8月3日，A股市场核能核电板块持续强势。其中，久盛电气、瑞迪智驱、中国核建等多只个股涨停。此外，板块内多只个股股价大幅走高。 市场升温背后，是核电产业迎来多重利好。例如，7月31日，国务院常务会议决定核准辽宁庄河一期工程等四个核电项目，获批的新项目共计8台新机组，估算新项目的总投资将超过1700亿元；8月1日，华能昌江核电二期项目3号机组并网发电。 “国内核电项目的密集落地是核电产业长期发展逻辑落地兑现的标志性信号。”科技部国家科技专家库专家周迪在接受《证券日报》记者采访时表示，受政策、技术、市场多重利好因素叠加推动，核电行业正逐步进入规模化、批量化、多元化高质量发展新阶段，也有望为产业链上市企业带来增量订单。 市场需求攀升 核电作为清洁高效的低碳基荷能源，在全球能源供给体系中的战略地位持续提升。从技术原理来看，核电可分为核裂变发电和核聚变发电两大类，目前成熟商用的核电站均采用核裂变进行发电。 除上述核电项目外，今年4月份，中广核广东太平岭核电项目1号机组投产发电，正式具备商业运行条件；5月份，中广核广东太平岭核电厂2号机组首次核燃料装载工作圆满完成；7月份，中广核广东太平岭核电项目2号机组首次并网成功，发出第一度电。 福州公孙策公关咨询有限公司合伙人詹军豪在接受《证券日报》记者采访时表示，当前东部沿海省份在夏季、冬季用电高峰时期，常会处于电力紧平衡状态。伴随区域内低效老旧煤电机组有序关停退出，清洁电力供给存在缺口，而供电能力稳定的核电，可有效填补区域低碳能源缺口、夯实电力保供能力。与此同时，AI算力产业的爆发式增长，也让核电的市场价值和发展空间进一步扩大。 市场需求攀升的同时，国内核电自主技术也不断迎来突破，为产业规模化发展筑牢根基。中国数实融合50人论坛智库专家洪勇在接受《证券日报》记者采访时表示，经过多年迭代发展，国内核电反应堆技术体系日趋完善，压水堆（PWR）、沸水堆（BWR）以及重水堆等主流堆型应用广泛。此外，随着第四代核反应堆概念的提出，新一代技术如高温气冷堆（HTGR）和快中子增殖堆（FBR）走向商业化应用，为未来能源结构转型提供更多选择。 技术的持续成熟与迭代升级，也打破了核电单一的应用局限，推动产业向多元化、场景化方向延伸。深圳市湾众管理咨询有限公司首席经济学家邱思甥表示，当下核电技术已应用于医疗康养、农业育种、环境治理等多个民生领域，国内能源企业依托小型模块化反应堆，正分阶段推进核能供暖、工业供汽、核能制氢、海水淡化等综合利用商业化试点。 政策层面也为核电长期发展搭建了稳定的支撑框架。今年6月份，国家发展改革委、国家能源局印发的《新型能源体系建设“十五五”规划》明确提出，积极安全有序发展核电。以三代压水堆技术为主，保持核电平稳建设节奏。积极稳妥推进先进堆型研发和示范工程建设。因地制宜推进核能综合利用。2030年在运核电装机达到1.1亿千瓦左右。 地方层面，山东、广东、浙江、辽宁等地已分别出台相关政策，通过提速重大机组项目核准开工、培育核能装备产业集群等方式，推动核电产业规模化、批量化、安全化发展。 中国电子商务专家服务中心副主任郭涛认为，核电产业政策红利具备长期持续性，未来，批量化机组建设、核能多场景综合利用、全产业链高端化，将有望成为行业核心发展路线。 相关公司抢抓机遇 多重利好共同推动核电行业扩容，随着新建机组持续落地，上游设备、配套材料、环保服务等环节需求逐步释放。对此，产业链上下游公司纷纷加大研发与市场拓展力度，抢抓行业规模化发展带来的市场机遇。 在核电商业化项目落地方面，中电环保股份有限公司相关负责人表示，公司已落地华能威海、中煤玉环、中核霞浦核电等大型标杆项目，核电海水淡化领域优势显著，覆盖国内主流核电基地。 在技术迭代升级方面，浙江金盾风机股份有限公司相关负责人表示，公司“三代核电站环境控制系统装备关键技术与产业化”项目成果已应用于国内外多个重点核电工程。目前公司已在此基础上迭代升级，现已具备高温气冷堆、快堆等四代核电配套供货能力，获得多项发明专利。 在核电关键材料领域，浙江久立特材科技股份有限公司相关负责人表示，公司深耕核电管材领域多年，现具备核1/2/3级产品配套能力，并已积累相应资质和项目经验。目前，公司核电业务收入归属于电力设备制造板块。 北京科方得科技发展有限公司研究负责人张新原在接受《证券日报》记者采访时表示，大批量核电项目的审批落地，将带动全产业链企业营收稳步增长。其中，设备制造端投资占比高、订单弹性最强，是本轮批量核准的核心受益环节；工程建设企业将随项目土建开工逐步释放业绩；核电运营企业业绩兑现周期更长，长期具备稳定增长优势。 实习编辑：王雪聪 中电专题 学习贯彻四中全会精神 “十四五”能源高质量发展 热点推荐 集体涨停！核电板块爆发 7月省间中长期市场交易规模263亿千瓦时 蒙电入沪过江工程在上海开工 24.2%！上半年电力市场交易跑出“加速度” 全球电力需求加速增长 占比近九成！青海电力现货市场6月新能源唱主角 广东8月中长期交易综合价0.415元/千瓦时 福建抽水蓄能电量全部进入市场 相关链接 中国政府网 国家发改委 国家能源局 国家电网 南方电网 华能集团 大唐集团 华电集团 国电集团 国家电投 中国电建 中国能建 中核集团 中国石油 中国石化 中国海油 中国三峡 神华集团 国家开投 华润集团 中煤集团 中国广核 人民网 新华网 央视网 新浪 搜狐 消费日报 英大网 四川能投 国 &nbsp&nbsp&nbsp&nbsp家 &nbsp&nbsp&nbsp能&nbsp&nbsp&nbsp&nbsp 源&nbsp&nbsp&nbsp&nbsp 局&nbsp&nbsp&nbsp 主&nbsp&nbsp&nbsp&nbsp 管 中 &nbsp国 &nbsp能&nbsp 源&nbsp 传 &nbsp媒 &nbsp集&nbsp 团&nbsp 主&nbsp 办 无障碍阅读 | 意见建议 | 广告服务 | | 版权声明 | 我们的服务 | 联系我们 Copyright:copyright: 2001- 中国能源新闻网 版权所有 本网站所刊登的《中国电力报》、《中国能源观察》上的新闻，版权归中国能源传媒集团有限公司所有。未经授权，禁止下载使用。 国务院新闻办公室批准中国能源新闻网登载新闻业务的函：国新办发函[2000]232号。 京ICP备15017366号-1 《中华人民共和国电信与信息服务业务经营许可证》 编号：京ICP证090268号 京公网安备 11010202010453号 违法和不良信息举报电话：010-63414947 中华人民共和国互联网新闻信息服务许可证 编号：10120170021 互联网举报中心 广告直拨：赵飞 13511058150","publishedText":"2026-08-03T16:00:00.000Z","sourceName":"中国电力新闻网 (CPNN)"},{"title":"新型电力系统建设蓝图浮现 电网等领域投资机会释放","url":"https://www.cpnn.com.cn/news/dianli2023/202608/t20260804_1906215.html","summary":"国家能源局主管 中国能源传媒集团 中电传媒股份有限公司主办 投稿 登录 X 能源中国IOS版 能源中国安卓版 陇上孟河 X 首页 电力 新能源 油气 煤炭 企业 地方 科技 国际 人事 观点 观察 您的位置 > 首页 -> 电力 新型电力系统建设蓝图浮现 电网等领域投资机会释放 来源： 经济参考报 时间： 2026-08-04 15:03 记者8月3日获悉，国家发展改革委、国家能源局日前印发《新型电力系统建设“十五五”规划》（简称《规划》），提出到2030年初步建成新型电力系统，部署电力行业发展的主要目标、重大工程、重点任务，其中包括非化石能源发电量占比达到50%，实现28亿千瓦以上新能源高水平消纳，建成可支撑超过1.1亿辆电动汽车出行的充电基础设施网络等。 业内人士指出，“十五五”期间，电网、储能、充换电基础设施等“硬基建”投资空间将进一步打开，产业链相关企业将迎来长期确定性的成长红利。 “十四五”以来，我国已构建起全球最大、发展最快的可再生能源体系，形成了全球最大、最完整的新能源产业链。2026年上半年，全国可再生能源发电量占总发电量的比重首次超四成，煤电发电量占比则首次低于50%。 根据《规划》，到2030年，绿色低碳的电力供给格局基本形成，非化石能源发电量占比达到50%。《规划》还明确，优化新能源开发布局，全国新能源利用率保持在90%左右，支撑非化石能源消费比重目标。 随着新能源从“补充能源”走向“电量主体”，我国电力系统将迎来深刻变革。“《规划》把新型电力系统建设重点落在了电网形态、调节能力、算电协同、市场机制四大领域。”厦门大学中国能源经济研究中心教授孙传旺在接受《经济参考报》记者采访时表示。 优化全国电力流向布局、完善区域主网架结构、规划建设海上输电网络、多场景建设智能微电网、加强电动汽车充电基础设施网络建设……围绕“着力构建主配微协同的新型电网”，《规划》明确了一系列重点任务和目标。 其中包括，到2030年，西电东送规模超过4.2亿千瓦。开展“沙戈荒”等100%新能源外送输电工程试点；到2030年，充电基础设施总量超过4000万个，大功率充电设施约30万个，形成支撑超过1.1亿辆电动汽车的充电服务能力。 在重塑电网形态的同时，《规划》强调增强电力系统调节能力，“不仅明确了新型储能、抽水蓄能、虚拟电厂、车网互动、需求响应的发展规模目标，而且拓展了调节资源在电源协同运行、电网稳定支撑的应用领域，进一步构建多元调节生态。”孙传旺称。 以新型储能为例，“十五五”时期新增约1.6亿千瓦。到2030年，全国新型储能规模达到3亿千瓦，可承担顶峰保供作用的电网侧独立新型储能达到1.4亿千瓦。 此外，《规划》还提出“促进电力与算力协同发展”“协同规划布局算力、电力项目”“依托算力设施发展源网荷储一体化、绿电直连等新模式”等。 孙传旺预测，新型电网、储能产业等“硬基建”投资空间将进一步打开，算电协同将激励智算中心绿电直连、风光储算一体化等市场投资，而虚拟电厂与负荷聚合等“软基建”也具备广阔的市场拓展空间，待完全商业化模式形成后，将进入红利释放阶段。 国家能源局预计，“十五五”期间，我国能源重点项目和新业态投资规模将超过20万亿元。从最新数据来看，2026年上半年新型电网建设持续加快，电网、充换电基础设施、新型储能等领域成为主要投资增长点，同比分别增长13.5%、21.8%、74.3%。 相关企业也在加快布局。2026年上半年，国家电网公司完成固定资产投资超3100亿元，同比增长12.6%；南方电网公司累计完成固定资产投资892.62亿元，同比增长14.79%。 按照计划，“十五五”期间，国家电网公司固定资产投资预计达到4万亿元，较“十四五”期间投资增长40%，其中特高压在建总体规模超过“十三五”与“十四五”总和，电网建设进入全面提速、跨越升级的新阶段。而南方电网公司“十五五”投资规模将迈入万亿级别，预计带动上下游产业链投资2万亿元。 申港证券研报指出，“十五五”电网投资规模中枢将显著上移，为产业链相关企业打开了中长期成长空间。建议紧扣主网架及特高压核心重型设备、配网自动化与高能效终端、电力信息化与源网荷储协同软件三条主线进行战略布局。 实习编辑：王雪聪 中电专题 学习贯彻四中全会精神 “十四五”能源高质量发展 热点推荐 核电上下游企业加大投入迎规模化发展良机 集体涨停！核电板块爆发 7月省间中长期市场交易规模263亿千瓦时 蒙电入沪过江工程在上海开工 24.2%！上半年电力市场交易跑出“加速度” 全球电力需求加速增长 占比近九成！青海电力现货市场6月新能源唱主角 广东8月中长期交易综合价0.415元/千瓦时 相关链接 中国政府网 国家发改委 国家能源局 国家电网 南方电网 华能集团 大唐集团 华电集团 国电集团 国家电投 中国电建 中国能建 中核集团 中国石油 中国石化 中国海油 中国三峡 神华集团 国家开投 华润集团 中煤集团 中国广核 人民网 新华网 央视网 新浪 搜狐 消费日报 英大网 四川能投 国 &nbsp&nbsp&nbsp&nbsp家 &nbsp&nbsp&nbsp能&nbsp&nbsp&nbsp&nbsp 源&nbsp&nbsp&nbsp&nbsp 局&nbsp&nbsp&nbsp 主&nbsp&nbsp&nbsp&nbsp 管 中 &nbsp国 &nbsp能&nbsp 源&nbsp 传 &nbsp媒 &nbsp集&nbsp 团&nbsp 主&nbsp 办 无障碍阅读 | 意见建议 | 广告服务 | | 版权声明 | 我们的服务 | 联系我们 Copyright:copyright: 2001- 中国能源新闻网 版权所有 本网站所刊登的《中国电力报》、《中国能源观察》上 tility-scale and Commercial and Industrial (C&amp;I) applications.&nbsp; Over the past year, Pace Digitek has manufactured over 300 utility-scale BESS containers, representing approximately 1.5 GWh of battery energy storage capacity. The expansion to 5 GWh builds on this execution track record and strengthens the Company& ;s ability to support its growing BESS business in line with customer requirements and market opportunities.&nbsp; India& ;s battery energy storage market continues to expand, supported by increasing renewable energy deployment, grid balancing requirements and growing adoption across utility-scale and C&amp;I applications. As deployments scale, manufacturing capacity, execution capabilities and supply chain integration are becoming increasingly important.&nbsp; Commenting on the development, Venugopal Rao Maddisetty, Chairman and Managing Director, Pace Digitek, said, &ldquo;The commissioning of our additional 2.5 GWh manufacturing line builds on the progress we have made over the past year in building an integrated BESS business. During this period, we have strengthened our manufacturing capabilities, advanced localisation and enhanced execution across the value chain. With our installed manufacturing capacity now at 5 GWh, we can support our growing order book, project pipeline and product supplies while improving operational and cost efficiencies. We will continue investing in manufacturing, technology and product development to deliver reliable energy storage solutions to o","publishedText":"2026-08-04T07:20:18.000Z","sourceName":"Energetica India"},{"title":"New Nuclear Monday, 3 August 2026--> China approves construc…","url":"https://www.world-nuclear-news.org/articles/china-approves-construction-of-eight-more-reactors","summary":"HOME / NEW NUCLEAR China approves construction of eight more reactors Monday, 3 August 2026 The construction of three pairs of Hualong One (HPR1000) reactors at the Jinqimen, Taipingling and Zhuanghe sites, as well as two Guohe One (CAP1400) reactors at the Laiyang site was approved during a State Council executive meeting chaired by Chinese Premier Li Qiang on 31 July. &nbsp; How the new Zhuanghe plant could look with six units (Image: CNNC) The Phase II units (3 and 4) of China National Nuclear Corporation& ;s Jinqimen plant in Zhejiang Province and&nbsp;the Phase III units (5 and 6) of China General Nuclear& ;s Taipingling plant in Guangdong Province have been designated as demonstration projects of Hualong One 2.0. Hualong One 2.0 is described as &quot;an advanced pressurised water reactor (PWR) nuclear power technology combining third-generation and advanced technologies, developed through independent innovation and overall collaboration, based on feedback from the construction and operation experience of Hualong One&quot;. CNNC noted that, so far,&nbsp;10 Hualong One units are commercially operational both domestically and internationally, with another 37 units approved for construction. Read more:&nbsp; New Chinese reactors reach start-up milestones China National Nuclear Corporation (CNNC) said its subsidiaries, CNNC Datang Zhuanghe Nuclear Power Co Ltd and CNNC (Xiangshan) Nuclear Power Co Ltd, serve as the project owners for the respective approved Jinqimen and Zhuanghe projects and are responsible for project investment, construction, and operational management. &quot;Currently, preparatory work prior to the commencement of construction is proceeding steadily and in an orderly manner at the project sites,&quot; it said. Meanwhile, two larger Guohe One reactors - an enlarged version of the CAP1000 PWR developed from the Westinghouse AP1000 - will be built as the initial phase of State Power Investment Corporation& ;s&nbsp;Laiyang plant, which will eventually house six such units. State Power Investment Corporation is fully responsible for the investment, construction and operation of the Shandong Laiyang Nuclear Power Project. The company said this is &quot;the first standardised and batch-built project approved&quot; for the Guohe One technology. &quot;The meeting emphasised that nuclear power units must be constructed and operated in accordance with the highest global safety standards, that relevant entities must fulfil their primary responsibilities, and that safety supervision across the entire supply chain and all sectors must be strengthened to ensure absolute safety in nuclear power,&quot; the State Council said. Most Read Friday, 31 July 2026 --> Cameco announces IPO plan for Westinghouse Friday, 31 July 2026 Thursday, 30 July 2026 --> Danube's record low leads to Hungary, Romania nuclear shutdowns Thursday, 30 July 2026 Tuesday, 28 July 2026 --> Initiative launched to bolster Italian nuclear supply chain Tuesday, 28 July","publishedText":"2026-08-03T08:15:26.000Z","sourceName":"World Nuclear News"},{"title":"Corporate Tuesday, 4 August 2026--> BWXT sells medical busin…","url":"https://www.world-nuclear-news.org/articles/bwxt-sells-medical-business-for-usd800-million","summary":"HOME / CORPORATE BWXT sells medical business for USD800 million Tuesday, 4 August 2026 BWX Technologies is to sell its medical division, which includes BWXT Medical and Kinectrics&rsquo; stable medical isotopes business, to Nordic Capital. &nbsp; (Image: BWXT Medical) BWX Technologies (BWXT) says the sale will enable it &quot;to concentrate resources and capital on accelerating growth in its core nuclear national security and commercial nuclear power markets, areas central to the company&rsquo;s long-term strategy&quot;. It says it will retain a minority share in the medical business and continue to provide specialised isotope and radiochemical expertise, but expects that under Sweden-based private equity firm Nordic Capital it will be &quot;well-positioned to scale, expand capabilities and advance its market presence in radiopharmaceuticals, including developing, manufacturing and delivering products for diagnostic imaging and radiotherapeutic treatments&quot;. BWXT Medical employs 300 people in&nbsp;Ottawa and Vancouver in Canada. BWXT acquired Toronto-headquartered Kinectrics in January 2025 for USD525 million. Kinectrics&nbsp;operates two core business areas: commercial power services and nuclear medicine. Its commercial nuclear services portfolio includes support for all stages of the nuclear power plant lifecycle and other areas of the related grid ecosystem.&nbsp;It produces ytterbium-176, a stable isotope used for the production of non-carrier-added lutetium-177 through irradiation at the Bruce nuclear power plant. Rex D Geveden, BWXT CEO and president, said: &quot;Since acquiring the medical business in 2018, we have roughly tripled revenue, improved profitability and significantly expanded the product portfolio, including novel therapeutic isotopes. As the business enters its next phase, this transaction provides an opportunity for the medical team to grow under an owner deeply committed to the healthcare sector, as we concentrate management resources and capital on our core businesses in nuclear national security and nuclear power.&quot; Christian Hedegaard, partner, Nordic Capital Advisors, said: &quot;We are excited about the next step as Nordic Capital sees significant potential to scale the business and expand access to cutting-edge radiopharmaceutical therapy.&quot; The transaction, which is subject to regulatory approvals, is expected to close before the end of the year. BWXT& ;s nuclear operations cover a wide range of activities, including powering US navy submarines, manufacturing heavy nuclear components, developing advanced reactor fuels, small&nbsp;modular reactors, and also advanced nuclear systems for use on space missions by NASA. Most Read Friday, 31 July 2026 --> Cameco announces IPO plan for Westinghouse Friday, 31 July 2026 Thursday, 30 July 2026 --> Danube's record low leads to Hungary, Romania nuclear shutdowns Thursday, 30 July 2026 Tuesday, 28 July 2026 --> Initiative launched to bolster Italian nuclear supply","publishedText":"2026-08-04T03:17:58.000Z","sourceName":"World Nuclear News"},{"title":"Corporate Tuesday, 4 August 2026--> Westinghouse and Amentum…","url":"https://www.world-nuclear-news.org/articles/westinghouse-and-amentum-sign-ap1000ap300-collaboration_agreements","summary":"HOME / CORPORATE Westinghouse and Amentum sign AP1000/AP300 collaboration agreements Tuesday, 4 August 2026 A series of agreements between Westinghouse Electric Company and Amentum aims to support the fleet-scale deployment of the AP1000 reactor and to collaborate on gaining regulatory approval of the AP300 small modular reactor. &nbsp; Gaining regulatory approval for the AP300 is a key part of the agreement (Image: Westinghouse) The Westinghouse APX strategy aims to offer a single technology platform for its AP1000 reactors and for its SMR version, the AP300. The idea is for the smaller version to benefit from the experience and licensed technology from the larger units, some of which are already in operation. Dan Sumner, President and CEO of Westinghouse, said: &quot;We continue to make investments to strengthen our proven APX platform, and our ongoing collaboration with Amentum is expected to accelerate the licensing of the AP300 SMR with the NRC. Separately, our two companies will work together to enhance our engineering and execution capabilities for delivering 1 GW reactors at scale.&quot; John Heller, CEO of Amentum, said: &quot;Amentum& ;s expertise spans the full spectrum of the nuclear project lifecycle, accelerating the development and deployment of advanced nuclear solutions, strengthening energy security and powering the growth of AI and other energy critical industries. There is an expanding global market for firm baseload power, and our collaboration with Westinghouse will enable us to help meet that demand.&quot; The two companies have worked together on a range of nuclear energy projects in the US and Europe and they say that under the most recent agreement, they &quot;will collaborate to obtain regulatory approval for the AP300 SMR by the US&nbsp;Nuclear Regulatory Commission&quot;. Westinghouse, which supplied the world& ;s first commercial pressurised water reactor in 1957 in Shippingport, Pennsylvania, is one of the world& ;s largest nuclear services businesses. Last week it filed a draft registration statement for a potential IPO, a listing of its shares. Its co-owner Cameco says Westinghouse has a pipeline of deployment opportunities for 91 potential AP1000 reactors totalling some 105 GWe across its global markets, including, in the USA, up to 10 units supported through American Nuclear Supply Chain Loans announced by the US Department of Energy earlier this year, with a commercial operation timeframe by the mid-2030s; up to 10 further US units supported through the strategic partnership between Cameco, Brookfield and the US Department of Commerce announced in 2025, for commercial operation by the mid-to-late 2030s; the resumption of the two-unit VC Summer project, for commercial operation by the early-mid 2030s. The AP300 SMR was unveiled in 2023. Westinghouse said at its launch that it was based on the licensed and operating AP1000 pressurised light water technology, &nbsp;including &quot;major equipment, structural","publishedText":"2026-08-04T04:13:09.000Z","sourceName":"World Nuclear News"}]},{"label":"科技","items":[{"title":"Uranium &amp; Fuel Tuesday, 4 August 2026--> Mid-year update…","url":"https://www.world-nuclear-news.org/articles/mid-year-updates-from-major-uranium-producers","summary":"HOME / URANIUM &amp; FUEL Mid-year updates from major uranium producers Tuesday, 4 August 2026 Kazatomprom& ;s uranium production in the first half of 2026 was higher than the same period in 2025. Cameco& ;s uranium production was impacted by logistical challenges earlier in the year. But both companies say they are on track to meet their 2026 production targets. &nbsp; (Image: KAza Kazakhstan& ;s national atomic company said its production on both a 100% basis (that is, the entirety of production of the entities in which the company has an interest) and attributable basis (that is, Kazatomprom& ;s share of the total production once joint venture partners and other third-party shareholders have been accounted for) was higher in the first half of 2026 compared with the same period in 2025, due to a higher 2026 production plan, in line with its guidance and Subsoil Use Agreements&rsquo; requirements for the year. Kazatomprom& ;s production of 13,291 tonnes of uranium (tU) on a 100% basis was 9% up on the 12,242 tU produced in the same period in 2025. First-half 2026 sales volumes &quot;closely aligned with results from the corresponding period last year, reflecting stable overall performance&quot;, the company said in its second quarter operations and trading update, released on 3 August, although it noted that sales volumes can vary substantially each quarter, and quarterly sales volumes vary from year to year. &quot;At this time, the Company reiterates its 2026 guidance in relation to production and sales volumes,&quot; Kazatomprom said. The company previously set its 2026 production guidance at 27,500-29,000 tU (on a 100% basis). In its second quarter results last week, Canadian nuclear company Cameco said its production outlook also unchanged, despite uranium production being impacted by &quot;challenging spring road conditions&quot; along supply routes in northern Saskatchewan: in May, flooding caused the collapse a bridge on the primary route used to transport supplies to the McArthur River and Key Lake sites, resulting in a temporary suspension of production at Key Lake and reduced mining activity at McArthur River for about two weeks. Total production from Cameco& ;s operations in Canada - Cigar Lake and McArthur River/Key Lake - for the first half of the year was 10.1 million pounds U3O8 (3885 tU) (Cameco& ;s share), 5% down from the same period in 2025. Production at JV Inkai in Kazakhstan - a joint venture of Cameco and Kazatomprom - was 5.3 million pounds U3O8 for the first half of the year (on 1 100% basis), and JV Inkai remains on track to produce 10.4 million pounds U3O8 (100% basis) in 2026. Of that, Cameco& ;s purchase allocation is expected to be 4.2 million pounds U3O8: 0.8 million pounds were delivered in the first half of the year, and the majority of Cameco& ;s share of 2026 production is expected to be received before the end of 2026, the company said. Cameco& ;s uranium inventory stood at 8.7 million poun","publishedText":"2026-08-04T03:24:43.000Z","sourceName":"World Nuclear News"},{"title":"News &amp; Events","url":"https://www.khi.co.jp/en/corp/newsroom/index.html","summary":"News &amp; Events News Aug. 03, 2026 Kawasaki Reaches Settlement Agreement with RORZE Concerning Patent Infringement Litigation Jul. 30, 2026 Bulk Carrier ARISTOS II Delivered Jul. 16, 2026 Kawasaki Begins Business Study with Fujitsu Toward the Social Implementation of Physical AI ― Aiming to Provide New Solutions in the Healthcare Field ... Jul. 16, 2026 Kawasaki Launches Collaboration with NVIDIA to Realize a “Next-Generation Digital Shipyard” — Leveraging AI and Digital Twin Technology to Advance DX... Jul. 14, 2026 Notice Regarding Determination of the Issue Price and Other Matters for the Issuance of New Shares and Terms and Other Matters for the Issuance of Zer... (PDF:189.6K ) Jul. 09, 2026 Medicaroid Obtains CE Marking Under the MDR for the hinotori™ Surgical Robot System（Medicaroid） Jul. 02, 2026 Notice Regarding Issuance of New Shares and Issuance of Zero Coupon Convertible Bonds due 2031 and Zero Coupon Convertible Bonds due 2033(Transition C... (PDF:196.4K ) Jul. 01, 2026 Notice Regarding Media Reports on Financing (PDF:129.1K ) PRESS RELEASE SEE ALL Events SCHEDULE --> Contact If you need more information about our business, please feel free to contact us. CONTACT","publishedText":"2026-08-02T16:00:00.000Z","sourceName":"Kawasaki Heavy Industries"},{"title":"Jul. 30, 2026 Bulk Carrier ARISTOS II Delivered","url":"https://www.khi.co.jp/en/corp/newsroom/news/detail/?f=20260730_9070","summary":"Bulk Carrier ARISTOS II Delivered Jul. 30, 2026 Tokyo, July 30, 2026 — Kawasaki Heavy Industries, Ltd. announced that it delivered the bulk carrier ARISTOS II , with a capacity of 82,000 DWT (Kawasaki hull No. 8108, DACKS hull No. 169) for SANTA MARINE INC. at Dalian COSCO KHI Ship Engineering Co., Ltd. (DACKS), which is located in Dalian, China and operated jointly with China COSCO Shipping Corporation Limited (China COSCO Shipping). Principal particulars and features of the vessel are as described below. Principal Particulars Length overall 228.90 m Molded breadth 32.24 m Molded depth 20.20 m Molded draft 14.55 m Gross tonnage 44,139 T Deadweight 82,766 t Hold capacity 98,269.9 m 3 Main engine One set of MAN B&amp;W 6S50ME-C9.7-HPSCR diesel engine Speed Approx. 14.2 knots Complement 25 people Classification ClassNK Country of registration Panama Delivery July 30, 2026 Features The vessel has a flush deck with a forecastle and seven holds that are capable of carrying cargo such as grain, coal and ore. The vessel employs various technologies to achieve maximum fuel economy, including an energy-saving, electronically controlled main diesel engine, high propulsive efficiency propellers, the Kawasaki rudder bulb system with fins, and the semi-duct system with contra fins, achieving a reduction equivalent to the IMO’s Energy Efficiency Design Index (EEDI)* 1 Phase 3 regulations (30% reduction in CO 2 emissions from the baseline). *1&nbsp;&nbsp;&nbsp;&nbsp; Energy Efficiency Design Index (EEDI) regulation: An international regulation that enforces compliance of newly-constructed vessels with energy-saving performance regulation values using the Energy Efficiency Design Index (EEDI), which is defined as the number of grams of CO 2 emitted when transporting one ton of cargo over one mile. Required EEDI regulation values are made stricter in phases according to the construction contract and delivery dates. For bulk carriers, compliance with Phase 2 set in 2013 (20% reduction in CO 2 emissions from the baseline [Phase 0]) is required for vessels contracted for construction in 2020 and later. In addition, compliance with Phase 3 (30% reduction in CO 2 emissions from the baseline [Phase 0]) is required for vessels contracted for construction in 2025 and later. Contact If you need more information about our business, please feel free to contact us. CONTACT News &amp; Events News Press Release Events","publishedText":"2026-07-29T16:00:00.000Z","sourceName":"Kawasaki Heavy Industries"},{"title":"Aug. 03, 2026 Kawasaki Reaches Settlement Agreement with ROR…","url":"https://www.khi.co.jp/en/corp/newsroom/news/detail/?f=20260803_8651","summary":"Kawasaki Reaches Settlement Agreement with RORZE Concerning Patent Infringement Litigation Aug. 03, 2026 Kawasaki Heavy Industries, Ltd. entered into a settlement agreement on August 3, 2026, with RORZE CORPORATION and its U.S. subsidiary, Rorze Automation, Inc. (collectively, “RORZE”), resolving the patent infringement litigation concerning U.S. patents related to semiconductor wafer handling equipment technology filed by Kawasaki against RORZE in the United States on August 30, 2022. The pending patent infringement litigation will be dismissed pursuant to the settlement agreement. Details of the settlement agreement are not disclosed due to confidentiality obligations between the parties. Kawasaki will continue to regard intellectual property rights as an important management asset and remain committed to enhancing corporate value through the appropriate protection and utilization of its intellectual property. Contact If you need more information about our business, please feel free to contact us. CONTACT News &amp; Events News Press Release Events","publishedText":"2026-08-02T16:00:00.000Z","sourceName":"Kawasaki Heavy Industries"},{"title":"PM_INNIO_Erhält EcoVadis-Platinmedaille","url":"https://www.innio.com/en/news-media/media-center/others/pm_innio_erhalt-ecovadis-platinmedaille/","summary":"AI","publishedText":"Mon, 03 Aug 2026 13:12:14 +0000","sourceName":"INNIO (Jenbacher/Waukesha)"}]},{"label":"财经","items":[{"title":"BikeWo Green Tech Signs MoU to Acquire Majority Stake in ENl…","url":"https://www.energetica-india.net/news/bikewo-green-tech-signs-mou-to-acquire-majority-stake-in-enlite-ev-care","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition July-August 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Business &rsaquo;BikeWo Green Tech Signs MoU to Acquire Majority Stake in ENlite EV Care BikeWo Green Tech Signs MoU to Acquire Majority Stake in ENlite EV Care BikeWo Green Tech plans to acquire a majority stake in ENlite EV Care to establish a network of technology-enabled EV Care Centres, enhancing maintenance, fleet uptime and lifecycle management for India& ;s growing commercial EV market. August 04, 2026. By News Bureau BikeWo Green Tech has signed a Memorandum of Understanding (MoU) to acquire a majority stake in ENlite EV Care, an electric vehicle service and maintenance company. The proposed acquisition marks a step towards expanding BikeWo& ;s integrated electric mobility ecosystem by adding organised vehicle servicing, maintenance and lifecycle support to its growing portfolio. As electric vehicle adoption gains momentum across commercial segments such as last-mile delivery, logistics and fleet mobility, dependable after-sales infrastructure has become increasingly critical for ensuring vehicle availability and operational efficiency. Through the proposed acquisition, BikeWo intends to establish a network of EV Care Centres dedicated primarily to B2B customers and commercial electric vehicle fleets. The proposed EV Care Centres will provide a suite of services, including preventive maintenance, diagnostics, repairs, battery and electrical system support, periodic servicing and fleet uptime management. The initiative is expected to help fleet operators minimise downtime, improve vehicle performance and optimise operating costs through reliable and technology-enabled service support. BikeWo and ENlite EV Care also plan to jointly evaluate suitable locations and operating models for the proposed EV Care Centres. The companies intend to integrate digital capabilities such as vehicle health monitoring, predictive maintenance, service scheduling, digital maintenance records and fleet performance tracking to create a more efficient and data-driven service ecosystem. Commenting on the development, Hiten Pal Saklani, Chief Executive Officer, BikeWo Green Tech, said, &quot;As we prepare to scale our electric mobility operations, building a dependable service and maintenance ecosystem is equally important as expanding vehicle deployment. The proposed acquisition of ENlite EV Care represents a strategic step towards strengthening our capabilities across the EV value chain. By integrating vehicle maintenance and lifecycle support into our mobility platform, we aim to improve fleet uptime, enhance service quality and deliver greater operational efficiency for commercial fleet operators. We believe this capability will further strengthen BikeWo& ;s vision of building a comprehensive and","publishedText":"2026-08-04T06:49:10.000Z","sourceName":"Energetica India"},{"title":"Prysmian announces $3.8bn acquisition of Atkore","url":"https://www.power-technology.com/news/prysmian-announces-acquisition-atkore/","summary":"Prysmian Group has signed a definitive merger agreement to acquire US-based Atkore for €3.3bn ($3.8bn).","publishedText":"Tue, 04 Aug 2026 07:46:01 +0000","sourceName":"Power Technology"}]}]};

const PALETTE = ["#818cf8","#34d399","#fbbf24","#fb7185","#22d3ee","#a78bfa","#f472b6","#4ade80","#60a5fa","#facc15"];
const DEFAULT_COLOR = "#94a3b8";
const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];

function pad(n){return n<10?"0"+n:""+n;}
function fmtDateHuman(s){
  if(!s) return "—";
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(m){ const d=new Date(+m[1], +m[2]-1, +m[3]); return `${m[1]}年${+m[2]}月${+m[3]}日 ${WEEK[d.getDay()]}`; }
  return s;
}
function fmtWhen(s){
  if(!s) return "";
  // 已是相对描述（如 "5 天前"）直接清理尾部的 "•"
  let t = String(s).replace(/•/g,"").replace(/\s+/g," ").trim();
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t);
  if(m){ const d=new Date(+m[1], +m[2]-1, +m[3]); return `${m[1]}年${+m[2]}月${+m[3]}日`; }
  return t;
}
function truncate(s,n){
  const arr=[...(s||"")];
  return arr.length>n ? arr.slice(0,n).join("")+"…" : s;
}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(data){
  const secs = data.sections||[];
  const date = data.date || "";
  document.getElementById("dateBig").textContent = fmtDateHuman(date);
  document.getElementById("windowLine").textContent = data.windowText || "";

  let total=0; secs.forEach(s=>total+=(s.items?s.items.length:0));
  document.getElementById("totalNum").textContent = total;

  const chips=document.getElementById("secChips"), nav=document.getElementById("nav");
  chips.innerHTML=""; nav.querySelectorAll("a:not(.totop)").forEach(a=>a.remove());

  secs.forEach((s,idx)=>{
    const col=PALETTE[idx%PALETTE.length];
    const n=(s.items?s.items.length:0);
    const chip=document.createElement("div");
    chip.className="sec-chip";
    chip.innerHTML=`<span class="dot" style="background:${col}"></span>${esc(s.label)} <b>${n}</b>`;
    chip.onclick=()=>document.getElementById("sec-"+idx).scrollIntoView();
    chips.appendChild(chip);
    const link=document.createElement("a");
    link.href="#sec-"+idx; link.textContent=s.label;
    nav.insertBefore(link,nav.querySelector(".totop"));
  });

  const wrap=document.getElementById("sections");
  wrap.innerHTML="";
  let counter=0;
  secs.forEach((s,idx)=>{
    const col=PALETTE[idx%PALETTE.length];
    const sec=document.createElement("section");
    sec.className="section"; sec.id="sec-"+idx; sec.style.setProperty("--sec",col);
    const items=s.items||[];
    sec.innerHTML=`<div class="section-head"><span class="bar"></span><h2>${esc(s.label)}</h2>`
      +`<span class="cnt">${items.length} 条</span></div>`;
    const grid=document.createElement("div"); grid.className="grid";
    items.forEach(it=>{
      counter++;
      const url=it.url||"#";
      const src=it.sourceName||"未知来源";
      const sum=truncate(it.summary,60);
      const card=document.createElement("article");
      card.className="card"; card.style.setProperty("--sec",col);
      card.innerHTML=
        `<div class="top"><span class="num">${counter}</span>`
        +`<span class="src" title="${esc(src)}">${esc(src)}</span></div>`
        +`<h3><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(it.title||"")}</a></h3>`
        +`<p class="sum">${esc(sum)}</p>`
        +`<div class="foot"><a class="read" href="${esc(url)}" target="_blank" rel="noopener noreferrer">查看原文 ↗</a>`
        +`<span class="when">${esc(fmtWhen(it.publishedText))}</span></div>`;
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    wrap.appendChild(sec);
  });

  if(!secs.length){
    wrap.innerHTML=`<div class="empty">本窗口内暂无采集内容。</div>`;
  }

  const srcList=(data.sources||[]).map(s=>`<b>${esc(s)}</b>`).join("、");
  document.getElementById("footer").innerHTML=
    `总条数 <b>${total}</b> 条 · 数据来源 ${srcList||"—"}`
    +` · 报告日期 ${esc(date)} <span class="badge snap">引擎快照</span><br>`
    +`本仪表盘由 source-collection-engine 渲染：每日仅需重跑流水线即可复用同一版式。`;
}

render(EMBEDDED_DATA);
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资讯日报 · {DATE_LABEL}</title>
<style>
  :root{
    --bg:#0f1117; --bg-soft:#171a22; --card:#1b1f29; --card-hover:#222736;
    --text:#e8eaf0; --muted:#9aa3b6; --border:#2a2f3c; --shadow:0 6px 24px rgba(0,0,0,.38);
    --hero-grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 45%,#db2777 100%);
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6fb; --bg-soft:#ffffff; --card:#ffffff; --card-hover:#f1f3fa;
      --text:#171a22; --muted:#5b6573; --border:#e7eaf2; --shadow:0 6px 22px rgba(30,40,80,.10);
      --hero-grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 45%,#ec4899 100%); }
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}

  /* ---------- HERO ---------- */
  .hero{background:var(--hero-grad);color:#fff;padding:38px 22px 30px;text-align:center;position:relative;overflow:hidden;}
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% -20%,rgba(255,255,255,.18),transparent 60%);pointer-events:none;}
  .hero .kicker{font-size:13px;letter-spacing:.32em;text-transform:uppercase;opacity:.85;margin:0 0 6px;}
  .hero h1{margin:0;font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:.02em;}
  .hero .date-big{font-size:clamp(20px,4vw,30px);font-weight:700;margin:14px 0 2px;}
  .hero .window{font-size:14px;opacity:.92;margin:0 0 18px;}
  .stat-total{display:inline-flex;align-items:baseline;gap:8px;background:rgba(255,255,255,.16);
    backdrop-filter:blur(6px);padding:8px 18px;border-radius:999px;font-size:15px;margin-bottom:20px;}
  .stat-total b{font-size:24px;font-weight:800;}
  .sec-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:920px;margin:0 auto;}
  .sec-chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.22);padding:6px 13px;border-radius:999px;font-size:13px;cursor:pointer;transition:.15s;}
  .sec-chip:hover{background:rgba(255,255,255,.26);}
  .sec-chip .dot{width:9px;height:9px;border-radius:50%;}
  .sec-chip b{font-weight:700;}

  /* ---------- ANCHOR NAV ---------- */
  .nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;gap:6px;
    padding:10px 14px;overflow-x:auto;scrollbar-width:none;}
  .nav::-webkit-scrollbar{display:none;}
  .nav a{flex:0 0 auto;font-size:13.5px;color:var(--muted);padding:7px 12px;border-radius:9px;
    border:1px solid transparent;white-space:nowrap;transition:.15s;}
  .nav a:hover{color:var(--text);background:var(--card-hover);border-color:var(--border);}
  .nav .totop{margin-left:auto;color:var(--muted);}

  /* ---------- SECTIONS ---------- */
  main{max-width:1180px;margin:0 auto;padding:26px 16px 60px;}
  .section{margin:30px 0 8px;scroll-margin-top:64px;}
  .section-head{display:flex;align-items:center;gap:12px;margin:0 0 16px;}
  .section-head .bar{width:5px;height:26px;border-radius:3px;background:var(--sec);}
  .section-head h2{margin:0;font-size:20px;font-weight:800;}
  .section-head .cnt{margin-left:auto;font-size:13px;color:var(--muted);background:var(--card);
    border:1px solid var(--border);padding:3px 11px;border-radius:999px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:16px 16px 14px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;transition:.18s;position:relative;overflow:hidden;}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sec);opacity:.85;}
  .card:hover{transform:translateY(-3px);background:var(--card-hover);}
  .card .top{display:flex;align-items:center;gap:10px;}
  .num{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--sec);color:#fff;
    font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .src{margin-left:auto;font-size:12px;color:var(--muted);background:var(--bg-soft);
    border:1px solid var(--border);padding:3px 10px;border-radius:999px;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card h3{margin:2px 0 0;font-size:16px;font-weight:700;line-height:1.45;}
  .card h3 a:hover{text-decoration:underline;text-decoration-color:var(--sec);}
  .card .sum{margin:0;font-size:14px;color:var(--muted);flex:1;}
  .card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;}
  .card .read{font-size:13px;font-weight:600;color:var(--sec);display:inline-flex;align-items:center;gap:4px;}
  .card .read:hover{text-decoration:underline;}
  .card .when{font-size:12px;color:var(--muted);}

  footer{max-width:1180px;margin:0 auto;padding:22px 16px 50px;color:var(--muted);font-size:13px;
    border-top:1px solid var(--border);text-align:center;line-height:1.8;}
  footer a{color:var(--sec);}
  .badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--border);
    margin-left:6px;vertical-align:middle;}
  .badge.snap{color:#fbbf24;border-color:#fbbf2466;background:#fbbf2414;}
  .empty{padding:40px;text-align:center;color:var(--muted);}
</style>
</head>

const EMBEDDED_DATA = {"date":"2026-08-08","period":"daily","windowText":"当日（北京时间）","sources":["BloombergNEF","Energetica India","World Nuclear News","Modern Power Systems","Rolls-Royce Power Systems (mtu)","Harvard Business Review","BCG Insights","Ansaldo Energia","Siemens Energy"],"sections":[{"label":"战略管理","items":[{"title":"International Solar Alliance Invites Bids for Rajasthan Ener…","url":"https://www.energetica-india.net/news/international-solar-alliance-invites-bids-for-rajasthan-energy-transition-planning-project","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition July-August 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Business &rsaquo;International Solar Alliance Invites Bids for Rajasthan Energy Transition Planning Project International Solar Alliance Invites Bids for Rajasthan Energy Transition Planning Project ISA has invited bids to prepare Rajasthan& ;s energy transition plan, focusing on renewable energy, grid modernisation, storage integration and investment strategies. August 07, 2026. By EI News Network The International Solar Alliance (ISA) has invited Request for P roposals from eligible consulting firms and consortiums to support the Government of Rajasthan in preparing a comprehensive Energy Transition Planning (ETP) framework aimed at strengthening the state& ;s long term energy security and clean energy development. According to the Request for Proposal (RFP), the assignment follows a Framework for Action signed between the Energy Department, Government of Rajasthan, and ISA on July 8, 2026. The initiative will be implemented under the supervision of the State Energy Transition Committee constituted by the Rajasthan government. The proposed planning exercise will develop an integrated framework covering renewable energy, grid infrastructure, energy storage, energy efficiency and financing pathways to support the state& ;s energy transition objectives. ISA said Rajasthan has been selected for the engagement owing to its leadership in renewable energy deployment, supportive policy environment and active participation of state agencies in clean energy initiatives. The RFP notes that the state had an installed renewable energy capacity of about 43.8 GW as of January 2026, including more than 22.8 GW of solar and around 5.2 GW of wind capacity. It also highlights Rajasthan& ;s targets of achieving 90 GW of renewable energy capacity by 2030 under the Rajasthan Renewable Energy Policy 2023 and nearly 125 GW by 2029-30 under the Rajasthan Integrated Clean Energy Policy 2024. The selected agency will be responsible for preparing an integrated energy transition strategy by supporting renewable energy deployment, transmission and distribution planning, storage integration, demand side interventions and investment mobilisation. The exercise is also expected to identify implementation ready projects and strengthen coordination among government departments, utilities and other stakeholders. The procurement will follow a combined technical and financial evaluation method, with technical proposals carrying a weightage of 70 percent and financial proposals 30 percent. Bidders must secure a minimum technical score of 70 out of 100 to qualify for financial evaluation. Technical assessment will consider methodology, integrated energy planning and modelling experience, capability to develop detailed","publishedText":"2026-08-07T09:06:27.000Z","sourceName":"Energetica India"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/harvard-business-review/posts/?feedView=all","summary":"Journalist Josh Tyrangiel says one of the biggest mistakes companies make is treating AI as one big, vague initiative. His advice: get specific. Stop referring to AI as a single thing—it's a whole range of different techniques, and your team needs to know which ones apply to which problems. Look at where \"code\" already lives in your business and start there. Check your data. Is it clean enough to work with, or does it need cleanup first? The companies getting real value share one habit: they ask precise questions about specific problems. Listen to the full episode wherever you get your podcasts, or visit here: https://s.hbr.org/4fHBKQk","publishedText":"2026-08-07T15:03:51.550Z","sourceName":"Harvard Business Review"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/harvard-business-review/posts/?feedView=all","summary":"Strengthen how you navigate uncertainty with deeper perspective and context. Learn more about HBR Executive. https://s.hbr.org/4qMlvEq","publishedText":"2026-08-07T03:03:51.550Z","sourceName":"Harvard Business Review"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/harvard-business-review/posts/?feedView=all","summary":"Understand decisions in the full context they were made—available with Premium and HBR Executive access. Explore HBS Case Selections. https://lnkd.in/eQ7EMHNE","publishedText":"2026-08-07T14:03:51.550Z","sourceName":"Harvard Business Review"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/boston-consulting-group/posts/?feedView=all","summary":"It’s easy to underestimate the impact GLP-1 drugs have had on consumer spending habits. When someone loses weight, they not only eat differently but also want to buy new clothes, spend more on beauty, or get into personal fitness. Less understood is that the changes in spending habits typically involve not just the person taking the drug but other people in their household. And those new spending habits often persist even after the course of medication has ended. BCG's Center for Customer Insight surveyed more than 1,500 GLP-1 users across nine markets to map where the demand has shifted. It discovered that the addressable market is roughly 50% larger than active users alone. Explore the findings and the four moves consumer companies should make in response. https://on.bcg.com/4fFsVqe","publishedText":"2026-08-07T03:03:30.169Z","sourceName":"BCG Insights"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/boston-consulting-group/posts/?feedView=all","summary":"【AIエージェントは、「あなたの会社らしく」ふるまえていますか？】 AIエージェントが顧客対応を担う場面が増える中、企業の価値観や文化を反映したふるまいが、ブランドの差別化につながります。 https://lnkd.in/dRN-K8dX 例えば、「返品期限を過ぎたお客さまの問い合わせへの対応」。 同じAIモデルを使っていても、ある企業は規定どおりに断り、別の企業は顧客との長年の関係を踏まえて柔軟な対応を提案する──。顧客が受ける印象は大きく変わります。 BCG Xの高柳慎一(Shinichi Takayanagi, Ph.D.)が、「企業版アライメント問題」を切り口に、AIエージェント時代に求められる「企業らしさ」と、その実現の鍵を解説します。 エージェント","publishedText":"2026-08-07T03:03:30.169Z","sourceName":"BCG Insights"},{"title":"LinkedIn 动态","url":"https://www.linkedin.com/company/boston-consulting-group/posts/?feedView=all","summary":"Leaders investing in AI commit more than double what laggards spend, and the advantage compounds every year. The gap isn't about bigger budgets so much as greater conviction. Leaders fund transformation, not just tools. Caution has become the more expensive strategy. Read more here: https://on.bcg.com/4wfbrGm","publishedText":"2026-08-07T13:03:30.169Z","sourceName":"BCG Insights"}]},{"label":"产业链","items":[{"title":"MNRE Issues Branding Guidelines for PM Surya Ghar Rooftop So…","url":"https://www.energetica-india.net/news/mnre-issues-branding-guidelines-for-pm-surya-ghar-rooftop-solar-installations","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition July-August 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Policies &amp; Regulations &rsaquo;MNRE Issues Branding Guidelines for PM Surya Ghar Rooftop Solar Installations MNRE Issues Branding Guidelines for PM Surya Ghar Rooftop Solar Installations The Ministry of New and Renewable Energy has issued guidelines establishing a standardised branding framework for the placement of the PM Surya Ghar: Muft Bijli Yojana logo on rooftop solar installations to ensure uniform identification, visibility and traceability of systems installed under the scheme. August 04, 2026. By Mrinmoy Dey The Ministry of New and Renewable Energy (MNRE) has introduced a standardised branding framework for the placement of the PM Surya Ghar: Muft Bijli Yojana (PMSG: MBY) logo on rooftop solar (RTS) installations across the country. The guidelines will apply to installations executed under both the regular CAPEX and Utility Led Aggregation (ULA) modes of the scheme. &nbsp; MNRE said that the initiative is aimed at ensuring uniform identification, visibility and recognition of rooftop solar systems installed under PM Surya Ghar Yojana, which has been under implementation since February 2024 with the objective of installing rooftop solar systems in one crore residential households by FY 2026-27. The ministry has also made the official PMSG: MBY logo available for download through the scheme& ;s National Portal under the Vendor section. &nbsp; The Office Memorandum has been circulated to all State and Union Territory energy departments, DISCOMs, State Nodal Agencies, registered vendors under the scheme, and manufacturers of solar PV modules and solar inverters, requesting them to ensure compliance with the new branding requirements. REC, serving as the National Programme Implementation Agency (NPIA), has also been directed to facilitate implementation of the guidelines. &nbsp; According to the guidelines, the branding framework seeks to establish a consistent, identifiable and traceable identity for rooftop solar and ULA installations implemented under PM Surya Ghar while maintaining operational integrity. It also aims to promote uniformity across installations undertaken by different vendors under the supervision of DISCOMs in all States and Union Territories. The provisions are applicable to solar PV modules, solar inverters, AC distribution boxes (ACDBs) and any other related equipment or components installed under the scheme. &nbsp; The ministry has specified the exact placement of the PMSG: MBY logo on different system components. For solar PV modules, a 25 mm &times; 25 mm logo sticker must be affixed on the lower right-hand corner of the front-facing module frame, with a minimum of one sticker per kilowatt of installed capacity, while ensuring that OEM labels, serial nu","publishedText":"2026-08-04T03:56:39.000Z","sourceName":"Energetica India"},{"title":"Cabinet Approves INR 23,731 Crore GOBARdhan Scheme to Boost …","url":"https://www.energetica-india.net/news/cabinet-approves-inr-23731-crore-gobardhan-scheme-to-boost-india-cbg-production","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition July-August 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Policies &amp; Regulations &rsaquo;Cabinet Approves INR 23,731 Crore GOBARdhan Scheme to Boost India& ;s CBG Production Cabinet Approves INR 23,731 Crore GOBARdhan Scheme to Boost India& ;s CBG Production The Union Cabinet has approved the INR 23,731 crore GOBARdhan National Circular Bioenergy Scheme for implementation from FY 2026-27 to FY 2035-36, targeting nearly ten-fold growth in domestic compressed biogas production through an integrated policy framework. August 07, 2026. By Mrinmoy Dey The Union Cabinet, chaired by Prime Minister Narendra Modi, has approved the GOBARdhan (Galvanising Organic Bio-Agro Resources Dhan) National Circular Bioenergy Scheme with a total outlay of INR 23,731 crore. &nbsp; The scheme, to be implemented from FY 2026-27 to FY 2035-36, aims to transform agricultural residue, cattle dung, press mud, municipal organic waste and other biomass resources into compressed biogas (CBG), organic manure and rural income, while establishing CBG as a major component of India& ;s clean energy mix. &nbsp; Administered by the Ministry of Petroleum and Natural Gas, the scheme seeks to increase domestic CBG production nearly ten-fold by providing an integrated framework covering the entire value chain. It brings together assured offtake, stable pricing, capital assistance, pipeline infrastructure, credit support and technology development to improve project viability, attract private investment and accelerate the growth of a circular bioeconomy. &nbsp; The government said that GOBARdhan builds on initiatives such as the Sustainable Alternative Towards Affordable Transportation (SATAT) programme, the Market Development Assistance (MDA) scheme, the Biomass Aggregation Machinery (BAM) scheme, the Development of Pipeline Infrastructure (DPI) scheme and Central Financial Assistance (CFA) under the National Bioenergy Programme. These initiatives have enabled the commissioning of more than 200 CBG plants across the country, laying the foundation for scaling up the sector. &nbsp; Under the scheme, City Gas Distribution (CGD) entities will procure CBG to meet the notified blending obligation, with targets of 3 percent in FY 2026-27, 4 percent in FY 2027-28 and 5 percent from FY 2028-29 onwards for CNG (Transport) and PNG (Domestic) segments. The Cabinet has also approved a stable administered CBG price of INR 2,110 per MMBTU, backed by a government-supported pricing framework with a minimum ten-year horizon to provide long-term revenue visibility for producers. &nbsp; Eligible greenfield CBG projects will receive capital assistance of up to INR 2 crore per tonne per day (TPD) of installed capacity, while brownfield projects expanding production capacity will also qualify for sup","publishedText":"2026-08-07T01:40:31.000Z","sourceName":"Energetica India"},{"title":"Uranium &amp; Fuel Thursday, 6 August 2026--> X-Energy and C…","url":"https://www.world-nuclear-news.org/articles/x-energy-and-centrus-sign-haleu-supply-agreement","summary":"HOME / URANIUM &amp; FUEL X-Energy and Centrus sign HALEU supply agreement Thursday, 6 August 2026 Centrus Energy Corp and X-Energy have signed an agreement for Centrus to provide enrichment services for low-enriched uranium and high-assay low-enriched uranium to fuel Xe-100 high-temperature gas-cooled small modular reactors. &nbsp; How an X-Energy Xe-100 small modular reactor plant could look (Image: X-Energy) The low-enriched uranium (LEU) and high-assay low-enriched uranium (HALEU) will be produced at Centrus& ;s American Centrifuge Plant in Pike County, Ohio. The HALEU will be supplied to X-Energy& ;s fuel subsidiary TRISO-X, for the fabrication of TRISO-X-coated particle fuel at its fuel fabrication campus in Oak Ridge, Tennessee. The contract will see prepayments from X-Energy to Centrus &quot;under a phased approach to scale HALEU&nbsp;production in alignment with the advancement of X-Energy&rsquo;s commercial pipeline&quot;. HALEU fuel enriched to between 5% and 20% of the fissile uranium-235 isotope will be needed to fuel many of the advanced reactor designs that are under development. With no commercial source of the material in the USA, the US Department of Energy has been actively supporting the development of a domestic US supply chain. In 2019, it awarded Centrus a contract to license and construct a cascade of advanced centrifuges to demonstrate HALEU production at the American Centrifuge Plant in Piketon, Ohio, and in 2022 selected the company through a competitive process for the three-phase follow-on contract to bring the cascade into production and to deliver HALEU for the DOE& ;s use. Last year, Centrus announced plans for a major expansion of the plant to boost production of both low-enriched uranium and HALEU. The expansion is expected to create 1,000 construction jobs and 300 new operating jobs in Ohio alone, while retaining the 150 jobs that existed at the Piketon plant when the expansion began, the company said. Prepayment arrangements and government funding has been helping to tackle the &quot;chicken and egg&quot;&nbsp;issue where advanced reactor developers need to know they will have the fuel for their projects, while the fuel companies want to be assured of future demand before investing in new facilities. Centrus says it has a USD3 billion &quot;contingent LEU and HALEU backlog, of which USD2.4 billion is definitised&quot;. Amir Vexler, President and CEO of Centrus, said: &quot;This is another significant agreement that validates Centrus as the go-to, de-risked supplier of HALEU to the global market. Agreements like these provide important non-dilutive, non-debt capital to support our build-out and serves to advance commercial LEU and HALEU capacity expansion.&quot; X-Energy CEO J&nbsp;Clay Sell, said: &quot;Our approach is to build a resilient, long-term fuel supply strategy by partnering with enrichment providers that are investing in new HALEU production capacity. Through our agreement with Centrus, X-Energ","publishedText":"2026-08-06T05:09:38.000Z","sourceName":"World Nuclear News"},{"title":"New Nuclear Thursday, 6 August 2026--> US test reactors achi…","url":"https://www.world-nuclear-news.org/articles/us-test-reactors-achieve-milestones","summary":"HOME / NEW NUCLEAR US test reactors achieve milestones Thursday, 6 August 2026 Nuclear technology company Oklo has announced its Groves Isotope Test Reactor has achieved first criticality, while Deep Fission& ;s underground reactor has received safety design approval. Both reactors are part of the USA& ;s Reactor Pilot Program. &nbsp; (Image: Oklo) Oklo& ;s Grove reactor - located near Lockhart in Caldwell County, Texas - was one of 11 advanced reactor projects selected by the US Department of Energy (DOE) in August 2025 for the Nuclear Reactor Pilot Program, which aims to expedite the testing of advanced reactor designs that will be authorised by the DOE at sites located outside of the national laboratories. Part of the Reforming Nuclear Reactor Testing at the Department of Energy executive order signed by President Donald Trump in May last year, its goal was &quot;to construct, operate, and achieve criticality of at least three test reactors using the DOE authorisation process by 4 July, 2026&quot;. &quot;Reaching criticality in less than a year is an incredible milestone for our team,&quot; said Oklo co-founder and CEO Jacob DeWitte. &quot;Oklo developed Groves from a greenfield site on private land, completed full-scale civil excavation and construction, manufactured or commercially procured all components, including fuel, and developed its operating programmes in-house. Taken together, we believe these accomplishments establish a new benchmark for the Reactor Pilot Program and set the stage for the future of advanced nuclear deployment at scale.&quot; Groves is a low-power test reactor designed to demonstrate reactor design, build, and operations, and to establish operating experience needed to support future isotope production facilities. The project advances Oklo& ;s plans to establish domestic production of critical isotopes for potential use in cancer care, manufacturing, scientific research, space exploration, and national security. &quot;Groves demonstrates that the domestic nuclear industry can once again move from design through construction, authorisation, and startup on timelines that are measured in months rather than years when developers, suppliers, and regulators work together on an integrated deployment approach,&quot; Oklo said. The company said the project has generated practical experience in project engineering, construction, procurement, reactor operations, startup procedures, safety readiness, training, qualification work, and deployment execution that can inform future isotope production facilities. It has also established engineering practices, operating procedures, training programmes, commissioning experience, and organisational capabilities &quot;that will reduce uncertainty and execution risk across every Oklo facility, including the company& ;s future isotope, powerhouse, and fuel cycle deployments&quot;. Antares Nuclear& ;s Mark-0 reactor became the first reactor under the Reactor Pilot Program to rea","publishedText":"2026-08-06T09:33:45.000Z","sourceName":"World Nuclear News"},{"title":"Waste &amp; Recycling Friday, 7 August 2026--> US collaborat…","url":"https://www.world-nuclear-news.org/articles/us-collaboration-to-study-used-nuclear-fuel-recycling","summary":"HOME / WASTE &amp; RECYCLING US collaboration to study used nuclear fuel recycling Friday, 7 August 2026 US advanced nuclear recycling technologies firm Curio has signed a memorandum of understanding with NuScale Power and Framatome to evaluate how recovered materials from used nuclear fuel can support future fuel and product streams. &nbsp; A dry storage facility for US used nuclear fuel (Image: NAC International) Under the agreement, the partners will evaluate source-to-product and source-to-fuel pathways for materials recoverable through Curio& ;s proprietary NuCycle technology, while identifying opportunities for future engineering coordination, fuel development, qualification, fabrication, and commercialisation. The collaboration will also seek to facilitate connections across the nuclear supply chain to more seamlessly bring next-generation fuel and product streams to market. As part of the MoU, the companies will conduct technical assessments, feasibility studies, supply chain analyses, and interface evaluations to identify potential opportunities for future development agreements and commercial partnerships. Together, the parties seek to identify practical pathways that can strengthen both domestic and international nuclear fuel supply chains, support long-term energy security objectives, and help meet growing global demand for reliable, carbon-free nuclear energy. &quot;The collaboration reflects growing industry recognition that meeting future energy demand will require integrated fuel cycle solutions capable of supporting both domestic reactor deployment and expanding international nuclear energy markets,&quot; Curio said. &quot;By evaluating opportunities across the entire value chain, the parties aim to identify pathways that could support the commercialisation of advanced fuels and fuel-cycle solutions needed to power the next generation of nuclear energy systems.&quot; The parties anticipate that this collaboration may lead to future agreements focused on technology development, fuel qualification, supply chain development, and commercial deployment opportunities. &quot;America& ;s ability to lead the next era of nuclear energy will depend on more than building reactors - it will require building the fuel cycle infrastructure needed to support them,&quot; said Curio CEO Ed McGinnis. &quot;This collaboration brings together leaders in fuel recycling, fuel development, and advanced reactor deployment to evaluate innovative pathways that could strengthen domestic and international energy security, enhance fuel supply resilience, and unlock greater value from existing nuclear materials. By connecting these critical elements of the nuclear value chain, we are helping lay the foundation for a future of clean, sustainable energy.&quot; Tony Robinson, president and CEO of Framatome Inc, added: &quot;Advancing the next generation of nuclear energy demands bold innovation and strong alignment across the entire fuel cycle. At Framatome, w","publishedText":"2026-08-07T03:36:20.000Z","sourceName":"World Nuclear News"}]},{"label":"燃气轮机","items":[{"title":"Siemens Energy Q3 FY26 Revenue Rises 39.3 Percent to INR 2,4…","url":"https://www.energetica-india.net/news/siemens-energy-q3-fy26-revenue-rises-393-percent-to-inr-2486-crore-pat-jumps-678-percent","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition July-August 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Business &rsaquo;Siemens Energy Q3 FY26 Revenue Rises 39.3 Percent to INR 2,486 Crore, PAT Jumps 67.8 Percent Siemens Energy Q3 FY26 Revenue Rises 39.3 Percent to INR 2,486 Crore, PAT Jumps 67.8 Percent Siemens Energy India posted strong Q3 FY26 results with revenue reaching INR 2,486 crore, PAT rising to INR 441 crore, EBIT margin improving to 21.9 percent, and order backlog touching INR 19,331 crore. August 07, 2026. By EI News Network Siemens Energy India Ltd. (SEIL) has reported strong financial performance for the third quarter of FY2026, with revenue from operations increasing 39.3 percent year on year to INR 2,486 crore, supported by a robust order backlog and strong project execution. The company posted a profit after tax (PAT) of INR 441 crore for the quarter ended June 2026, marking a 67.8 percent increase from INR 263 crore in the corresponding quarter last year. Earnings per share (EPS) rose to INR 12.38 from INR 7.38 a year earlier. Profit from operations (EBIT) increased 73.6 percent year on year to INR 545 crore, while the operating margin improved by 430 basis points to 21.9 percent from 17.6 percent in the year ago period. The company attributed the margin expansion to improved operating leverage, higher export contributions, and disciplined order execution. During the first nine months of FY2026, revenue from operations grew 31.1 percent year on year to INR 6,791 crore, while PAT increased 52.2 percent to INR 1,128 crore. EBIT for the nine month period rose 49.2 percent to INR 1,437 crore. Siemens Energy India& ;s order backlog stood at INR 19,331 crore as of June 2026, up 16.4 percent from INR 16,601 crore a year earlier, providing strong visibility for future revenue. Commenting on the results, Guilherme Mendonca, Managing Director and Chief Executive Officer of Siemens Energy India Ltd.,&nbsp;said that the company& ;s strong Q3 FY2026 performance reflected the resilience of its business model and disciplined execution strategy. He said healthy revenue growth, expanding profitability, and a robust order backlog provide a strong foundation for sustained value creation. Mendonca noted that India added more than 30 GW of renewable energy capacity during the first half of calendar year 2026, while global electricity demand continues to rise due to electrification, industrial expansion, and AI enabled data centers. He said that Siemens Energy India is well positioned to support the country& ;s energy transition through its grid technologies, grid flexibilization solutions, advanced power generation portfolio, local manufacturing capabilities, and execution expertise. Tags: Business Siemens Energy Q3 FY26 Revenue Siemens Energy PAT Siemens Energy India Limited Siemens E","publishedText":"2026-08-07T15:17:08.000Z","sourceName":"Energetica India"},{"title":"SUS to deliver Phase II of Malaysia&#8217;s Negeri Sembilan …","url":"https://www.modernpowersystems.com/news/sus-to-deliver-phase-ii-of-malaysias-negeri-sembilan-wte-project/","summary":"News SUS to deliver Phase II of Malaysia& ;s Negeri Sembilan WtE project The facility is expected to generate approximately 177 million kWh of clean energy annually. August 5, 2026 Share Copy Link Share on X Share on Linkedin Share on Facebook (Image credit: SUS Environment) SUS Environment has signed an engineering, procurement and construction (EPC) contract for Phase II of the Negeri Sembilan Waste-to-Energy (WtE) project in Malaysia, taking responsibility for the plant’s design, equipment supply, construction and delivery. SUS Environment will lead the full EPC scope for the facility, working with local partners to deliver the waste treatment and power generation project in Negeri Sembilan, Malaysia. The project is designed to expand Malaysia’s waste treatment capacity while reducing landfill dependence and generating renewable electricity from municipal solid waste. Once completed, the facility will be capable of processing 1,008 tonnes of waste per day, equivalent to around 335,700 tonnes annually. The plant is expected to generate approximately 177 million kWh of electricity each year and avoid around 120,000 tonnes of carbon emissions annually. The development is expected to provide sustainable waste management and clean energy services, supporting Malaysia’s wider transition towards a circular economy and lower-carbon energy system. SUS Environment said the contract reflects confidence in its waste-to-energy technology, engineering capability and experience delivering projects from equipment manufacturing through to plant operation. The company will coordinate engineering design, procurement and construction activities to meet project requirements covering performance, environmental compliance, quality and safety. The Negeri Sembilan project adds to SUS Environment’s growing international portfolio of waste-to-energy developments. The company has positioned waste incineration and energy recovery as a means of addressing urban waste challenges while creating additional electricity generation capacity. SUS Environment said the project also highlights the increasing international competitiveness of Chinese environmental engineering solutions, with technologies being deployed under overseas technical and regulatory requirements. The company operates more than 90 waste-to-energy plants globally, with a combined municipal waste processing capacity of nearly 120,000 tonnes per day. Its facilities generate approximately 20,000 GWh of green electricity annually, according to company figures. As countries across Asia seek alternatives to landfill and fossil fuel-based power generation, waste-to-energy projects such as Negeri Sembilan are becoming an increasingly important part of integrated waste and energy strategies. --> Sign up for our weekly news round-up! Give your business an edge with our leading industry insights. Sign up Share Copy Link Share on X Share on Linkedin Share on Facebook Partner ter Deal Pipeline: Q a…","url":"https://about.bnef.com/insights/data-centers/bank-of-americas-robust-ai-data-center-deal-pipeline-qa/","summary":"Bank of America says AI infrastructure financing remains robust as demand grows across data centers, power and compute.","publishedText":"Thu, 06 Aug 2026 21:17:45 +0000","sourceName":"BloombergNEF"},{"title":"Regulation &amp; Safety Friday, 7 August 2026--> Newcleo set…","url":"https://www.world-nuclear-news.org/articles/newcleo-sets-out-plan-for-licensing-of-us-mox-plant","summary":"HOME / REGULATION &amp; SAFETY Newcleo sets out plan for licensing of US MOX plant Friday, 7 August 2026 France-headquartered innovative nuclear energy company Newcleo has submitted a Regulatory Engagement Plan to the US Nuclear Regulatory Commission for its planned mixed-oxide fuel manufacturing facility in the USA. &nbsp; A visualisation of the planned French MOX facility (Image: Newcleo) The Regulatory Engagement Plan (REP) sets out the proposed framework for the company& ;s pre-application engagement with the NRC. It identifies the principal regulatory and technical topics that Newcleo expects to address with NRC staff, together with technical submissions and an indicative engagement schedule. In March, Newcleo announced it had initiated pre‑application engagement with the NRC to support the future licensing of its first LFR-AS-200 lead-cooled fast reactor and an associated mixed-oxide (MOX) fuel fabrication facility in the USA. Following the submission of a letter of intent to the NRC on 23 February, Newcleo began early interactions with the NRC that were intended to familiarise NRC staff with the proposed facility designs and associated safety approaches for both the reactor and the MOX fuel fabrication facility. These discussions also supported the development of regulatory plans and facilitated NRC resource and budget planning, it said. Newcleo submitted the&nbsp;Regulatory Engagement Plan for the LFR-AS-200 - the commercial 200 MWe version of its lead-cooled fast neutron reactor - last month.&nbsp; The company said that with the submission&nbsp;for the fuel facility it has &quot;achieved a significant milestone in establishing a source of advanced nuclear fuel for its planned advanced modular reactors&quot;. &quot;This submission to the NRC is a concrete step to advance our MOX fuel facility in the US, building on the work of over 100 engineers with decades of industrial experience,&quot; said Newcleo CEO Stefano Buono. &quot;Our goal is to reduce the long-term burden of spent nuclear fuel and increase energy independence, turning existing nuclear material into a domestic resource, not a long-term liability, effectively closing the nuclear fuel cycle.&quot; In July, France& ;s nuclear safety regulator, the Autorit&eacute; de S&ucirc;ret&eacute; Nucl&eacute;aire et de Radioprotection (ASNR) - published its opinion on the safety features proposed by Newcleo for its planned French mixed-oxide fuel facility, concluding that the provisions adopted by the company for its safety approach are satisfactory at this stage. The ASNR& ;s official opinion on the submitted safety options will contribute to securing the application for authorisation to construct such a facility. Alongside its regulatory activities, Newcleo continues to develop FASTER (Fuel process Assembly Storage Training and Enhanced Reality), its engineering and testing centre in Chusclan, France. Designed to accelerate the development of its innovative fuel manufacturing pilot","publishedText":"2026-08-07T06:15:02.000Z","sourceName":"World Nuclear News"},{"title":"Indian parliamentarians stress urgency for uranium projects","url":"https://www.world-nuclear-news.org/articles/indian-parliamentarians-stress-urgency-for-uranium-projects","summary":"HOME / URANIUM &amp; FUEL Indian parliamentarians stress urgency for uranium projects Friday, 7 August 2026 The expansion of uranium mining projects in India needs to be accelerated, a parliamentary committee has said. &nbsp; An aerial view of India's Parliament (Image: Lok Sabha) The Committee on Public Undertakings& ; comments came in a report&nbsp;covering the progress of India& ;s planned nuclear energy expansion. It included the recommendations from an earlier report and the responses received from&nbsp;Nuclear Power Corporation of India Ltd (NPCIL) and the Department of Atomic Energy (DAE). The report notes DAE& ;s assurance that by 2036 &quot;Uranium Corporation of India Ltd (UCIL), Jaduguda plans to double the production by enhancing the existing mine capacity as well as setting up uranium mining projects in Jharkhand, Rajasthan and Chhattisgarh&quot;. The committee welcomes the &quot;concrete project roadmap&quot;&nbsp;provided but says &quot;nevertheless, the Committee notes that the timeline for full realisation stretches to 2036, whereas NPCIL& ;s massive capacity additions are front-loaded over the next decade. Any delay in the commissioning of these mining clusters will prolong the strategic sensitivity of relying on imported fuel lines&quot;. Both NPCIL and DAE said they noted the committee& ;s earlier observation &quot;that the Nuclear Fuel Complex (NFC) ensures complete domestic fabrication of fuel assemblies for PHWRs using uranium concentrate supplied by UCIL or imports arranged under Government oversight. The Committee observes that DAE has pursued long-term supply agreements with multiple international partners to ensure continuous fuel availability for safeguarded reactors. Also, as per NPCIL& ;s capacity expansion trajectory, PHWRs alone could require approximately 5,400 tonnes U3O8 per annum for about 25 GWe, while UCIL currently estimates catering to about 30% of this need, implicating persistent import reliance unless domestic production accelerates and diversified supply lines are established&quot;. The committee also welcomed as a &quot;constructive and encouraging step&quot;&nbsp;proposals for a joint venture between UCIL and NTPC to acquire stakes in overseas uranium assets which could stabilise &quot;long-term fuel costs and support the domestic nuclear fleet against market fluctuations and uncertainties&quot;. They also say they are looking forward to receiving updates on a potential long-term supply contract with Uzbekistan post-2026, and the establishment of strategic stockpiles &quot;calibrated to reactor refuelling cycles&quot;&nbsp;which remain &quot;a vital measure to ensure continuous operations&quot;. &quot;The Committee note that NPCIL continues to rely significantly on imported uranium, posing a strategic sensitivity with regard to stable fuel supply. The future expansion of the nuclear fleet is also closely linked with Uranium Corporation of India&rsquo;s ability to increase domestic uranium","publishedText":"2026-08-07T07:13:34.000Z","sourceName":"World Nuclear News"}]},{"label":"能源","items":[{"title":"NueGo Expands Electric Intercity Bus Network with New Routes…","url":"https://www.energetica-india.net/news/nuego-expands-electric-intercity-bus-network-with-new-routes-across-india","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition July-August 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Other Energy Applications &rsaquo;NueGo Expands Electric Intercity Bus Network with New Routes Across India NueGo Expands Electric Intercity Bus Network with New Routes Across India NueGo has launched new electric intercity bus routes, including Chennai&ndash;Tirupati, Hyderabad&ndash;Guntur and Mussoorie&ndash;Delhi, enhancing passenger safety and sustainable travel across a growing network of over 150 cities. August 07, 2026. By News Bureau NueGo, an electric intercity bus brand by GreenCell Mobility, backed by Eversource Capital announced the expansion of its network with the launch of new service routes in India. The latest expansion enhances connectivity while advancing the adoption of sustainable mobility solutions. With a rapidly growing network spanning 150 plus cities, NueGo continues to provide travellers with greater access to safe, reliable and eco-friendly intercity transportation. The newly launched services include key routes such as Chennai-Tirupati, Hyderabad&ndash;Guntur, Mussoorie&ndash;Delhi, Mussoorie&ndash;Gurugram, Gurugram&ndash;Haldwani, Coimbatore-Madurai and Tirupati&ndash;Puducherry. These routes have been strategically introduced to strengthen connectivity across high-demand business, tourism and pilgrimage travel corridors, while improving access between important regional economic centres and popular leisure destinations. The expansion further reinforces NueGo& ;s commitment to making sustainable mobility more accessible and convenient for travellers across India. Speaking on the milestone, Devendra Chawla, MD and CEO, GreenCell Mobility, said, &ldquo;We are delighted to strengthen NueGo&rsquo;s national network with the addition of several new intercity routes. This expansion aligns with our mission of transforming bus travel in India through sustainable, technology-enabled and guest-centric mobility solutions. With our continued route development, enhanced safety features and upgraded in-bus amenities, we are committed to offering guests an elevated travel experience while contributing to a greener, emission-free future.&rdquo; Safety continues to be a defining pillar for NueGo. Every bus undergoes 25 comprehensive safety checks before each departure, while the entire fleet is equipped with Advanced Driver Assistance Systems (ADAS), CCTV surveillance, GPS live tracking, Driver Monitoring Systems (DMS), driver& ;s breath analyser tests and a speed-lock mechanism capped at 80 km/hr. Reinforcing its commitment to secure and inclusive travel, NueGo also offers women-centric initiatives such as Pink Seat booking and a dedicated 24x7 women& ;s helpline. Combined with clean and hygienic coaches, well-maintained mid-points, and a guest-first service philosoph","publishedText":"2026-08-07T07:58:31.000Z","sourceName":"Energetica India"},{"title":"New Nuclear Thursday, 6 August 2026--> Bechtel assumes respo…","url":"https://www.world-nuclear-news.org/articles/bechtel-assumes-responsibility-for-polish-plant-site","summary":"HOME / NEW NUCLEAR Bechtel assumes responsibility for Polish plant site Thursday, 6 August 2026 Polskie Elektrownie Jądrowe, which plans to build Poland& ;s first nuclear power plant, announced it has handed over management of the project site to general contractor Bechtel as earthworks start on the construction site. &nbsp; The Lubiatowo-Kopalino site, pictured in February (Image: PEJ) Bechtel will be responsible for both the execution and supervision of the work carried out during the preparation of the future construction site, as well as cooperation with the investment subcontractors and ensuring safety on the site in Lubiatowo-Kopalino, in the Choczewo municipality of Pomerania in northern Poland. &quot;This is a very important day for both Bechtel and the implementation of the entire multi-year project to build a key infrastructure and energy project for our country - the first nuclear power plant in Poland,&quot; said Leszek Hołda, President of Bechtel Polska. &quot;We are formally becoming the site& ;s administrators, taking over this role from Polskie Elektrownie Jądrowe. This marks the investment& ;s transition to the next stage - a phase of further operational activities, carried out by Bechtel engineers and experts, as well as specialised contractors, including local contractors.&quot; The takeover of site management coincides with the selection of Budimex SA, one of the largest construction companies in Poland, as the main contractor for earthworks. Initially, this will include ground levelling, reconstruction and expansion of drainage systems, and construction of a network of temporary roads totalling about 16 kilometres (10 miles). Simultaneously, work will be carried out to prepare the site for future technical, logistics, and production facilities, as well as adapting existing infrastructure. An extensive construction site will also be constructed, including fuel storage and refuelling areas, car washes, equipment maintenance workshops, storage yards, and material warehouses, as well as office, staff, and sanitary facilities. Work, under the permit obtained, is scheduled to take place between the third quarter of 2026 and the first quarter of 2029. Ground movement and levelling will be carried out on the more than 300-hectare future construction site. Additional embankments will be constructed to prepare the area for the commencement of the main construction work. About 6 km of drainage ditches, along with culverts and erosion protection, will also be constructed. (Image: US Embassy Warsaw) &quot;Budimex has been involved in projects of fundamental importance to Poland& ;s development for many years,&quot; said Artur Popko, President of the Management Board of Budimex SA. &quot;For nearly 60 years, we have been building roads, railways, energy facilities, and critical infrastructure. These investments benefit millions of people every day. I am extremely satisfied that Bechtel - the general contractor of Poland& ;s first","publishedText":"2026-08-06T06:54:25.000Z","sourceName":"World Nuclear News"},{"title":"Regulation &amp; Safety Friday, 7 August 2026--> Water level…","url":"https://www.world-nuclear-news.org/articles/water-levels-to-be-increased-in-zaporizhzhias-used-fuel-ponds","summary":"HOME / REGULATION &amp; SAFETY Water levels to be increased in Zaporizhzhia's used fuel pools Friday, 7 August 2026 A decision has been taken to increase the water levels in the used fuel pools at the Zaporizhzhia Nuclear Power Plant, amid ongoing concerns about possible losses of off-site power, the International Atomic Energy Agency has said. &nbsp; A file image of Zaporizhzhia's six units (Image: Energoatom) The agency (IAEA) said its experts at the site had been informed by the operators of the plant - which has been under Russian military control since March 2022 - that &quot;the measure is intended to increase the time available before water could begin to boil off in the event of a prolonged loss of off-site power during which the site exhausted its diesel fuel supplies and could no longer continue cooling the pools&quot;. The IAEA added: &quot;The decision was taken in light of the prolonged unavailability of the 750 kV Dniprovska line and current challenges in resupplying the site&rsquo;s diesel fuel stores because of military activity in the area. The work began this week, with the IAEA team present to observe.&quot; Cooling pools are used for storing used nuclear fuel underwater. This is normally for at least five years to allow decay of radioactivity and heat. The Zaporizhzhia plant& ;s six units have all been shut down since the start of the war in 2022, with the last unit transferring to a cold shutdown in April 2024. The plant is close to the front line of Russian and Ukrainian forces and the plant has suffered a number of incidences where it has lost all external power, and had to rely on its fleet of emergency diesel generators for the power needed for essential safety functions. Nuclear power plants generally have enough diesel stored on site to operate emergency generators for an initial seven&nbsp;days&nbsp;if necessary. This ensures there is time to fix external power issues, or allow time for new supplies of diesel to be brought in if the generators are to be in use for a longer&nbsp;period. According to the IAEA there have now been 24 times that the plant has lost external power, with half of those occurring in the past four months, including twice in the past week. Director General Rafael Mariano Grossi said: &quot;This trend, with the rising number of off-site power cuts at the Zaporizhzhia Nuclear Power Plant, is deeply concerning and clearly not sustainable. The agency will continue its work to help improve the situation and support nuclear safety and security at the site.&quot; At the moment the plant is relying on a single 330 kV backup power line, with its main 750 kV power line unavailable since March. Repairs were carried out, under an IAEA-arranged localised ceasefire, but it remains unavailable because of damage to a substation which provides power to the line. Grossi said: &quot;These substation missions have a clear nuclear safety and security purpose. As set out in the seven indispensable pillars, nuclear po","publishedText":"2026-08-07T01:19:11.000Z","sourceName":"World Nuclear News"}]},{"label":"财经","items":[{"title":"GK Energy Crosses 726 MW Installed Capacity as Q1 Revenue Cl…","url":"https://www.energetica-india.net/news/gk-energy-crosses-726-mw-installed-capacity-as-q1-revenue-climbs-71-percent","summary":"Energy Guide Guide online Free signup Advertise my Company Power Plants Overview Add your plant --> Magazine Free subscription magazine Last edition July-August 2026 All magazines Our bloggers Bharat Vasandani Madhavan N. &amp; Hari... Urvish Dave Home &rsaquo; Business &rsaquo;GK Energy Crosses 726 MW Installed Capacity as Q1 Revenue Climbs 71 Percent GK Energy Crosses 726 MW Installed Capacity as Q1 Revenue Climbs 71 Percent GK Energy delivered a strong Q1 FY27 performance, driven by robust project execution, a low-capex business model and growing demand for decentralised solar solutions, while surpassing 726 MW of commissioned renewable energy capacity across India. August 07, 2026. By News Bureau GK Energy, a decentralised renewable energy infrastructure company specialising in solar infrastructure deployment across India, has announced its standalone financial results for the quarter ended June 30, 2026. For the quarter ended June 30, 2026, GK Energy reported Revenue from Operations of INR 505.19 crore, compared to INR 295.27 crore in the corresponding quarter of the previous year, registering a 71.10 percent year-on-year growth. The Company reported EBITDA of INR 86.11 crore, reflecting a 47.72 Percent year-on-year increase over INR 58.30 crore reported in Q1 FY2025&ndash;26. Profit After Tax (PAT) stood at INR 59.67 crore, compared to INR 36.94 crore in the corresponding quarter last year, representing a healthy 61.55 Percent year-on-year growth. Building on the strong foundation established during FY2025&ndash;26, the Company delivered another quarter of robust growth, driven by its low-capex operating model. Performance during the quarter was supported by sustained execution under renewable energy framework, rising demand for decentralised solar infrastructure, and strong execution capabilities. Commenting on the performance, Gopal Kabra, Chairman and Managing Director, GK Energy, said, &ldquo;India& ;s transition towards renewable energy continues to create meaningful opportunities to expand access to clean and reliable power. At GK Energy, we remain focused on building a scalable and disciplined business that delivers long-term value for all stakeholders. Our performance this quarter reflects the strength of our execution capabilities, financial discipline and the trust placed in us by our customers and partners. As the sector continues to evolve, we will remain committed to delivering sustainable growth while contributing meaningfully to India& ;s clean energy ambitions. With a strong project pipeline, strong execution ecosystem and expanding market presence, we are well positioned to sustain this growth momentum during the year.&quot; During the quarter, GK Energy continued to strengthen its operational capabilities across regions while further enhancing its project execution capacity. The Company& ;s decentralised operating model, supported by a robust ecosystem of OEM/ODM manufacturing partners and an extensive installation n","publishedText":"2026-08-07T06:57:25.000Z","sourceName":"Energetica ion hub (Bavaria &amp; Mecklenburg-Western Pomerania); a laser fusion hub (Western &amp; Northern Germany); and a fuel cycle and materials hub (Southwestern Germany). The magnetic fusion hub, STRIDE (Stellarator Technology &amp; Research for Industrial Development) will specifically focus on stellarator technology. This builds directly on Germany& ;s world-leading scientific baseline from the Wendelstein 7-X research reactor in Greifswald. Its mandate is to translate complex plasma physics into scalable industrial designs. Teams will design and integrate core systems such as high-field superconducting magnets, plasma heating mechanisms, and reactor control software. It will be led jointly by the Max Planck Institute for Plasma Physics (IPP) and startups Proxima Fusion and Gauss Fusion. Key locations are Garching and Gundremmingen (the planned former NPP site for the future Stellaris demonstrator power plant), both in Bavaria. It is backed by a €400m investment commitment from the state of Bavaria. The laser fusion hub, VEGA (Vertically Integrated Ecosystem for Laser Fusion Applications) will focus on inertial co","publishedText":"2026-08-06T10:35:00.000Z","sourceName":"Modern Power Systems"}]}]};

const PALETTE = ["#818cf8","#34d399","#fbbf24","#fb7185","#22d3ee","#a78bfa","#f472b6","#4ade80","#60a5fa","#facc15"];
const DEFAULT_COLOR = "#94a3b8";
const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];

function pad(n){return n<10?"0"+n:""+n;}
function fmtDateHuman(s){
  if(!s) return "—";
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(m){ const d=new Date(+m[1], +m[2]-1, +m[3]); return `${m[1]}年${+m[2]}月${+m[3]}日 ${WEEK[d.getDay()]}`; }
  return s;
}
function fmtWhen(s){
  if(!s) return "";
  // 已是相对描述（如 "5 天前"）直接清理尾部的 "•"
  let t = String(s).replace(/•/g,"").replace(/\s+/g," ").trim();
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t);
  if(m){ const d=new Date(+m[1], +m[2]-1, +m[3]); return `${m[1]}年${+m[2]}月${+m[3]}日`; }
  return t;
}
function truncate(s,n){
  const arr=[...(s||"")];
  return arr.length>n ? arr.slice(0,n).join("")+"…" : s;
}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(data){
  const secs = data.sections||[];
  const date = data.date || "";
  document.getElementById("dateBig").textContent = fmtDateHuman(date);
  document.getElementById("windowLine").textContent = data.windowText || "";

  let total=0; secs.forEach(s=>total+=(s.items?s.items.length:0));
  document.getElementById("totalNum").textContent = total;

  const chips=document.getElementById("secChips"), nav=document.getElementById("nav");
  chips.innerHTML=""; nav.querySelectorAll("a:not(.totop)").forEach(a=>a.remove());

  secs.forEach((s,idx)=>{
    const col=PALETTE[idx%PALETTE.length];
    const n=(s.items?s.items.length:0);
    const chip=document.createElement("div");
    chip.className="sec-chip";
    chip.innerHTML=`<span class="dot" style="background:${col}"></span>${esc(s.label)} <b>${n}</b>`;
    chip.onclick=()=>document.getElementById("sec-"+idx).scrollIntoView();
    chips.appendChild(chip);
    const link=document.createElement("a");
    link.href="#sec-"+idx; link.textContent=s.label;
    nav.insertBefore(link,nav.querySelector(".totop"));
  });

  const wrap=document.getElementById("sections");
  wrap.innerHTML="";
  let counter=0;
  secs.forEach((s,idx)=>{
    const col=PALETTE[idx%PALETTE.length];
    const sec=document.createElement("section");
    sec.className="section"; sec.id="sec-"+idx; sec.style.setProperty("--sec",col);
    const items=s.items||[];
    sec.innerHTML=`<div class="section-head"><span class="bar"></span><h2>${esc(s.label)}</h2>`
      +`<span class="cnt">${items.length} 条</span></div>`;
    const grid=document.createElement("div"); grid.className="grid";
    items.forEach(it=>{
      counter++;
      const url=it.url||"#";
      const src=it.sourceName||"未知来源";
      const sum=truncate(it.summary,60);
      const card=document.createElement("article");
      card.className="card"; card.style.setProperty("--sec",col);
      card.innerHTML=
        `<div class="top"><span class="num">${counter}</span>`
        +`<span class="src" title="${esc(src)}">${esc(src)}</span></div>`
        +`<h3><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(it.title||"")}</a></h3>`
        +`<p class="sum">${esc(sum)}</p>`
        +`<div class="foot"><a class="read" href="${esc(url)}" target="_blank" rel="noopener noreferrer">查看原文 ↗</a>`
        +`<span class="when">${esc(fmtWhen(it.publishedText))}</span></div>`;
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    wrap.appendChild(sec);
  });

  if(!secs.length){
    wrap.innerHTML=`<div class="empty">本窗口内暂无采集内容。</div>`;
  }

  const srcList=(data.sources||[]).map(s=>`<b>${esc(s)}</b>`).join("、");
  document.getElementById("footer").innerHTML=
    `总条数 <b>${total}</b> 条 · 数据来源 ${srcList||"—"}`
    +` · 报告日期 ${esc(date)} <span class="badge snap">引擎快照</span><br>`
    +`本仪表盘由 source-collection-engine 渲染：每日仅需重跑流水线即可复用同一版式。`;
}

render(EMBEDDED_DATA);
</script>
